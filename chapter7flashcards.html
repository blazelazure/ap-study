ones form the prominences of the cheeks and part of the lateral wall and floor of each orbit", "fact": "The zygomatic bones form the prominences of the cheeks and part of the lateral wall and floor of each orbit."}, {"topic": "Facial Bones", "q": "What is the mandible?", "a": "the lower jawbone, the largest and strongest facial bone", "fact": "The mandible is the lower jawbone, the largest and strongest facial bone."}, {"topic": "Special Features of the Skull", "q": "What does the nasal septum consist of?", "a": "the vomer, perpendicular plate of the ethmoid, and septal nasal cartilage", "fact": "The nasal septum consists of the vomer, perpendicular plate of the ethmoid, and septal nasal cartilage."}, {"topic": "Special Features of the Skull", "q": "Which key fact applies to “The nasal septum divides the nasal cavity…”?", "a": "The nasal septum divides the nasal cavity into left and right sides", "fact": "The nasal septum divides the nasal cavity into left and right sides."}, {"topic": "Special Features of the Skull", "q": "Which key fact applies to “Seven skull bones form each of the…”?", "a": "Seven skull bones form each of the orbits", "fact": "Seven skull bones form each of the orbits."}, {"topic": "Special Features of the Skull", "q": "Which key fact applies to “The foramina of the skull bones provide…”?", "a": "The foramina of the skull bones provide passages for nerves and blood vessels", "fact": "The foramina of the skull bones provide passages for nerves and blood vessels."}, {"topic": "Special Features of the Skull", "q": "Which key fact applies to “Sutures are immovable joints that connect most…”?", "a": "Sutures are immovable joints that connect most bones of the skull", "fact": "Sutures are immovable joints that connect most bones of the skull."}, {"topic": "Special Features of the Skull", "q": "Which key fact applies to “Examples are the coronal, sagittal, lambdoid, and…”?", "a": "Examples are the coronal, sagittal, lambdoid, and squamous sutures", "fa
