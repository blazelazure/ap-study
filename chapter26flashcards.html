const ALL=[{"topic": "Core Concepts", "q": "Which key fact applies to “Most substances in blood plasma easily pass…”?", "a": "Most substances in blood plasma easily pass through the glomerular filter", "fact": "Most substances in blood plasma easily pass through the glomerular filter."}, {"topic": "Core Concepts", "q": "What are however, blood cells and most proteins normally?", "a": "not filtered", "fact": "However, blood cells and most proteins normally are not filtered."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Glomerular filtrate amounts to up to 180…”?", "a": "Glomerular filtrate amounts to up to 180 liters of fluid per day", "fact": "Glomerular filtrate amounts to up to 180 liters of fluid per day."}, {"topic": "Core Concepts", "q": "What is this large amount of fluid?", "a": "filtered because the filter is porous and thin, the glomerular capillaries are long, and the capillary blood pressure is high", "fact": "This large amount of fluid is filtered because the filter is porous and thin, the glomerular capillaries are long, and the capillary blood pressure is high."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Glomerular blood hydrostatic pressure (GBHP) promotes filtration…”?", "a": "Glomerular blood hydrostatic pressure (GBHP) promotes filtration; capsular hydrostatic pressure (CHP) and blood colloid osmotic pressure (BCOP) oppose filtration", "fact": "Glomerular blood hydrostatic pressure (GBHP) promotes filtration; capsular hydrostatic pressure (CHP) and blood colloid osmotic pressure (BCOP) oppose filtration."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Net filtration pressure (NFP) = GBHP −…”?", "a": "Net filtration pressure (NFP) = GBHP − CHP − BCOP", "fact": "Net filtration pressure (NFP) = GBHP − CHP − BCOP."}, {"topic": "Core Concepts", "q": "What is glomerular filtration rate (gfr)?", "a": "the amount of filtrate formed in both kidneys per minute; it is normally 105–125 mL/min", "fact": "Glomerular filtration rate (GFR) is the amount of filtrate formed in both kidneys per minute; it is normally 105–125 mL/min."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Glomerular filtration rate depends on renal autoregulation…”?", "a": "Glomerular filtration rate depends on renal autoregulation, neural regulation, and hormonal regulation", "fact": "Glomerular filtration rate depends on renal autoregulation, neural regulation, and hormonal regulation."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Table 26.2 summarizes regulation of GFR…”?", "a": "Table 26.2 summarizes regulation of GFR", "fact": "Table 26.2 summarizes regulation of GFR."}, {"topic": "Core Concepts", "q": "Which key fact applies to “The countercurrent multiplier establishes an osmotic gradient…”?", "a": "The countercurrent multiplier establishes an osmotic gradient in the interstitial fluid of the renal medulla that enables production of concentrated urine when ADH is present", "fact": "The countercurrent multiplier establishes an osmotic gradient in the interstitial fluid of the renal medulla that enables production of concentrated urine when ADH is present."}, {"topic": "Evaluation of Kidney Function", "q": "What is a urinalysis?", "a": "an analysis of the volume and physical, chemical, and microscopic properties of a urine sample", "fact": "A urinalysis is an analysis of the volume and physical, chemical, and microscopic properties of a urine sample."}, {"topic": "Evaluation of Kidney Function", "q": "Which key fact applies to “Table 26.5 summarizes the principal physical characteristics…”?", "a": "Table 26.5 summarizes the principal physical characteristics of normal urine", "fact": "Table 26.5 summarizes the principal physical characteristics of normal urine."}, {"topic": "Evaluation of Kidney Function", "q": "What does chemically, normal urine contain?", "a": "about 95% water and 5% solutes", "fact": "Chemically, normal urine contains about 95% water and 5% solutes."}, {"topic": "Evaluation of Kidney Function", "q": "Which key fact applies to “The solutes normally include urea, creatinine, uric…”?", "a": "The solutes normally include urea, creatinine, uric acid, urobilinogen, and various ions", "fact": "The solutes normally include urea, creatinine, uric acid, urobilinogen, and various ions."}, {"topic": "Evaluation of Kidney Function", "q": "Which key fact applies to “Table 26.6 lists several abnormal components that…”?", "a": "Table 26.6 lists several abnormal components that can be detected in a urinalysis, including albumin, glucose, red and white blood cells, ketone bodies, bilirubin, excessive urobilinogen, casts, and microbes", "fact": "Table 26.6 lists several abnormal components that can be detected in a urinalysis, including albumin, glucose, red and white blood cells, ketone bodies, bilirubin, excessive urobilinogen, casts, and microbes."}, {"topic": "Evaluation of Kidney Function", "q": "What does renal clearance refer to?", "a": "the ability of the kidneys to clear (remove) a specific substance from blood", "fact": "Renal clearance refers to the ability of the kidneys to clear (remove) a specific substance from blood."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "What is tubular reabsorption?", "a": "a selective process that reclaims materials from tubular fluid and returns them to the bloodstream", "fact": "Tubular reabsorption is a selective process that reclaims materials from tubular fluid and returns them to the bloodstream."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "Which key fact applies to “Reabsorbed substances include water, glucose, amino acids…”?", "a": "Reabsorbed substances include water, glucose, amino acids, urea, and ions, such as sodium, chloride, potassium, bicarbonate, and phosphate (Table 26.3)", "fact": "Reabsorbed substances include water, glucose, amino acids, urea, and ions, such as sodium, chloride, potassium, bicarbonate, and phosphate (Table 26.3)."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "What are the ureters?", "a": "retroperitoneal and consist of a mucosa, muscular layer, and adventitia", "fact": "The ureters are retroperitoneal and consist of a mucosa, muscular layer, and adventitia."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "Which key fact applies to “They transport urine from the renal pelvis…”?", "a": "They transport urine from the renal pelvis to the urinary bladder, primarily via peristalsis", "fact": "They transport urine from the renal pelvis to the urinary bladder, primarily via peristalsis."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "What are some substances not needed by the body?", "a": "removed from the blood and discharged into the urine via tubular secretion", "fact": "Some substances not needed by the body are removed from the blood and discharged into the urine via tubular secretion."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "Which key fact applies to “Included are ions (K+, H+, and NH4+)…”?", "a": "Included are ions (K+, H+, and NH4+), urea, creatinine, and certain drugs", "fact": "Included are ions (K+, H+, and NH4+), urea, creatinine, and certain drugs."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "Which key fact applies to “Reabsorption routes include both paracellular (between tubule…”?", "a": "Reabsorption routes include both paracellular (between tubule cells) and transcellular (across tubule cells) routes", "fact": "Reabsorption routes include both paracellular (between tubule cells) and transcellular (across tubule cells) routes."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "What is the maximum amount of a substance that can be reabsorbed per unit time called?", "a": "the transport maximum (Tm)", "fact": "The maximum amount of a substance that can be reabsorbed per unit time is called the transport maximum (Tm)."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "What is about 80% of water reabsorption?", "a": "obligatory; it occurs via osmosis, together with reabsorption of solutes, and is not hormonally regulated", "fact": "About 80% of water reabsorption is obligatory; it occurs via osmosis, together with reabsorption of solutes, and is not hormonally regulated."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "What is the remaining 20%?", "a": "facultative water reabsorption, which varies according to body needs and is regulated by antidiuretic hormone", "fact": "The remaining 20% is facultative water reabsorption, which varies according to body needs and is regulated by antidiuretic hormone."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "What are sodium ions?", "a": "reabsorbed throughout the basolateral membrane via primary active transport", "fact": "Sodium ions are reabsorbed throughout the basolateral membrane via primary active transport."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "What are in the proximal convoluted tubule, na+ ions?", "a": "reabsorbed through the apical membranes via Na+–glucose symporters and Na+–H+ antiporters; water is reabsorbed via osmosis; Cl−, K+, Ca2+, Mg2+, and urea are reabsorbed via passive diffusion; and NH3 and NH4+ are secreted", "fact": "In the proximal convoluted tubule, Na+ ions are reabsorbed through the apical membranes via Na+–glucose symporters and Na+–H+ antiporters; water is reabsorbed via osmosis; Cl−, K+, Ca2+, Mg2+, and urea are reabsorbed via passive diffusion; and NH3 and NH4+ are secreted."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "Which key fact applies to “The nephron loop reabsorbs 25% of the…”?", "a": "The nephron loop reabsorbs 25% of the filtered Na+, K+, Ca2+, and HCO3−; 35% of the filtered Cl−; and 15% of the filtered water", "fact": "The nephron loop reabsorbs 25% of the filtered Na+, K+, Ca2+, and HCO3−; 35% : "a tube leading from the floor of the urinary bladder to the exterior", "fact": "The urethra is a tube leading from the floor of the urinary bladder to the exterior."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "Which key fact applies to “Its anatomy and histology differ in females…”?", "a": "Its anatomy and histology differ in females and males", "fact": "Its anatomy and histology differ in females and males."}, {"topic": "Urine Transportation, Storage, and Elimination", "q": "Which key fact applies to “In both sexes, the urethra functions to…”?", "a": "In both sexes, the urethra functions to discharge urine from the body; in males, it discharges semen as well", "fact": "In both sexes, the urethra functions to discharge urine from the body; in males, it discharges semen as well."}, {"topic": "Waste Management in Other Body Systems", "q": "Which key fact applies to “Besides the kidneys, several other tissues, organs…”?", "a": "Besides the kidneys, several other tissues, organs, and processes temporarily confine wastes, transport waste materials for disposal, recycle materials, and excrete excess or toxic substances", "fact": "Besides the kidneys, several other tissues, organs, and processes temporarily confine wastes, transport waste materials for disposal, recycle materials, and excrete excess or toxic substances."}, {"topic": "Waste Management in Other Body Systems", "q": "Which key fact applies to “Buffers bind excess H+, the blood transports…”?", "a": "Buffers bind excess H+, the blood transports wastes, the liver converts toxic substances into less toxic ones, the lungs exhale CO2, sweat glands help eliminate excess heat, and the digestive canal eliminates solid wastes", "fact": "Buffers bind excess H+, the blood transports wastes, the liver converts toxic substances into less toxic ones, the lungs exhale CO2, sweat glands help eliminate excess heat, and the digestive canal eliminates solid wastes."}, {"topic": "Waste Management in Other Body Systems", "q": "What does in the collecting duct, principal cells reabsorb na+ and secrete?", "a": "K+; intercalated cells reabsorb K+ and HCO3− and secrete H+", "fact": "In the collecting duct, principal cells reabsorb Na+ and secrete K+; intercalated cells reabsorb K+ and HCO3− and secrete H+."}, {"topic": "Development of the Urinary System", "q": "Which key fact applies to “Angiotensin II, aldosterone, antidiuretic hormone, atrial natriuretic…”?", "a": "Angiotensin II, aldosterone, antidiuretic hormone, atrial natriuretic peptide, and parathyroid hormone regulate solute and water reabsorption, as summarized in Table 26.4", "fact": "Angiotensin II, aldosterone, antidiuretic hormone, atrial natriuretic peptide, and parathyroid hormone regulate solute and water reabsorption, as summarized in Table 26.4."}, {"topic": "Development of the Urinary System", "q": "Which key fact applies to “The kidneys develop in the following sequence…”?", "a": "The kidneys develop in the following sequence: pronephros, mesonephros, and metanephros", "fact": "The kidneys develop in the following sequence: pronephros, mesonephros, and metanephros."}, {"topic": "Development of the Urinary System", "q": "Which key fact applies to “Only the metanephros remains and develops into…”?", "a": "Only the metanephros remains and develops into a functional kidney", "fact": "Only the metanephros remains and develops into a functional kidney."}, {"topic": "Aging and the Urinary System", "q": "What does in the absence of antidiuretic hormone (adh), the kidneys produce?", "a": "dilute urine; renal tubules absorb more solutes than water", "fact": "In the absence of antidiuretic hormone (ADH), the kidneys produce dilute urine; renal tubules absorb more solutes than water."}, {"topic": "Aging and the Urinary System", "q": "Which key fact applies to “With aging, the kidneys shrink in size…”?", "a": "With aging, the kidneys shrink in size, have a decreased blood flow, and filter less blood", "fact": "With aging, the kidneys shrink in size, have a decreased blood flow, and filter less blood."}, {"topic": "Aging and the Urinary System", "q": "What does in the presence of adh, the kidneys produce?", "a": "concentrated urine; large amounts of water are reabsorbed from the tubular fluid into interstitial fluid, increasing solute concentration of the urine", "fact": "In the presence of ADH, the kidneys produce concentrated urine; large amounts of water are reabsorbed from the tubular fluid into interstitial fluid, increasing solute concentration of the urine."}, {"topic": "Aging and the Urinary System", "q": "Which key fact applies to “Common problems related to aging include urinary…”?", "a": "Common problems related to aging include urinary tract infections, increased frequency of urination, urinary retention or incontinence, and renal calculi", "fact": "Common problems related to aging include urinary tract infections, increased frequency of urination, urinary retention or incontinence, and renal calculi."}, {"topic": "Aging and the Urinary System", "q": "Which key fact applies to “The kidneys develop from intermediate mesoderm…”?", "a": "The kidneys develop from intermediate mesoderm", "fact": "The kidneys develop from intermediate mesoderm."}, {"topic": "Course Study Guide", "q": "Which key fact applies to “Area of the body containing the urinary…”?", "a": "Area of the body containing the urinary bladder, reproductive organs,", "fact": "Area of the body containing the urinary bladder, reproductive organs,"}, {"topic": "Course Study Guide", "q": "Which key fact applies to “rectum, remainder of large intestine, and appendix…”?", "a": "rectum, remainder of large intestine, and appendix", "fact": "rectum, remainder of large intestine, and appendix."}, {"topic": "Course Study Guide", "q": "Which key fact applies to “Terms Referring to Regions in the Abdominopelvic…”?", "a": "Terms Referring to Regions in the Abdominopelvic Cavity:", "fact": "Terms Referring to Regions  System", "q": "What is nephrology (nef-rol-ō-jē; nephr- = kidney; -ology = study of)?", "a": "the scientific study of the anatomy, physiology, and pathology of the kidneys", "fact": "Nephrology (nef-ROL-ō-jē; nephr- = kidney; -ology = study of) is the scientific study of the anatomy, physiology, and pathology of the kidneys."}, {"topic": "Components of the Urinary System", "q": "Which key fact applies to “The branch of medicine that deals with…”?", "a": "The branch of medicine that deals with the male and female urinary systems and the male • Excretion of wastes", "fact": "The branch of medicine that deals with the male and female urinary systems and the male • Excretion of wastes."}, {"topic": "Components of the Urinary System", "q": "Which key fact applies to “By forming urine, the kidneys help excrete…”?", "a": "By forming urine, the kidneys help excrete wastes from the body", "fact": "By forming urine, the kidneys help excrete wastes from the body."}, {"topic": "Components of the Urinary System", "q": "Which key fact applies to “Some wastes excreted in urine result from…”?", "a": "Some wastes excreted in urine result from metabolic reactions", "fact": "Some wastes excreted in urine result from metabolic reactions."}, {"topic": "Components of the Urinary System", "q": "Which key fact applies to “These include urea and ammonia from the…”?", "a": "These include urea and ammonia from the deamination of amino acids; creatinine from the breakdown of creatine phosphate; uric acid from the catabolism of nucleic acids; and urobilin from the breakdown of hemoglobin", "fact": "These include urea and ammonia from the deamination of amino acids; creatinine from the breakdown of creatine phosphate; uric acid from the catabolism of nucleic acids; and urobilin from the breakdown of hemoglobin."}, {"topic": "Components of the Urinary System", "q": "What are urea, a mmonia, creatinine, uric acid, and urobilin?", "a": "collectively known as nitrogenous wastes because they are was
