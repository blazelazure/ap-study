ay."}, {"topic": "Somatic Sensations", "q": "Which key fact applies to “Somatic sensations include tactile sensations (touch, pressure…”?", "a": "Somatic sensations include tactile sensations (touch, pressure, vibration, itch, and tickle), thermal sensations (warmth and cold), pain, and proprioception", "fact": "Somatic sensations include tactile sensations (touch, pressure, vibration, itch, and tickle), thermal sensations (warmth and cold), pain, and proprioception."}, {"topic": "Somatic Sensations", "q": "What are receptors for tactile, thermal, and pain sensations?", "a": "located in the skin, subcutaneous tissue, and mucous membranes of the mouth, vagina, and anus", "fact": "Receptors for tactile, thermal, and pain sensations are located in the skin, subcutaneous tissue, and mucous membranes of the mouth, vagina, and anus."}, {"topic": "Somatic Sensations", "q": "What are receptors for touch?", "a": "(a) tactile corpuscles of touch and hair root plexuses, which are rapidly adapting, and (b) slowly adapting", "fact": "Receptors for touch are (a) tactile corpuscles of touch and hair root plexuses, which are rapidly adapting, and (b) slowly adapting"}, {"topic": "Somatic Sensations", "q": "Which key fact applies to “Nerve impulses for pain, temperature, touch, and…”?", "a": "Nerve impulses for pain, temperature, touch, and pressure ascend to the cerebral cortex along the anterolateral pathway", "fact": "Nerve impulses for pain, temperature, touch, and pressure ascend to the cerebral cortex along the anterolateral pathway."}, {"topic": "Somatic Sensations", "q": "Which key fact applies to “Nerve impulses for pain, temperature, touch, and…”?", "a": "Nerve impulses for pain, temperature, touch, and proprioception from the face, nasal cavity, oral cavity, and teeth ascend to the cerebral cortex along the trigeminothalamic pathway", "fact": "Nerve impulses for pain, temperature, touch, and proprioception from the face, nasal cavity, oral cavity, and teeth ascend to the ur neural circuits participate in control of movement by providing input to lower motor neurons: local circuit neurons, upper motor neurons, basal nuclei neurons, and cerebellar neurons", "fact": "Neurons in four neural circuits participate in control of movement by providing input to lower motor neurons: local circuit neurons, upper motor neurons, basal nuclei neurons, and cerebellar neurons."}, {"topic": "Control of Body Movement", "q": "Which key fact applies to “Table 16.4 summarizes the major somatic motor…”?", "a": "Table 16.4 summarizes the major somatic motor pathways", "fact": "Table 16.4 summarizes the major somatic motor pathways."}, {"topic": "Control of Body Movement", "q": "Which key fact applies to “Neurons of the corpus striatum assist movement…”?", "a": "Neurons of the corpus striatum assist movement by providing input to the upper motor neurons", "fact": "Neurons of the corpus striatum assist movement by providing input to the upper motor neurons."}, {"topic": "Control of Body Movement", "q": "Which key fact applies to “They help initiate and suppress movements…”?", "a": "They help initiate and suppress movements", "fact": "They help initiate and suppress movements."}, {"topic": "Control of Body Movement", "q": "Which key fact applies to “Vestibular nuclei in the medulla and pons…”?", "a": "Vestibular nuclei in the medulla and pons play an important role in regulating posture; the reticular formation helps control posture and muscle tone; the superior colliculus allows the body to respond to sudden visual stimuli and permits rapid movements of the eyes; and the red nucleus permits fine, precise, voluntary movements of the distal parts of the upper limbs", "fact": "Vestibular nuclei in the medulla and pons play an important role in regulating posture; the reticular formation helps control posture and muscle tone; the superior colliculus allows the body to respond to sudden visual stimuli and permits rapid movements of the eyes; and the red nucleus permits fine, precise, voluntary movements of the distal parts of the upper limbs."}, {"topic": "Control of Body Movement", "q": "What is the cerebellum?", "a": "active in learning and performing rapid, coordinated, highly skilled movements", "fact": "The cerebellum is active in learning and performing rapid, coordinated, highly skilled movements."}, {"topic": "Control of Body Movement", "q": "Which key fact applies to “It also contributes to maintaining balance and…”?", "a": "It also contributes to maintaining balance and posture", "fact": "It also contributes to maintaining balance and posture."}, {"topic": "Integrative Functions of the Cerebrum", "q": "What is the primary motor cortex (precentral gyrus)?", "a": "a major control region for executing voluntary movements", "fact": "The primary motor cortex (precentral gyrus) is a major control region for executing voluntary movements."}, {"topic": "Integrative Functions of the Cerebrum", "q": "What are sleep and wakefulness?", "a": "integrative functions that are controlled by the suprachiasmatic nucleus and the reticular activating system", "fact": "Sleep and wakefulness are integrative functions that are controlled by the suprachiasmatic nucleus and the reticular activating system."}, {"topic": "Integrative Functions of the Cerebrum", "q": "Which key fact applies to “The axons of upper motor neurons extend…”?", "a": "The axons of upper motor neurons extend from the brain to lower motor neurons via direct and indirect motor pathways", "fact": "The axons of upper motor neurons extend from the brain to lower motor neurons via direct and indirect motor pathways."}, {"topic": "Integrative Functions of the Cerebrum", "q": "What does non-rapid eye movement sleep consist of?", "a": "four stages", "fact": "Non-rapid eye movement sleep consists of four stages."}, {"topic": "Integrative Functions of the Cerebrum", "q": "Which key fact applies to “The direct pathways include the corticospinal pathways…”?", "a": "The direct pathways include the corticospinal pathways and the corticobulbar pathway", "fact": "The direct pathways include the corticospinal pathways and the corticobulbar pathway."}, {"topic": "Integrative Functions of the Cerebrum", "q": "Which key fact applies to “The corticospinal pathways convey nerve impulses from…”?", "a": "The corticospinal pathways convey nerve impulses from the motor cortex to skeletal muscles in the limbs and trunk", "fact": "The corticospinal pathways convey nerve impulses from the motor cortex to skeletal muscles in the limbs and trunk."}, {"topic": "Integrative Functions of the Cerebrum", "q": "Which key fact applies to “The corticobulbar pathway conveys nerve impulses from…”?", "a": "The corticobulbar pathway conveys nerve impulses from the motor cortex to skeletal muscles in the head", "fact": "The corticobulbar pathway conveys nerve impulses from the motor cortex to skeletal muscles in the head."}, {"topic": "Integrative Functions of the Cerebrum", "q": "Which key fact applies to “Coma is a state of unconsciousness in…”?", "a": "Coma is a state of unconsciousness in which an individual has little or no response to stimuli", "fact": "Coma is a state of unconsciousness in which an individual has little or no response to stimuli."}, {"topic": "Integrative Functions of the Cerebrum", "q": "Which key fact applies to “Indirect pathways extend from several motor centers…”?", "a": "Indirect pathways extend from several motor centers of the brainstem into the spinal cord", "fact": "Indirect pathways extend from several motor centers of the brainstem into the spinal cord."}, {"topic": "Integrative Functions of the Cerebrum", "q": "Which key fact applies to “Indirect pathways include the rubrospinal, tectospinal, vestibulospinal…”?", "a": "Indirect pathways include the rubrospinal, tectospinal, vestibulospinal, and medial and lateral reticulospinal tracts", "fact": "Indirect pathways include the rubrospinal, tectospinal, vestibulospinal, and medial and lateral reticulospinal tracts."}, {"topic": "Integrative Functions of the Cerebrum", "q": "Which key fact applies to “Most dreaming occurs during rapid eye movement…”?", "a": "Most dreaming occurs during rapid eye movement sleep", "fact": "Most dreaming occurs during rapid eye movement sleep."}, {"topic": "Integrative Functions of the Cerebrum", "q": "Which key fact applies to “Learning is the ability to acquire new…”?", "a": "Learning is the ability to acquire new information or skills through instruction or experience", "fact": "Learning is the ability to acquire new information or skills through instruction or experience."}, {"topic": "Integrative Functions of the Cerebrum", "q": "Which key fact applies to “Memory is the process by which information…”?", "a": "Memory is the process by which information acquired through learning is stored and retrieved", "fact": "Memory is the process by which information acquired through learning is stored and retrieved."}, {"topic": "Integrative Functions of the Cerebrum", "q": "Which key fact applies to “Language is a system of vocal sounds…”?", "a": "Language is a system of vocal sounds and symbols that conveys information", "fact": "Language is a system of vocal sounds and symbols that conveys information."}, {"topic": "Sensory, Motor, and Integrative Systems", "q": "Which key fact applies to “Sensation OBJECTIVE S • Define sensation, and…”?", "a": "Sensation OBJECTIVE S • Define sensation, and discuss the components of sensation", "fact": "Sensation OBJECTIVE S • Define sensation, and discuss the components of sensation."}, {"topic": "Sensory, Motor, and Integrative Systems", "q": "What is in its broadest definition, sensation?", "a": "the conscious or subconscious awareness of changes in the external or internal environment", "fact": "In its broadest definition, sensation is the conscious or subconscious awareness of changes in the external or internal environment."}, {"topic": "Sensory, Motor, and Integrative Systems", "q": "Which key fact applies to “The nature of the sensation and the…”?", "a": "The nature of the sensation and the type of reaction generated vary according to the ultimate destination of nerve impulses that convey sensory information to the CNS", "fact": "The nature of the sensation and the type of reaction generated vary according to the ultimate destination of nerve impulses that convey sensory information to the CNS."}, {"topic": "Sensory, Motor, and Integrative Systems", "q": "Which key fact applies to “Sensory impulses that reach the spinal cord…”?", "a": "Sensory impulses that reach the spinal cord may serve as input for spinal reflexes, such as the stretch reflex you learned about in Chapter 13", "fact": "Sensory impulses that reach the spinal cord may serve as input for spinal reflexes, such as the stretch reflex you learned about in Chapter 13."}, {"topic": "Sensory, Motor, and Integrative Systems", "q": "Which key fact applies to “Sensory impulses that reach the lower brainstem…”?", "a": "Sensory impulses that reach the lower brainstem elicit more complex reflexes, such as changes in heart rate or breathing rate", "fact": "Sensory impulses that reach the lower brainstem elicit more complex reflexes, such as changes in heart rate or breathing rate."}, {"topic": "Sensory, Motor, and Integrative Systems", "q": "Which key fact applies to “When sensory impulses reach the cerebral cortex…”?", "a": "When sensory impulses reach the cerebral cortex, we become consciously aware of the sensory stimuli and can precisely locate and identify specific sensations such as touch, pain, hearing, or taste", "fact": "When sensory impulses reach the cerebral cortex, we become consciously aware of the sensory stimuli and can precisely locate and identify specific sensations such as touch, pain, hearing, or taste."}, {"topic": "Sensory, Motor, and Integrative Systems", "q": "What is as you learned in chapter 14, perception?", "a": "the conscious interpretation of sensations and is primarily a function of the cerebral cortex", "fact": "As you learned in Chapter 14, perception is the conscious interpretation of sensations and is primarily a function of the cerebral cortex."}, {"topic": "Sensory, Motor, and Integrative Systems", "q": "Which key fact applies to “There are four modalities of somatic sensations…”?", "a": "There are four modalities of somatic sensations: tactile, thermal, pain, and proprioceptive", "fact": "There are four modalities of somatic sensations: tactile, thermal, pain, and proprioceptive."}, {"topic": "Sensory, Motor, and Integrative Systems", "q": "Which key fact applies to “Tactile Sensations OBJeCtIVeS • Describe the location…”?", "a": "Tactile Sensations OBJeCtIVeS • Describe the location and function of the somatic sensory receptors for tactile, thermal, and pain sensations", "fact": "Tactile Sensations OBJeCtIVeS • Describe the location and function of the somatic sensory receptors for tactile, thermal, and pain sensations."}, {"topic": "Sensory, Motor, and Integrative Systems", "q": "What are somatic sensations?", "a": "sensations that arise from stimulation of sensory receptors embedded in the skin or subcutaneous tissue; in mucous membranes of the mouth, vagina, and anus; and in skeletal muscles, tendons, and joints", "fact": "Somatic sensations are sensations that arise from stimulation of sensory receptors embedded in the skin or subcutaneous tissue; in mucous membranes of the mouth, vagina, and anus; and in skeletal muscles, tendons, and joints."}, {"topic": "Sensory, Motor, and Integrative Systems", "q": "What are the sensory receptors for somatic sensations?", "a": "distributed unevenly—some parts of the body surface are densely populated with receptors, and others contain only a few", "fact": "The sensory receptors for somatic sensations are distributed unevenly—some parts of the body surface are densely populated with receptors, and others contain only a few."}, {"topic": "Sensory, Motor, and Integrative Syst
