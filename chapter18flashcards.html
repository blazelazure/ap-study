xus in the anterior pituitary by the hypophyseal portal veins."}, {"topic": "Hypothalamus and Pituitary Gland", "q": "Which key fact applies to “The anterior pituitary consists of somatotrophic cells…”?", "a": "The anterior pituitary consists of somatotrophic cells that produce growth hormone, prolactin cells that produce prolactin, corticotrophic cells that secrete adrenocorticotropic hormone and melanocyte-stimulating hormone, thyrotrophic cells that secrete thyroid-stimulating hormone, and gonadotrophic cells that synthesize follicle-stimulating hormone and luteinizing hormone (LH)", "fact": "The anterior pituitary consists of somatotrophic cells that produce growth hormone, prolactin cells that produce prolactin, corticotrophic cells that secrete adrenocorticotropic hormone and melanocyte-stimulating hormone, thyrotrophic cells that secrete thyroid-stimulating hormone, and gonadotrophic cells that synthesize follicle-stimulating hormone and luteinizing hormone (LH)."}, {"topic": "Hypothalamus and Pituitary Gland", "q": "Which key fact applies to “Growth hormone stimulates body growth through insulinlike…”?", "a": "Growth hormone stimulates body growth through insulinlike growth factors", "fact": "Growth hormone stimulates body growth through insulinlike growth factors."}, {"topic": "Hypothalamus and Pituitary Gland", "q": "What is secretion of growth hormone?", "a": "inhibited by growth hormone– inhibiting hormone, or somatostatin, and promoted by growth hormone–releasing hormone", "fact": "Secretion of growth hormone is inhibited by growth hormone– inhibiting hormone, or somatostatin, and promoted by growth hormone–releasing hormone."}, {"topic": "Hypothalamus and Pituitary Gland", "q": "Which key fact applies to “Thyroid stimulating hormone regulates thyroid gland activities…”?", "a": "Thyroid stimulating hormone regulates thyroid gland activities", "fact": "Thyroid stimulating hormone regulates thyroid gland activities."}, {"topic": "Hypothalamus and Pituitary Gland", "q": "What is its secretion?", "a": "stimulated by TRH thyrotropin-releasing hormone and suppressed by growth hormone-releasing factor", "fact": "Its secretion is stimulated by TRH thyrotropin-releasing hormone and suppressed by growth hormone-releasing factor."}, {"topic": "Hypothalamus and Pituitary Gland", "q": "Which key fact applies to “Follicle-stimulating hormone and luteinizing hormone regulate the…”?", "a": "Follicle-stimulating hormone and luteinizing hormone regulate the activities of the gonads—ovaries and testes", "fact": "Follicle-stimulating hormone and luteinizing hormone regulate the activities of the gonads—ovaries and testes."}, {"topic": "Hypothalamus and Pituitary Gland", "q": "What is their secretion?", "a": "controlled by gonadotropin-releasing hormone", "fact": "Their secretion is controlled by gonadotropin-releasing hormone."}, {"topic": "Hypothalamus and Pituitary Gland", "q": "Which key fact applies to “Prolactin helps initiate milk secretion…”?", "a": "Prolactin helps initiate milk secretion", "fact": "Prolactin helps initiate milk secretion."}, {"topic": "Hypothalamus and Pituitary Gland", "q": "Which key fact applies to “Prolactin-inhibiting hormone suppresses secretion of prolactin; prolactin-releasing…”?", "a": "Prolactin-inhibiting hormone suppresses secretion of prolactin; prolactin-releasing hormone stimulates prolactin secretion", "fact": "Prolactin-inhibiting hormone suppresses secretion of prolactin; prolactin-releasing hormone stimulates prolactin secretion."}, {"topic": "Hypothalamus and Pituitary Gland", "q": "What is adrenocorticotropic hormone regulates the activities of the suprarenal cortex and?", "a": "controlled by corticotropin-releasing hormone", "fact": "Adrenocorticotropic hormone regulates the activities of the suprarenal cortex and is controlled by corticotropin-releasing hormone."}, {"topic": "Hypothalamus and Pituitary Gland", "q": "Which key fact applies to “Dopamine inhibits secretion of melanocyte-s itonin", "fact": "It consists of thyroid follicles composed of T thyrocytes, which secrete the thyroid hormones thyroxine (T4) and triiodothyronine (T3), plus thyroglobulin, and C thyrocytes, which secrete calcitonin."}, {"topic": "Thyroid Gland", "q": "What are thyroid hormones?", "a": "synthesized from iodine and tyrosine within thyroglobulin", "fact": "Thyroid hormones are synthesized from iodine and tyrosine within thyroglobulin."}, {"topic": "Thyroid Gland", "q": "Which key fact applies to “They are transported in the blood bound…”?", "a": "They are transported in the blood bound to plasma proteins, mostly thyroxine-binding globulin", "fact": "They are transported in the blood bound to plasma proteins, mostly thyroxine-binding globulin."}, {"topic": "Thyroid Gland", "q": "Which key fact applies to “Secretion is controlled by TRH from the…”?", "a": "Secretion is controlled by TRH from the hypothalamus and thyroid- stimulating hormone from the anterior pituitary", "fact": "Secretion is controlled by TRH from the hypothalamus and thyroid- stimulating hormone from the anterior pituitary."}, {"topic": "Thyroid Gland", "q": "Which key fact applies to “Thyroid hormones regulate oxygen use and metabolic…”?", "a": "Thyroid hormones regulate oxygen use and metabolic rate, cellular metabolism, and growth and development", "fact": "Thyroid hormones regulate oxygen use and metabolic rate, cellular metabolism, and growth and development."}, {"topic": "Thyroid Gland", "q": "Which key fact applies to “Calcitonin can lower the blood level of…”?", "a": "Calcitonin can lower the blood level of calcium ions (Ca2+) and promote deposition of Ca2+ into bone matrix", "fact": "Calcitonin can lower the blood level of calcium ions (Ca2+) and promote deposition of Ca2+ into bone matrix."}, {"topic": "Thyroid Gland", "q": "What is secretion of calcitonin?", "a": "controlled by the Ca2+ level in the blood", "fact": "Secretion of calcitonin is controlled by the Ca2+ level in the blood."}, {" ls", "fact": "The suprarenal cortex is divided into a zona glomerulosa, a zona fasciculata, and a zona reticularis; the suprarenal medulla consists of chromaffin cells and large blood vessels."}, {"topic": "Suprarenal Glands", "q": "Which key fact applies to “Cortical secretions include mineralocorticoids, glucocorticoids, and ndrogens…”?", "a": "Cortical secretions include mineralocorticoids, glucocorticoids, and ndrogens", "fact": "Cortical secretions include mineralocorticoids, glucocorticoids, and ndrogens."}, {"topic": "Suprarenal Glands", "q": "Which key fact applies to “Mineralocorticoids (mainly aldosterone) increase sodium and water…”?", "a": "Mineralocorticoids (mainly aldosterone) increase sodium and water reabsorption and decrease potassium reabsorption", "fact": "Mineralocorticoids (mainly aldosterone) increase sodium and water reabsorption and decrease potassium reabsorption."}, {"topic": "Suprarenal Glands", "q": "Which key fact applies to “Secretion is controlled by the renin–angiotensin–aldosterone pathway…”?", "a": "Secretion is controlled by the renin–angiotensin–aldosterone pathway and by K+ level in the blood", "fact": "Secretion is controlled by the renin–angiotensin–aldosterone pathway and by K+ level in the blood."}, {"topic": "Suprarenal Glands", "q": "Which key fact applies to “694 C h a pt er 18…”?", "a": "694 C h a pt er 18 The Endocrine System", "fact": "694 C h a pt er 18 The Endocrine System"}, {"topic": "Suprarenal Glands", "q": "Which key fact applies to “Glucocorticoids (mainly cortisol) promote protein breakdown, gluconeogenesis…”?", "a": "Glucocorticoids (mainly cortisol) promote protein breakdown, gluconeogenesis, and lipolysis; help resist stress; and serve as anti- inflammatory substances", "fact": "Glucocorticoids (mainly cortisol) promote protein breakdown, gluconeogenesis, and lipolysis; help resist stress; and serve as anti- inflammatory substances."}, {"topic": "Suprarenal Glands", "q": "What is their secretion?", "a": "controlled by adrenocorticotropic hormone", "fact": "Their secretion is controlled by adrenocorticotropic hormone."}, {"topic": "Suprarenal Glands", "q": "What are growth factors?", "a": "local hormones that stimulate cell growth and division", "fact": "Growth factors are local hormones that stimulate cell growth and division."}, {"topic": "Suprarenal Glands", "q": "Which key fact applies to “Androgens secreted by the suprarenal cortex stimulate…”?", "a": "Androgens secreted by the suprarenal cortex stimulate growth of axillary and pubic hair, aid the prepubertal growth spurt, and contribute to libido", "fact": "Androgens secreted by the suprarenal cortex stimulate growth of axillary and pubic hair, aid the prepubertal growth spurt, and contribute to libido."}, {"topic": "Suprarenal Glands", "q": "What is productive stress?", "a": "termed eustress, and harmful stress is termed distress", "fact": "Productive stress is termed eustress, and harmful stress is termed distress."}, {"topic": "Suprarenal Glands", "q": "What does the suprarenal medulla secrete?", "a": "epinephrine and norepinephrine, which are released during stress and produce effects similar to sympathetic responses", "fact": "The suprarenal medulla secretes epinephrine and norepinephrine, which are released during stress and produce effects similar to sympathetic responses."}, {"topic": "Pancreatic Islets", "q": "Which key fact applies to “The pancreas lies in the curve of…”?", "a": "The pancreas lies in the curve of the duodenum", "fact": "The pancreas lies in the curve of the duodenum."}, {"topic": "Pancreatic Islets", "q": "Which key fact applies to “It has both endocrine and exocrine functions…”?", "a": "It has both endocrine and exocrine functions", "fact": "It has both endocrine and exocrine functions."}, {"topic": "Pancreatic Islets", "q": "What does the endocrine portion consist of?", "a": "pancreatic islets (islets of Langerhans), made up of four types of cells: alpha, beta, delta, and F cells", "f
