const ALL=[{"topic": "Core Concepts", "q": "Which key fact applies to “Urothelium consists of several layers of cells…”?", "a": "Urothelium consists of several layers of cells whose appearance varies with the degree of stretching (Table 4.1J)", "fact": "Urothelium consists of several layers of cells whose appearance varies with the degree of stretching (Table 4.1J)."}, {"topic": "Core Concepts", "q": "Which key fact applies to “It lines the urinary bladder and large…”?", "a": "It lines the urinary bladder and large urinary tubes", "fact": "It lines the urinary bladder and large urinary tubes."}, {"topic": "Core Concepts", "q": "What is a gland?", "a": "a single cell or a group of epithelial cells adapted for secretion", "fact": "A gland is a single cell or a group of epithelial cells adapted for secretion."}, {"topic": "Core Concepts", "q": "Which key fact applies to “There are two types of glandular epithelium…”?", "a": "There are two types of glandular epithelium: endocrine and exocrine", "fact": "There are two types of glandular epithelium: endocrine and exocrine."}, {"topic": "Core Concepts", "q": "What does endocrine glands secrete?", "a": "hormones into interstitial fluid and then into the blood (Table 4", "fact": "Endocrine glands secrete hormones into interstitial fluid and then into the blood (Table 4.2A)."}, {"topic": "Core Concepts", "q": "What does exocrine glands secrete?", "a": "into ducts or directly onto a free surface (Table 4", "fact": "Exocrine glands secrete into ducts or directly onto a free surface (Table 4.2B)."}, {"topic": "Core Concepts", "q": "Which key fact applies to “The structural classification of exocrine glands includes…”?", "a": "The structural classification of exocrine glands includes unicellular and multicellular glands", "fact": "The structural classification of exocrine glands includes unicellular and multicellular glands."}, {"topic": "Core Concepts", "q": "Which key fact applies to “The functional classification of exocrine glands includes…”?", "a": "The functional classification of exocrine glands includes merocrine, apocrine, and holocrine glands", "fact": "The functional classification of exocrine glands includes merocrine, apocrine, and holocrine glands."}, {"topic": "Connective Tissue", "q": "What does connective tissue, one of the most abundant body tissues, consist of?", "a": "relatively few cells and an abundant extracellular matrix of ground substance and protein fibers", "fact": "Connective tissue, one of the most abundant body tissues, consists of relatively few cells and an abundant extracellular matrix of ground substance and protein fibers."}, {"topic": "Connective Tissue", "q": "What is it usually has a nerve supply, and it?", "a": "usually highly vascular", "fact": "It usually has a nerve supply, and it is usually highly vascular."}, {"topic": "Connective Tissue", "q": "What are cells in connective tissue proper?", "a": "derived primarily from mesenchymal cells", "fact": "Cells in connective tissue proper are derived primarily from mesenchymal cells."}, {"topic": "Connective Tissue", "q": "Which key fact applies to “Cell types include fibroblasts (secrete extracellular matrix)…”?", "a": "Cell types include fibroblasts (secrete extracellular matrix), macrophages (perform phagocytosis), plasmocytes (secrete antibodies), mast cells (produce histamine), adipocytes (store fat), and white blood cells (respond to infections)", "fact": "Cell types include fibroblasts (secrete extracellular matrix), macrophages (perform phagocytosis), plasmocytes (secrete antibodies), mast cells (produce histamine), adipocytes (store fat), and white blood cells (respond to infections)."}, {"topic": "Connective Tissue", "q": "Which key fact applies to “The ground substance and fibers make up…”?", "a": "The ground substance and fibers make up the extracellular matrix", "fact": "The ground substance and fibers make up the extracellular matrix."}, {"topic": "Connective Tissue", "q": "Which key fact applies to “The ground substance supports and binds cells…”?", "a": "The ground substance supports and binds cells together, provides a medium for the exchange of materials, stores water, and actively influences cell functions", "fact": "The ground substance supports and binds cells together, provides a medium for the exchange of materials, stores water, and actively influences cell functions."}, {"topic": "Connective Tissue", "q": "Which key fact applies to “Substances found in the ground substance include…”?", "a": "Substances found in the ground substance include water and polysaccharides", "fact": "Substances found in the ground substance include water and polysaccharides."}, {"topic": "Connective Tissue", "q": "What are also present?", "a": "proteoglycans and adhesion proteins", "fact": "Also present are proteoglycans and adhesion proteins."}, {"topic": "Connective Tissue", "q": "What are the fibers in the extracellular matrix provide strength and support and?", "a": "of three types: (a) Collagen fibers are found in large amounts in bone, tendons, and ligaments", "fact": "The fibers in the extracellular matrix provide strength and support and are of three types: (a) Collagen fibers are found in large amounts in bone, tendons, and ligaments."}, {"topic": "Connective Tissue", "q": "What are (b) elastic fibers?", "a": "found in skin, blood vessel walls, and lungs", "fact": "(b) Elastic fibers are found in skin, blood vessel walls, and lungs."}, {"topic": "Connective Tissue", "q": "What are (c) reticular fibers?", "a": "found around fat cells, nerve fibers, and skeletal and smooth muscle cells", "fact": "(c) Reticular fibers are found around fat cells, nerve fibers, and skeletal and smooth muscle cells."}, {"topic": "Connective Tissue", "q": "What are two major subclasses of connective tissue?", "a": "embryonic (found in embryo and fetus) and mature (present in the newborn)", "fact": "Two major subclasses of connective tissue are embryonic (found in embryo and fetus) and mature (present in the newborn)."}, {"topic": "Connective Tissue", "q": "What are embryonic connective tissues (see table 4.3)?", "a": "mesenchyme, which forms almost all other connective tissues, and mucoid connective tissue, found in the umbilical cord of the fetus, where it gives support", "fact": "Embryonic connective tissues (see Table 4.3) are mesenchyme, which forms almost all other connective tissues, and mucoid connective tissue, found in the umbilical cord of the fetus, where it gives support."}, {"topic": "Connective Tissue", "q": "What is mature connective tissue differentiates from mesenchyme and?", "a": "subdivided into several types: connective tissue proper (loose and dense), supporting connective tissue (cartilage and bone), and liquid connective tissue (blood and lymph plasma)", "fact": "Mature connective tissue differentiates from mesenchyme and is subdivided into several types: connective tissue proper (loose and dense), supporting connective tissue (cartilage and bone), and liquid connective tissue (blood and lymph plasma)."}, {"topic": "Connective Tissue", "q": "Which key fact applies to “Loose connective tissue includes areolar connective tissue…”?", "a": "Loose connective tissue includes areolar connective tissue, adipose tissue, and reticular connective tissue", "fact": "Loose connective tissue includes areolar connective tissue, adipose tissue, and reticular connective tissue."}, {"topic": "Connective Tissue", "q": "What does areolar connective tissue consist of?", "a": "the three types of fibers (collagen, elastic, and reticular), several types of cells, and a semifluid ground substance (Table 4", "fact": "Areolar connective tissue consists of the three types of fibers (collagen, elastic, and reticular), several types of cells, and a semifluid ground substance (Table 4.4A); it is found in the subcutaneous tissue, in mucous membranes, and around blood vessels, nerves, and body organs."}, {"topic": "Connective Tissue", "q": "What does  consists of branching elastic fibers and fibroblasts (Table 4.5C) and is found in the walls of large arteries, lungs, trachea, and bronchial tubes."}, {"topic": "Connective Tissue", "q": "Which key fact applies to “Supporting connective tissue include cartilage and bone…”?", "a": "Supporting connective tissue include cartilage and bone", "fact": "Supporting connective tissue include cartilage and bone."}, {"topic": "Connective Tissue", "q": "Which key fact applies to “Cartilage contains chondrocytes and has a rubbery…”?", "a": "Cartilage contains chondrocytes and has a rubbery extracellular matrix (chondroitin sulfate) containing collagen and elastic fibers", "fact": "Cartilage contains chondrocytes and has a rubbery extracellular matrix (chondroitin sulfate) containing collagen and elastic fibers."}, {"topic": "Connective Tissue", "q": "What does hyaline cartilage, which consist of?", "a": "a gel-like ground s ubstance and appears bluish white in the body, is found in the embryonic skeleton, at the ends of bones, in the nose, and in respiratory structures (Table 4", "fact": "Hyaline cartilage, which consists of a gel-like ground s ubstance and appears bluish white in the body, is found in the embryonic skeleton, at the ends of bones, in the nose, and in respiratory structures (Table 4.6A); it is flexible, allows movement, provides support, and is usually surrounded by a perichondrium."}, {"topic": "Connective Tissue", "q": "What is fibrous cartilage?", "a": "found in the pubic s ymphysis, intervertebral discs, and menisci (cartilage pads) of the knee joint (Table 4", "fact": "Fibrous cartilage is found in the pubic s ymphysis, intervertebral discs, and menisci (cartilage pads) of the knee joint (Table 4.6B); it contains chondrocytes scattered among clearly visible bundles of collagen fibers."}, {"topic": "Connective Tissue", "q": "Which key fact applies to “Elastic cartilage maintains the shape of organs…”?", "a": "Elastic cartilage maintains the shape of organs such as the epiglottis of the larynx, auditory tubes, and external ear ( Table 4.6C); its chondrocytes are located within a threadlike network of elastic fibers, and it has a perichondrium", "fact": "Elastic cartilage maintains the shape of organs such as the epiglottis of the larynx, auditory tubes, and external ear ( Table 4.6C); its chondrocytes are located within a threadlike network of elastic fibers, and it has a perichondrium."}, {"topic": "Connective Tissue", "q": "What does bone or osseous tissue consist of?", "a": "an extracellular matrix of mineral salts and collagen fibers that contribute to the hardness of bone, and osteocytes that are located in bone lacunae (Table 4", "fact": "Bone or osseous tissue consists of an extracellular matrix of mineral salts and collagen fibers that contribute to the hardness of bone, and osteocytes that are located in bone lacunae (Table 4.7)."}, {"topic": "Connective Tissue", "q": "Which key fact applies to “It supports and protects the body, provides…”?", "a": "It supports and protects the body, provides a surface area for muscle a ttachment, helps the body move, stores minerals, and houses blood-forming tissue", "fact": "It supports and protects the body, provides a surface area for muscle a ttachment, helps the body move, stores minerals, and houses blood-forming tissue."}, {"topic": "Connective Tissue", "q": "Which key fact applies to “There are two types of liquid connective…”?", "a": "There are two types of liquid connective tissue: blood tissue and lymph plasma", "fact": "There are two types of liquid connective tissue: blood tissue and lymph plasma."}, {"topic": "Connective Tissue", "q": "What does blood tissue consist of?", "a": "blood plasma and formed elements—red blood cells, white blood cells, and platelets (Table 4", "fact": "Blood tissue consists of blood plasma and formed elements—red blood cells, white blood cells, and platelets (Table 4.8); its cells transport oxygen and carbon dioxide, carry on phagocytosis, participate in allergic reactions, provide immunity, and bring about blood clotting."}, {"topic": "Connective Tissue", "q": "What is lymph plasma?", "a": "a clear liquid connective tissue similar to blood plasma but with less protein and a variable numbers of cells", "fact": "Lymph plasma is a clear liquid connective tissue similar to blood plasma but with less protein and a variable numbers of cells."}, {"topic": "Membranes", "q": "What does an epithelial membrane consist of?", "a": "an epithelial layer overlying a connective tissue layer", "fact": "An epithelial membrane consists of an epithelial layer overlying a connective tissue layer."}, {"topic": "Membranes", "q": "Which key fact applies to “Types include mucous, serous, and cutaneous membranes…”?", "a": "Types include mucous, serous, and cutaneous membranes", "fact": "Types include mucous, serous, and cutaneous membranes."}, {"topic": "Membranes", "q": "Which key fact applies to “Mucous membranes line cavities that open to…”?", "a": "Mucous membranes line cavities that open to the exterior, and also line the entire digestive canal, respiratory, and genital tracts, and most of the urinary tract", "fact": "Mucous membranes line cavities that open to the exterior, and also line the entire digestive canal, respiratory, and genital tracts, and most of the urinary tract."}, {"topic": "Membranes", "q": "Which key fact applies to “Serous membranes line cavities that do not…”?", "a": "Serous membranes line cavities that do not open directly to the exterior (thoracic or abdominal) and cover the organs in the cavities", "fact": "Serous membranes line cavities that do not open directly to the exterior (thoracic or abdominal) and cover the organs in the cavities."}, {"topic": "Membranes", "q": "Which key fact applies to “These membranes consist of parietal and visceral…”?", "a": "These membranes consist of parietal and visceral layers", "fact": "These membranes consist of parietal and visceral layers."}, {"topic": "Membranes", "q": "What is the cutaneous membrane?", "a": "the skin", "fact": "The cutaneous membrane is the skin."}, {"topic": "Membranes", "q": "What does it covers the entire body and consist of?", "a": "a superficial epidermis (epithelium) and a deep dermis (connective tissue)", "fact": "It covers the entire body and consists of a superficial epidermis (epithelium) and a deep dermis (connective tissue)."}, {"topic": "Membranes", "q": "What does synovial membranes line joints that contain?", "a": "an articular cavity and consist of areolar connective tissue; they do not have an epithelial layer", "fact": "Synovial membranes line joints that contain an articular cavity and consist of areolar connective tissue; they do not have an epithelial layer."}, {"topic": "Muscular Tissue", "q": "What does muscular tissue consist of?", "a": "cells called muscle fibers or myocytes that are specialized for contraction", "fact": "Muscular tissue consists of cells called muscle fibers or myocytes that are specialized for contraction."}, {"topic": "Muscular Tissue", "q": "Which key fact applies to “It provides motion, maintenance of posture, heat…”?", "a": "It provides motion, maintenance of posture, heat production, and protection", "fact": "It provides motion, maintenance of posture, heat production, and protection."}, {"topic": "Muscular Tissue", "q": "What is skeletal muscle tissue?", "a": "usually attached to bones by tendons and is striated and voluntary (Table 4", "fact": "Skeletal muscle tissue is usually attached to bones by tendons and is striated and voluntary (Table 4.9A)."}, {"topic": "Muscular Tissue", "q": "Which key fact applies to “148 The Tissue Level of Organization…”?", "a": "148 The Tissue Level of Organization", "fact": "148 The Tissue Level of Organization"}, {"topic": "Muscular Tissue", "q": "What is the action of cardiac muscle tissue, which forms most of the heart wall and?", "a": "striated, is involuntary (Table 4", "fact": "The action of cardiac muscle tissue, which forms most of the heart wall and is striated, is involuntary (Table 4.9B)."}, {"topic": "Muscular Tissue", "q": "What are because neurons and muscle fibers exhibit electrical excitability, they?", "a": "considered excitable cells", "fact": "Because neurons and muscle fibers exhibit electrical excitability, they are considered excitable cells."}, {"topic": "Muscular Tissue", "q": "What is smooth muscle tissue?", "a": "found in the walls of hollow internal structures (blood vessels and viscera) and is nonstriated and involuntary (Table 4", "fact": "Smooth muscle tissue is found in the walls of hollow internal structures (blood vessels and viscera) and is nonstriated and involuntary (Table 4.9C)."}, {"topic": "Nervous Tissue", "q": "Which key fact applies to “Stem cells may divide to replace lost…”?", "a": "Stem cells may divide to replace lost or damaged cells", "fact": "Stem cells may divide to replace lost or damaged cells."}, {"topic": "Nervous Tissue", "q": "What is the nervous system composed of?", "a": "neurons (nerve cells) and neuroglia (protective and supporting cells) (Table 4", "fact": "The nervous system is composed of neurons (nerve cells) and neuroglia (protective and supporting cells) (Table 4.10)."}, {"topic": "Nervous Tissue", "q": "Which key fact applies to “Neurons respond to stimuli by converting the…”?", "a": "Neurons respond to stimuli by converting the stimuli into electrical signals called nerve action potentials (nerve impulses), and conducting nerve impulses to other cells", "fact": "Neurons respond to stimuli by converting the stimuli into electrical signals called nerve action potentials (nerve impulses), and conducting nerve impulses to other cells."}, {"topic": "Nervous Tissue", "q": "Which key fact applies to “Most neurons consist of a cell body…”?", "a": "Most neurons consist of a cell body and two types of processes: dendrites and axons", "fact": "Most neurons consist of a cell body and two types of processes: dendrites and axons."}, {"topic": "Excitable Cells", "q": "What is electrical excitability?", "a": "the ability to respond to certain stimuli by producing electrical signals such as action potentials", "fact": "Electrical excitability is the ability to respond to certain stimuli by producing electrical signals such as action potentials."}, {"topic": "Excitable Cells", "q": "What is tissue repair?", "a": "the replacement of worn-out, damaged, or dead cells by healthy ones", "fact": "Tissue repair is the replacement of worn-out, damaged, or dead cells by healthy ones."}, {"topic": "Excitable Cells", "q": "What is if the injury?", "a": "superficial, tissue repair involves parenchymal regeneration; if damage is extensive, granulation tissue is involved", "fact": "If the injury is superficial, tissue repair involves parenchymal regeneration; if damage is extensive, granulation tissue is involved."}, {"topic": "Excitable Cells", "q": "What are good nutrition and blood circulation?", "a": "vital to tissue repair", "fact": "Good nutrition and blood circulation are vital to tissue repair."}, {"topic": "Aging and Tissues", "q": "Which key fact applies to “Tissues heal faster and leave less obvious…”?", "a": "Tissues heal faster and leave less obvious scars in the young than in the aged; surgery performed on fetuses leaves no scars", "fact": "Tissues heal faster and leave less obvious scars in the young than in the aged; surgery performed on fetuses leaves no scars."}, {"topic": "Aging and Tissues", "q": "Which key fact applies to “The extracellular components of tissues, such as…”?", "a": "The extracellular components of tissues, such as collagen and elastic fibers, also change with age", "fact": "The extracellular components of tissues, such as collagen and elastic fibers, also change with age."}, {"topic": "Course Study Guide", "q": "Which key fact applies to “Studies the tissues and organs that make…”?", "a": "Studies the tissues and organs that make up the entire body", "fact": "Studi
