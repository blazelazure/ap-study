estes includes…”?", "a": "The duct system of the testes includes the seminiferous tubules, straight tubules, and rete testis", "fact": "The duct system of the testes includes the seminiferous tubules, straight tubules, and rete testis."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Sperm flow out of the testes through…”?", "a": "Sperm flow out of the testes through the efferent ductules", "fact": "Sperm flow out of the testes through the efferent ductules."}, {"topic": "Core Concepts", "q": "What is the duct of epididymis?", "a": "the site of sperm maturation and storage", "fact": "The duct of epididymis is the site of sperm maturation and storage."}, {"topic": "Core Concepts", "q": "Which key fact applies to “The ductus deferens stores sperm and propels…”?", "a": "The ductus deferens stores sperm and propels them toward the urethra during ejaculation", "fact": "The ductus deferens stores sperm and propels them toward the urethra during ejaculation."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Each ejaculatory duct, formed by the union…”?", "a": "Each ejaculatory duct, formed by the union of the duct from the seminal gland and ampulla of the ductus deferens, is the passageway for ejection of sperm and secretions of the seminal glands into the first portion of the urethra, the prostatic urethra", "fact": "Each ejaculatory duct, formed by the union of the duct from the seminal gland and ampulla of the ductus deferens, is the passageway for ejection of sperm and secretions of the seminal glands into the first portion of the urethra, the prostatic urethra."}, {"topic": "Core Concepts", "q": "What is the urethra in males?", "a": "subdivided into three portions: the prostatic, membranous, and spongy urethra", "fact": "The urethra in males is subdivided into three portions: the prostatic, membranous, and spongy urethra."}, {"topic": "Core Concepts", "q": "What does the seminal glands secrete an alkaline, viscous fluid that contain?", "a": act applies to “The female genital organs include the ovaries…”?", "a": "The female genital organs include the ovaries (gonads), uterine tubes or oviducts, uterus, vagina, and vulva", "fact": "The female genital organs include the ovaries (gonads), uterine tubes or oviducts, uterus, vagina, and vulva."}, {"topic": "Female Genital System", "q": "What are the mammary glands?", "a": "part of the integumentary system and also are considered part of the female genital system", "fact": "The mammary glands are part of the integumentary system and also are considered part of the female genital system."}, {"topic": "Female Genital System", "q": "What are the ovaries, the female gonads,?", "a": "located in the superior portion of the pelvic cavity, lateral to the uterus", "fact": "The ovaries, the female gonads, are located in the superior portion of the pelvic cavity, lateral to the uterus."}, {"topic": "Female Genital System", "q": "What does ovaries produce secondary oocytes, discharge secondary oocytes (the process of ovulation), and secrete?", "a": "estrogens, progesterone, relaxin, and inhibin", "fact": "Ovaries produce secondary oocytes, discharge secondary oocytes (the process of ovulation), and secrete estrogens, progesterone, relaxin, and inhibin."}, {"topic": "Female Genital System", "q": "Which key fact applies to “Oogenesis (the production of haploid secondary oocytes)…”?", "a": "Oogenesis (the production of haploid secondary oocytes) begins in the ovaries", "fact": "Oogenesis (the production of haploid secondary oocytes) begins in the ovaries."}, {"topic": "Female Genital System", "q": "Which key fact applies to “The oogenesis sequence includes meiosis I and…”?", "a": "The oogenesis sequence includes meiosis I and meiosis II, which goes to completion only after an ovulated secondary oocyte is fertilized by a sperm", "fact": "The oogenesis sequence includes meiosis I and meiosis II, which goes to completion only after an ovulated secondary oocyte is fertilized by  sperm and the menstrual flow, the receptacle of the penis during sexual intercourse, and the inferior portion of the birth canal", "fact": "The vagina is a passageway for sperm and the menstrual flow, the receptacle of the penis during sexual intercourse, and the inferior portion of the birth canal."}, {"topic": "Female Genital System", "q": "Which key fact applies to “It is capable of considerable stretching…”?", "a": "It is capable of considerable stretching", "fact": "It is capable of considerable stretching."}, {"topic": "Female Genital System", "q": "What does the vulva, a collective term for the external genitals of the female, consist of?", "a": "the mons pubis, labia majora, labia minora, clitoris, vestibule, vaginal and urethral orifices, hymen, and bulb of the vestibule, as well as three sets of glands: the paraurethral, greater vestibular glands, and lesser vestibular glands", "fact": "The vulva, a collective term for the external genitals of the female, consists of the mons pubis, labia majora, labia minora, clitoris, vestibule, vaginal and urethral orifices, hymen, and bulb of the vestibule, as well as three sets of glands: the paraurethral, greater vestibular glands, and lesser vestibular glands."}, {"topic": "Female Genital System", "q": "What is the perineum?", "a": "a diamond-shaped area at the inferior end of the trunk medial to the thighs and buttocks", "fact": "The perineum is a diamond-shaped area at the inferior end of the trunk medial to the thighs and buttocks."}, {"topic": "Female Genital System", "q": "What are the mammary glands?", "a": "modified sweat glands lying superficial to the pectoralis major muscles", "fact": "The mammary glands are modified sweat glands lying superficial to the pectoralis major muscles."}, {"topic": "Female Genital System", "q": "What is their function?", "a": "to synthesize, secrete, and eject milk (lactation)", "fact": "Their function is to synthesize, secrete, and eject milk (lactation)."}, {"topic": "Female es."}, {"topic": "The Female Reproductive Cycle", "q": "Which key fact applies to “LH also stimulates ovulation, formation of the…”?", "a": "LH also stimulates ovulation, formation of the corpus luteum, and the secretion of progesterone and estrogens by the corpus luteum", "fact": "LH also stimulates ovulation, formation of the corpus luteum, and the secretion of progesterone and estrogens by the corpus luteum."}, {"topic": "The Female Reproductive Cycle", "q": "Which key fact applies to “Estrogens stimulate the growth, development, and maintenance…”?", "a": "Estrogens stimulate the growth, development, and maintenance of female genital structures; stimulate the development of secondary sex characteristics; and stimulate protein synthesis", "fact": "Estrogens stimulate the growth, development, and maintenance of female genital structures; stimulate the development of secondary sex characteristics; and stimulate protein synthesis."}, {"topic": "The Female Reproductive Cycle", "q": "Which key fact applies to “Progesterone works with estrogens to prepare the…”?", "a": "Progesterone works with estrogens to prepare the endometrium for implantation and the mammary glands for milk synthesis", "fact": "Progesterone works with estrogens to prepare the endometrium for implantation and the mammary glands for milk synthesis."}, {"topic": "The Female Reproductive Cycle", "q": "Which key fact applies to “Relaxin relaxes the myometrium at the time…”?", "a": "Relaxin relaxes the myometrium at the time of possible implantation", "fact": "Relaxin relaxes the myometrium at the time of possible implantation."}, {"topic": "The Female Reproductive Cycle", "q": "Which key fact applies to “At the end of a pregnancy, relaxin…”?", "a": "At the end of a pregnancy, relaxin increases the flexibility of the pubic symphysis and helps dilate the uterine cervix to facilitate delivery", "fact": "At the end of a pregnancy, relaxin increases the flexibility of the pubic symphysis and helps dilate the  maintained by hCG."}, {"topic": "The Female Reproductive Cycle", "q": "What does the corpus luteum and later the placenta secrete?", "a": "progesterone and estrogens to support pregnancy and breast development for lactation", "fact": "The corpus luteum and later the placenta secrete progesterone and estrogens to support pregnancy and breast development for lactation."}, {"topic": "The Human Sexual Response", "q": "What is the similar sequence of changes experienced by both males and females before, during, and after intercourse?", "a": "termed the human sexual response; it occurs in four phases: excitement, plateau, orgasm, and resolution", "fact": "The similar sequence of changes experienced by both males and females before, during, and after intercourse is termed the human sexual response; it occurs in four phases: excitement, plateau, orgasm, and resolution."}, {"topic": "The Human Sexual Response", "q": "What is during excitement, there?", "a": "vasocongestion (engorgement with blood) of genital tissues", "fact": "During excitement, there is vasocongestion (engorgement with blood) of genital tissues."}, {"topic": "The Human Sexual Response", "q": "Which key fact applies to “Other changes that occur during this phase…”?", "a": "Other changes that occur during this phase include increased heart rate and blood pressure, increased skeletal muscle tone throughout the body, and hyperventilation", "fact": "Other changes that occur during this phase include increased heart rate and blood pressure, increased skeletal muscle tone throughout the body, and hyperventilation."}, {"topic": "The Human Sexual Response", "q": "What are during the plateau phase, the changes that began during the excitement phase?", "a": "sustained at an intense level", "fact": "During the plateau phase, the changes that began during the excitement phase are sustained at an intense level."}, {"topic": "The Human Sexual Response", "q": "What are during orgasm, there?", "a": "several rhythmic muscul
