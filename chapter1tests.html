<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 1 — Three Practice Tests</title>
<style>
:root{--bg:#0b1020;--card:#151c31;--card2:#10172b;--text:#eef2ff;--muted:#aeb8d6;--accent:#79a7ff;--good:#2dd4bf;--bad:#fb7185;--line:#2a365c;--warn:#fbbf24}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0b1020,#11172a);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:26px 16px 70px} h1{margin:0 0 5px;font-size:clamp(1.8rem,5vw,3rem)} h2,h3{margin-top:0}
.muted{color:var(--muted)} .hidden{display:none!important} .top{margin-bottom:22px}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin-top:22px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px} .tile h2{margin:4px 0 5px} .small{font-size:.9rem;color:var(--muted)}
button{font:inherit;cursor:pointer;color:var(--text);background:#263454;border:1px solid #3b4d78;border-radius:11px;padding:10px 13px} button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed} .primary{background:#31518c;border-color:#5477ba;font-weight:750}
.toolbar{position:sticky;top:8px;z-index:4;background:rgba(11,16,32,.95);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:15px;padding:11px;margin:14px 0;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.progress{flex:1;min-width:160px} .bar{height:8px;background:#222d4a;border-radius:999px;overflow:hidden;margin-top:5px} .fill{height:100%;background:var(--accent);width:0}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px} .qnum{color:var(--accent);font-weight:800;font-size:.9rem} .topic{color:var(--muted);font-size:.82rem;margin-top:2px}
.qtext{font-size:1.12rem;font-weight:720;margin:10px 0 15px} .option{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid #35446c;border-radius:12px;padding:12px;margin:8px 0;color:var(--text)}
.option.correct{border-color:var(--good);background:rgba(45,212,191,.11)} .option.wrong{border-color:var(--bad);background:rgba(251,113,133,.11)}
.feedback{margin-top:13px;padding:12px;border-radius:11px;background:#0e1528;border-left:4px solid var(--accent)}
.flagrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px} .flagged{border-color:var(--warn)!important;color:#fde68a}
.note{flex:1;min-width:220px;background:#10172b;color:var(--text);border:1px solid #35446c;border-radius:10px;padding:9px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px} .navright{display:flex;gap:8px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:21px;margin-top:15px} .score{font-size:2rem;font-weight:850}
.review{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin:3px 5px 0 0;color:var(--muted);font-size:.8rem}
@media(max-width:600px){.nav{flex-direction:column}.navright{display:grid;grid-template-columns:1fr 1fr}.nav button{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<section id="home">
  <div class="top"><h1>Chapter 1 Practice Tests</h1><div class="muted">An Introduction to the Human Body • 3 different 50-question tests • 150 total questions</div></div>
  <div class="homegrid" id="tiles"></div>
  <p class="small">Each test saves progress separately in the browser. Flags and notes stay private to that person's device/browser.</p>
</section>

<section id="testView" class="hidden">
  <div class="top">
    <button onclick="goHome()">← All Tests</button>
    <h1 id="testTitle" style="margin-top:14px"></h1><div id="testSub" class="muted"></div>
  </div>
  <div class="toolbar">
    <div class="progress"><div id="progressText" class="small"></div><div class="bar"><div id="fill" class="fill"></div></div></div>
    <button onclick="finishTest()">Finish / Review</button><button onclick="resetCurrent()">Reset Test</button>
  </div>
  <div id="questionHost"></div><div id="summary" class="summary hidden"></div>
</section>
</main>

<script>
const TESTS=[{"name": "Test 1", "subtitle": "Core Chapter 1 concepts", "questions": [{"q": "Which statement best defines anatomy?", "opts": ["The science of body structures and the relationships among them", "The science of how body parts function", "The study of disease transmission in populations", "The study of chemical reactions only"], "a": 0, "exp": "Anatomy is the science of body structures and the relationships among those structures.", "topic": "Foundations", "ref": "Textbook p. 2"}, {"q": "Physiology is the science of:", "opts": ["Microscopic tissue structure", "Body functions—how body parts work", "Body regions visible without a microscope", "Structural changes caused by disease"], "a": 1, "exp": "Physiology focuses on the functions of the body and how its parts work.", "topic": "Foundations", "ref": "Textbook p. 2"}, {"q": "Which branch of anatomy studies the microscopic structure of tissues?", "opts": ["Gross anatomy", "Regional anatomy", "Histology", "Clinical anatomy"], "a": 2, "exp": "Histology is the branch of anatomy that studies the microscopic structure of tissues.", "topic": "Foundations", "ref": "Textbook p. 2"}, {"q": "Which branch of physiology studies functional changes associated with disease and aging?", "opts": ["Endocrinology", "Neurophysiology", "Exercise physiology", "Pathophysiology"], "a": 3, "exp": "Pathophysiology studies functional changes associated with disease and aging.", "topic": "Foundations", "ref": "Textbook p. 2"}, {"q": "Why are anatomy and physiology commonly studied together?", "opts": ["Structure and function are closely related", "They use exactly the same methods", "They only apply to diseased tissues", "Physiology can be understood without structure"], "a": 0, "exp": "The structure of a body part often reflects its function, so anatomy and physiology are closely linked.", "topic": "Foundations", "ref": "Textbook p. 2"}, {"q": "Which sequence lists the six levels of structural organization from smallest to largest?", "opts": ["Cellular, chemical, tissue, organ, organismal, system", "Chemical, cellular, tissue, organ, system, organismal", "Chemical, tissue, cellular, organ, organismal, system", "Atom, molecule, organ, tissue, system, organism"], "a": 1, "exp": "The six levels are chemical, cellular, tissue, organ, system, and organismal.", "topic": "Levels & Body Systems", "ref": "Textbook p. 3"}, {"q": "Which is the smallest living unit in the human body?", "opts": ["Atom", "Molecule", "Cell", "Tissue"], "a": 2, "exp": "Cells are the basic structural and functional units of an organism and the smallest living units in the human body.", "topic": "Levels & Body Systems", "ref": "Textbook p. 4"}, {"q": "An organ is best defined as:", "opts": ["A group of identical cells", "A group of related organs", "A single type of tissue", "A structure made of two or more different tissue types with specific functions"], "a": 3, "exp": "Organs are composed of two or more different types of tissues and have specific functions.", "topic": "Levels & Body Systems", "ref": "Textbook p. 4"}, {"q": "Which tissue type covers body surfaces, lines hollow organs and cavities, and forms glands?", "opts": ["Epithelial tissue", "Connective tissue", "Muscular tissue", "Nervous tissue"], "a": 0, "exp": "Epithelial tissue covers surfaces, lines hollow organs and cavities, and forms glands.", "topic": "Levels & Body Systems", "ref": "Textbook p. 4"}, {"q": "Which organ belongs to both the digestive and endocrine systems?", "opts": ["Spleen", "Pancreas", "Trachea", "Urinary bladder"], "a": 1, "exp": "The pancreas is part of both the digestive system and the hormone-producing endocrine system.", "topic": "Levels & Body Systems", "ref": "Textbook p. 4"}, {"q": "Which body system contains the brain, spinal cord, nerves, and special sense organs?", "opts": ["Endocrine", "Muscular", "Nervous", "Lymphoid"], "a": 2, "exp": "The nervous system includes the brain, spinal cord, nerves, and special sense organs such as the eyes and ears.", "topic": "Levels & Body Systems", "ref": "Textbook p. 5"}, {"q": "Which system returns proteins and fluid to the blood and contains sites for maturation and proliferation of B and T cells?", "opts": ["Respiratory", "Cardiovascular", "Urinary", "Lymphoid (lymphatic)"], "a": 3, "exp": "The lymphoid system returns proteins and fluid to the blood and supports immune-cell maturation and proliferation.", "topic": "Levels & Body Systems", "ref": "Textbook p. 6"}, {"q": "Which is a major function of the skeletal system?", "opts": ["Support, protection, movement assistance, blood-cell production, and mineral/lipid storage", "Production of hormones only", "Gas exchange between air and blood", "Digestion and nutrient absorption"], "a": 0, "exp": "The skeletal system supports and protects the body, aids movement, houses blood-forming cells, and stores minerals and lipids.", "topic": "Levels & Body Systems", "ref": "Textbook p. 4"}, {"q": "Which system is primarily responsible for producing, storing, and eliminating urine?", "opts": ["Digestive", "Urinary", "Respiratory", "Integumentary"], "a": 1, "exp": "The urinary system produces, stores, and eliminates urine and helps regulate blood composition.", "topic": "Levels & Body Systems", "ref": "Textbook p. 7"}, {"q": "Which term means the sum of all chemical processes occurring in the body?", "opts": ["Responsiveness", "Differentiation", "Metabolism", "Reproduction"], "a": 2, "exp": "Metabolism is the sum of all chemical processes that occur in the body.", "topic": "Life Processes & Homeostasis", "ref": "Textbook p. 8"}, {"q": "The breakdown of complex chemical substances into simpler components is called:", "opts": ["Anabolism", "Differentiation", "Growth", "Catabolism"], "a": 3, "exp": "Catabolism is the breakdown phase of metabolism.", "topic": "Life Processes & Homeostasis", "ref": "Textbook p. 8"}, {"q": "Turning your head toward the sound of squealing brakes is an example of:", "opts": ["Responsiveness", "Growth", "Differentiation", "Anabolism"], "a": 0, "exp": "Responsiveness is the body's ability to detect and respond to internal or external changes.", "topic": "Life Processes & Homeostasis", "ref": "Textbook p. 8"}, {"q": "The development of an unspecialized cell into a specialized cell is called:", "opts": ["Metabolism", "Differentiation", "Movement", "Reproduction"], "a": 1, "exp": "Differentiation is the development of a cell from an unspecialized to a specialized state.", "topic": "Life Processes & Homeostasis", "ref": "Textbook p. 8"}, {"q": "Which life process includes formation of new cells for growth, repair, or replacement?", "opts": ["Growth only", "Movement", "Reproduction", "Responsiveness"], "a": 2, "exp": "Reproduction includes formation of new cells for tissue growth, repair, or replacement, as well as production of a new individual.", "topic": "Life Processes & Homeostasis", "ref": "Textbook p. 8"}, {"q": "Homeostasis is best defined as:", "opts": ["Keeping every body value completely constant", "Maintaining only body temperature", "Maintaining the external environment", "Maintaining relatively stable conditions in the body's internal environment"], "a": 3, "exp": "Homeostasis is the maintenance of relatively stable conditions in the body's internal environment.", "topic": "Life Processes & Homeostasis", "ref": "Textbook p. 9"}, {"q": "The fluid inside cells is called:", "opts": ["Intracellular fluid (ICF)", "Interstitial fluid", "Blood plasma", "Extracellular fluid only"], "a": 0, "exp": "Intracellular fluid (ICF), also called cytosol, is the fluid within cells.", "topic": "Life Processes & Homeostasis", "ref": "Textbook p. 9"}, {"q": "Which fluid fills the narrow spaces between cells of tissues?", "opts": ["Blood plasma", "Interstitial fluid", "Cerebrospinal fluid", "Synovial fluid"], "a": 1, "exp": "Interstitial fluid is extracellular fluid that fills the spaces between tissue cells.", "topic": "Life Processes & Homeostasis", "ref": "Textbook p. 9"}, {"q": "Why is extracellular fluid considered the body's internal environment?", "opts": ["It exists only in blood vessels", "It is located inside organelles", "It surrounds the body's cells", "It is outside the skin"], "a": 2, "exp": "Extracellular fluid surrounds the body's cells, so it serves as the internal environment in which cells live.", "topic": "Life Processes & Homeostasis", "ref": "Textbook p. 9"}, {"q": "Which systems most often provide corrective measures that regulate homeostasis?", "opts": ["Skeletal and muscular", "Digestive and urinary", "Integumentary and reproductive", "Nervous and endocrine"], "a": 3, "exp": "The nervous and endocrine systems most often regulate homeostasis, either together or independently.", "topic": "Life Processes & Homeostasis", "ref": "Textbook p. 9"}, {"q": "In a feedback system, which component monitors changes in a controlled condition?", "opts": ["Receptor", "Control center", "Effector", "Set point"], "a": 0, "exp": "A receptor monitors changes and sends input toward the control center.", "topic": "Feedback & Clinical Terms", "ref": "Textbook p. 10–11"}, {"q": "Information traveling toward a control center follows the:", "opts": ["Efferent pathway", "Afferent pathway", "Positive pathway", "Visceral pathway"], "a": 1, "exp": "The afferent pathway carries input toward the control center.", "topic": "Feedback & Clinical Terms", "ref": "Textbook p. 10–11"}, {"q": "Which component of a feedback system sets the narrow range or set point for a controlled condition?", "opts": ["Receptor", "Effector", "Control center", "Stimulus"], "a": 2, "exp": "The control center establishes the set point or normal range, evaluates input, and generates output.", "topic": "Feedback & Clinical Terms", "ref": "Textbook p. 11"}, {"q": "An effector does which of the following?", "opts": ["Detects the stimulus", "Sets the set point", "Carries input toward the brain", "Receives output and produces a response that changes the controlled condition"], "a": 3, "exp": "An effector receives output from the control center and produces the response.", "topic": "Feedback & Clinical Terms", "ref": "Textbook p. 11"}, {"q": "Negative feedback operates when the response:", "opts": ["Reverses the original stimulus", "Strengthens the original stimulus", "Has no effect on the controlled condition", "Stops all receptor activity permanently"], "a": 0, "exp": "Negative feedback reverses a change in a controlled condition and moves it back toward normal.", "topic": "Feedback & Clinical Terms", "ref": "Textbook p. 11–12"}, {"q": "In the blood-pressure negative feedback example, the receptors are:", "opts": ["Skeletal muscles", "Baroreceptors in certain blood vessels", "The brain", "The heart valves"], "a": 1, "exp": "Baroreceptors are pressure-sensitive receptors in blood-vessel walls that detect elevated blood pressure.", "topic": "Feedback & Clinical Terms", "ref": "Textbook p. 11–12"}, {"q": "During childbirth, increased cervical stretching leads to more oxytocin, stronger contractions, and still more stretching. This is:", "opts": ["Negative feedback", "No feedback", "Positive feedback", "A homeostatic set point"], "a": 2, "exp": "The response intensifies the original change, which makes childbirth a positive feedback example.", "topic": "Feedback & Clinical Terms", "ref": "Textbook p. 11–13"}, {"q": "Which statement correctly distinguishes a symptom from a sign?", "opts": ["A symptom is measured; a sign is felt only by the patient", "Symptoms and signs mean the same thing", "A sign is always anatomical", "A symptom is subjective; a sign is objective and observable or measurable"], "a": 3, "exp": "Symptoms are subjective changes felt by the patient; signs are objective findings that can be observed or measured.", "topic": "Feedback & Clinical Terms", "ref": "Textbook p. 13"}, {"q": "In anatomical position, the palms face:", "opts": ["Forward", "Backward", "Toward the thighs", "Toward each other"], "a": 0, "exp": "In anatomical position, the upper limbs are at the sides and the palms face forward.", "topic": "Anatomical Terminology & Planes", "ref": "Textbook p. 14–15"}, {"q": "A person lying faceup is in the:", "opts": ["Prone position", "Supine position", "Anatomical standing position", "Oblique position"], "a": 1, "exp": "Supine means lying faceup; prone means lying facedown.", "topic": "Anatomical Terminology & Planes", "ref": "Textbook p. 14"}, {"q": "Which directional term means nearer to the midline?", "opts": ["Lateral", "Distal", "Superficial", "Medial"], "a": 3, "exp": "Medial means nearer to the midline of the body.", "topic": "Anatomical Terminology & Planes", "ref": "Textbook p. 16"}, {"q": "The phalanges are ______ to the carpals.", "opts": ["Proximal", "Distal", "Medial", "Deep"], "a": 1, "exp": "The finger bones (phalanges) are farther from the limb's attachment than the wrist bones, so they are distal to the carpals.", "topic": "Anatomical Terminology & Planes", "ref": "Textbook p. 16"}, {"q": "The ribs are ______ to the lungs.", "opts": ["Deep", "Distal", "Superficial", "Inferior"], "a": 2, "exp": "The ribs are closer to the body surface than the lungs, making them superficial to the lungs.", "topic": "Anatomical Terminology & Planes", "ref": "Textbook p. 16–17"}, {"q": "Which plane divides the body into equal right and left sides?", "opts": ["Coronal plane", "Transverse plane", "Oblique plane", "Median (midsagittal) plane"], "a": 3, "exp": "A median or midsagittal plane passes through the midline and divides the body into equal right and left sides.", "topic": "Anatomical Terminology & Planes", "ref": "Textbook p. 14–15"}, {"q": "A coronal (frontal) plane divides the body into:", "opts": ["Anterior and posterior portions", "Equal right and left sides", "Superior and inferior portions", "Unequal right and left sides"], "a": 0, "exp": "A coronal plane divides the body or organ into anterior and posterior portions.", "topic": "Anatomical Terminology & Planes", "ref": "Textbook p. 14–15"}, {"q": "A transverse plane divides the body into:", "opts": ["Anterior and posterior portions", "Superior and inferior portions", "Equal right and left sides", "Unequal right and left sides"], "a": 1, "exp": "A transverse (horizontal) plane divides the body into superior and inferior portions.", "topic": "Anatomical Terminology & Planes", "ref": "Textbook p. 15"}, {"q": "Which cavity directly contains the spinal cord?", "opts": ["Cranial cavity", "Thoracic cavity", "Vertebral canal", "Pelvic cavity"], "a": 2, "exp": "The vertebral canal, formed by the vertebral column, contains the spinal cord.", "topic": "Body Cavities & Membranes", "ref": "Textbook p. 17"}, {"q": "The diaphragm separates the:", "opts": ["Cranial and vertebral cavities", "Pleural and pericardial cavities", "Abdominal and pelvic cavities", "Thoracic and abdominopelvic cavities"], "a": 3, "exp": "The diaphragm is the dome-shaped muscle separating the thoracic cavity from the abdominopelvic cavity.", "topic": "Body Cavities & Membranes", "ref": "Textbook p. 18"}, {"q": "Which cavity surrounds the heart?", "opts": ["Pericardial cavity", "Pleural cavity", "Peritoneal cavity", "Cranial cavity"], "a": 0, "exp": "The pericardial cavity is the fluid-filled space surrounding the heart.", "topic": "Body Cavities & Membranes", "ref": "Textbook p. 17–20"}, {"q": "The mediastinum contains all thoracic organs except the:", "opts": ["Heart", "Lungs", "Trachea", "Esophagus"], "a": 1, "exp": "The mediastinum contains all thoracic organs except the lungs, which occupy the pleural cavities.", "topic": "Body Cavities & Membranes", "ref": "Textbook p. 17–18"}, {"q": "The serous membrane associated with the lungs is the:", "opts": ["Peritoneum", "Pericardium", "Pleura", "Meninges"], "a": 2, "exp": "The pleura is the serous membrane of the pleural cavities surrounding the lungs.", "topic": "Body Cavities & Membranes", "ref": "Textbook p. 19"}, {"q": "Which layer of a serous membrane directly covers and adheres to an organ?", "opts": ["Parietal layer", "Superficial layer", "External layer", "Visceral layer"], "a": 3, "exp": "The visceral layer covers and adheres to the viscera; the parietal layer lines the cavity wall.", "topic": "Body Cavities & Membranes", "ref": "Textbook p. 18–19"}, {"q": "Which abdominopelvic quadrant is most associated with appendicitis pain in the chapter's figure question?", "opts": ["Right lower quadrant (RLQ)", "Left lower quadrant (LLQ)", "Right upper quadrant (RUQ)", "Left upper quadrant (LUQ)"], "a": 0, "exp": "The chapter identifies appendicitis pain with the right lower quadrant (RLQ).", "topic": "Body Cavities & Membranes", "ref": "Textbook p. 22; answer p. 28"}, {"q": "Aging is described in Chapter 1 as a normal process characterized by:", "opts": ["A complete loss of homeostasis at a fixed age", "A progressive decline in the body's ability to restore homeostasis", "A selective decline limited to the nervous system", "An increase in resistance to stress and disease"], "a": 1, "exp": "Aging is a normal process involving a progressive decline in the body's ability to restore homeostasis, with changes across all systems.", "topic": "Aging & Imaging", "ref": "Textbook p. 21–22"}, {"q": "Which imaging technique uses a high-energy magnetic field and radio waves and is especially useful for fine soft-tissue detail?", "opts": ["Radiography", "Ultrasound", "Magnetic resonance imaging (MRI)", "Radionuclide scanning"], "a": 2, "exp": "MRI uses a high-energy magnetic field and radio waves and provides fine detail of soft tissues.", "topic": "Aging & Imaging", "ref": "Textbook p. 24"}, {"q": "Which imaging technique is especially suited to studying the physiology or metabolic activity of body structures?", "opts": ["Standard radiography", "CT", "Ultrasound", "Positron emission tomography (PET)"], "a": 3, "exp": "PET shows where an injected positron-emitting substance is being used and is used to study physiology such as metabolism in the brain or heart.", "topic": "Aging & Imaging", "ref": "Textbook p. 25"}]}, {"name": "Test 2", "subtitle": "Fresh wording & application", "questions": [{"q": "A student is examining the shape and location of the liver. Which field is being used?", "opts": ["Pathophysiology", "Biochemistry", "Anatomy", "Physiology"], "a": 2, "exp": "Anatomy focuses on body structures and their relationships.", "topic": "Foundations", "ref": "Chapter 1 textbook/course overview"}, {"q": "Studying how the kidneys regulate blood volume is primarily an example of:", "opts": ["Regional anatomy", "Physiology", "Gross anatomy", "Histology"], "a": 1, "exp": "Physiology focuses on how body parts function.", "topic": "Foundations", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which branch studies structures large enough to be seen without a microscope?", "opts": ["Histology", "Cytology", "Molecular physiology", "Gross anatomy"], "a": 3, "exp": "Gross anatomy studies structures visible to the unaided eye.", "topic": "Foundations", "ref": "Chapter 1 textbook/course overview"}, {"q": "The microscopic study of individual cells is called:", "opts": ["Histology", "Embryology", "Systemic anatomy", "Cytology"], "a": 3, "exp": "Cytology is the study of cells.", "topic": "Foundations", "ref": "Chapter 1 textbook/course overview"}, {"q": "Embryology specifically examines development:", "opts": ["Only after birth", "Only during adulthood", "Only at the tissue level", "From fertilization through early development before birth"], "a": 3, "exp": "Embryology is the study of prenatal development, especially early development.", "topic": "Foundations", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which level of organization is immediately above the cellular level?", "opts": ["Organ level", "Organismal level", "Tissue level", "Chemical level"], "a": 2, "exp": "Cells combine to form tissues.", "topic": "Levels of Organization", "ref": "Chapter 1 textbook/course overview"}, {"q": "A group of organs working together for a common purpose forms a(n):", "opts": ["Organism only", "Organ system", "Tissue", "Cell"], "a": 1, "exp": "Related organs working together make an organ system.", "topic": "Levels of Organization", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which choice is an organ rather than a tissue or organ system?", "opts": ["Epithelial tissue", "Digestive system", "Blood plasma", "Stomach"], "a": 3, "exp": "The stomach is composed of multiple tissue types and performs specific functions.", "topic": "Levels of Organization", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which system provides the body's rapid electrical communication network?", "opts": ["Nervous system", "Endocrine system", "Digestive system", "Urinary system"], "a": 0, "exp": "The nervous system uses electrical signals for rapid regulation.", "topic": "Body Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which system primarily uses hormones to regulate body processes over time?", "opts": ["Nervous system", "Respiratory system", "Integumentary system", "Endocrine system"], "a": 3, "exp": "Endocrine glands release hormones into body fluids.", "topic": "Body Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which system is most directly responsible for gas exchange between air and blood?", "opts": ["Skeletal system", "Respiratory system", "Cardiovascular system", "Digestive system"], "a": 1, "exp": "The respiratory system exchanges oxygen and carbon dioxide.", "topic": "Body Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which system transports oxygen, nutrients, hormones, and wastes throughout the body?", "opts": ["Integumentary system", "Reproductive system", "Cardiovascular system", "Lymphatic system"], "a": 2, "exp": "Blood moved by the cardiovascular system transports many substances.", "topic": "Body Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "Breaking glycogen into smaller molecules is an example of:", "opts": ["Differentiation", "Responsiveness", "Catabolism", "Anabolism"], "a": 2, "exp": "Catabolic reactions break larger molecules into smaller ones.", "topic": "Life Processes", "ref": "Chapter 1 textbook/course overview"}, {"q": "Building a large protein from amino acids is an example of:", "opts": ["Anabolism", "Catabolism", "Excretion", "Responsiveness"], "a": 0, "exp": "Anabolic reactions build larger molecules from smaller ones.", "topic": "Life Processes", "ref": "Chapter 1 textbook/course overview"}, {"q": "An increase in the number or size of body cells contributes to:", "opts": ["Homeostasis", "Auscultation", "Growth", "Differentiation"], "a": 2, "exp": "Growth involves an increase in body size through larger or more numerous cells or added material.", "topic": "Life Processes", "ref": "Chapter 1 textbook/course overview"}, {"q": "A stem cell becoming a neuron demonstrates:", "opts": ["Differentiation", "Metabolism", "Reproduction of an organism", "Negative feedback"], "a": 0, "exp": "Differentiation is specialization of an unspecialized cell.", "topic": "Life Processes", "ref": "Chapter 1 textbook/course overview"}, {"q": "Sweating when body temperature rises is best classified as a response that supports:", "opts": ["Embryology", "Gross anatomy", "Homeostasis", "Positive feedback"], "a": 2, "exp": "Sweating helps return body temperature toward its normal range.", "topic": "Homeostasis", "ref": "Chapter 1 textbook/course overview"}, {"q": "Homeostasis means body conditions are:", "opts": ["Identical in every person", "Kept within relatively narrow, dynamic ranges", "Perfectly constant at all times", "Allowed to vary without regulation"], "a": 1, "exp": "Homeostasis is dynamic stability, not absolute constancy.", "topic": "Homeostasis", "ref": "Chapter 1 textbook/course overview"}, {"q": "Fluid located outside cells is collectively called:", "opts": ["Intracellular fluid", "Cytosol only", "Nucleoplasm", "Extracellular fluid"], "a": 3, "exp": "Extracellular fluid atic equilibrium", "Catabolism"], "a": 0, "exp": "Positive feedback reinforces the original change.", "topic": "Feedback Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which situation is the best example of negative feedback?", "opts": ["A microphone creates an increasing squeal", "Insulin lowers elevated blood glucose toward normal", "Platelets recruit more platelets during clotting", "Oxytocin intensifies uterine contractions"], "a": 1, "exp": "Lowering an elevated value toward normal opposes the original change.", "topic": "Feedback Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which situation is the best example of positive feedback?", "opts": ["Blood pressure returns toward normal after a brief rise", "Platelet activation recruits additional platelets during clotting", "Sweating cools an overheated body", "Heart rate falls after exercise ends"], "a": 1, "exp": "Platelet recruitment reinforces the process until the clot is formed.", "topic": "Feedback Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "A measured fever of 39.0°C is best classified as a:", "opts": ["Sign", "Symptom", "Set point", "Homeostatic receptor"], "a": 0, "exp": "A sign is objective and measurable.", "topic": "Clinical Terms", "ref": "Chapter 1 textbook/course overview"}, {"q": "A patient's report of nausea is best classified as a:", "opts": ["Effector", "Symptom", "Sign", "Plane"], "a": 1, "exp": "A symptom is a subjective experience reported by the patient.", "topic": "Clinical Terms", "ref": "Chapter 1 textbook/course overview"}, {"q": "In anatomical position, the thumbs point generally:", "opts": ["Inferiorly only", "Laterally", "Medially", "Posteriorly"], "a": 1, "exp": "With the palms forward, the thumbs are on the lateral side of the hands.", "topic": "Anatomical Terminology", "ref": "Chapter 1 textbook/course overview"}, {"q": "The sternum is ______ to the vertebral column.", "opts": ["Distal", "Inferior", "Anterior", "Posterior"], "a": 2 ls of Organization", "ref": "Chapter 1 textbook/course overview"}, {"q": "The heart and blood vessels together form the:", "opts": ["Cardiovascular system", "Cardiac tissue", "Ventral cavity", "Organismal level only"], "a": 0, "exp": "The heart and vessels are organs working together as a system.", "topic": "Body Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which system provides the body's main external protective barrier?", "opts": ["Lymphatic system", "Urinary system", "Integumentary system", "Endocrine system"], "a": 2, "exp": "Skin and associated structures protect the body surface.", "topic": "Body Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which system stores minerals and contains marrow that produces blood cells?", "opts": ["Skeletal system", "Muscular system", "Respiratory system", "Digestive system"], "a": 0, "exp": "Bones store minerals and house marrow for blood-cell production.", "topic": "Body Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which system mechanically produces most voluntary body movement?", "opts": ["Endocrine system", "Lymphatic system", "Muscular system", "Nervous system"], "a": 2, "exp": "Skeletal muscles generate voluntary movement.", "topic": "Body Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which life process allows the body to detect a drop in temperature and begin shivering?", "opts": ["Growth only", "Responsiveness", "Differentiation", "Reproduction"], "a": 1, "exp": "Responsiveness is the ability to detect and react to change.", "topic": "Life Processes", "ref": "Chapter 1 textbook/course overview"}, {"q": "Replacing damaged skin cells with newly formed cells is an example of:", "opts": ["Auscultation", "Cellular reproduction", "Positive feedback", "Catabolism only"], "a": 1, "exp": "Cell division provides cells for growth, repair, and replacement.", "topic": "Life Processes", "ref": "Chapter 1 textbook/course overview"}, {"q": "Which statement about metabo cal plane", "Receptor", "Control center", "Effector"], "a": 0, "exp": "The three basic components are receptor, control center, and effector.", "topic": "Feedback Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "A patient's complaint of dizziness is:", "opts": ["A controlled condition", "A symptom", "A sign", "An effector"], "a": 1, "exp": "Dizziness is subjective and reported by the patient.", "topic": "Clinical Terms", "ref": "Chapter 1 textbook/course overview"}, {"q": "A blood pressure reading of 88/54 mmHg is:", "opts": ["A plane", "A visceral membrane", "A sign", "A symptom"], "a": 2, "exp": "A blood pressure value is objectively measured.", "topic": "Clinical Terms", "ref": "Chapter 1 textbook/course overview"}, {"q": "When a regulated value moves outside its normal range, the change itself is called the:", "opts": ["Visceral layer", "Stimulus", "Effector", "Plane"], "a": 1, "exp": "A stimulus is a change in a controlled condition that initiates a response.", "topic": "Feedback Systems", "ref": "Chapter 1 textbook/course overview"}, {"q": "The chin is ______ to the forehead.", "opts": ["Inferior", "Superior", "Posterior", "Distal"], "a": 0, "exp": "The chin is below the forehead.", "topic": "Anatomical Terminology", "ref": "Chapter 1 textbook/course overview"}, {"q": "The heart is ______ to the lungs.", "opts": ["Distal", "Medial", "Lateral", "Superficial"], "a": 1, "exp": "The heart lies closer to the midline than the lungs.", "topic": "Anatomical Terminology", "ref": "Chapter 1 textbook/course overview"}, {"q": "The shoulder is ______ to the elbow.", "opts": ["Proximal", "Distal", "Contralateral", "Deep"], "a": 0, "exp": "The shoulder is nearer the upper limb's attachment to the trunk.", "topic": "Anatomical Terminology", "ref": "Chapter 1 textbook/course overview"}, {"q": "The bones are ______ to the skin.", "opts": ["Lateral", "Ipsilateral", "Deep", "Superficial"], "a": 2, "exp": "Bones lie farther from the surface than skin.", "topic": "Ana const key=(suffix)=>`ch1_three_tests_t${currentTest}_${suffix}`;
function loadState(){return {answers:JSON.parse(localStorage.getItem(key('answers'))||'{}'),flags:JSON.parse(localStorage.getItem(key('flags'))||'{}'),notes:JSON.parse(localStorage.getItem(key('notes'))||'{}')}}
function saveState(s){localStorage.setItem(key('answers'),JSON.stringify(s.answers));localStorage.setItem(key('flags'),JSON.stringify(s.flags));localStorage.setItem(key('notes'),JSON.stringify(s.notes))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderHome(){
 const host=document.getElementById('tiles');host.innerHTML='';
 TESTS.forEach((t,i)=>{const old=currentTest;currentTest=i;const s=loadState();currentTest=old;const answered=Object.keys(s.answers).length;const correct=Object.entries(s.answers).filter(([qi,a])=>t.questions[qi].a===a).length;
 const div=document.createElement('div');div.className='tile';div.innerHTML=`<div class="small">CHAPTER 1</div><h2>${t.name}</h2><div class="muted">${t.subtitle}</div><div style="margin:14px 0"><span class="pill">${answered} / 50 answered</span><span class="pill">${correct} correct so far</span></div><button class="primary" onclick="openTest(${i})">${answered?'Continue':'Start'} ${t.name}</button>`;host.appendChild(div)})
}
function openTest(i){currentTest=i;currentQ=0;const s=loadState();const u=TESTS[i].questions.findIndex((_,idx)=>s.answers[idx]===undefined);if(u>=0)currentQ=u;document.getElementById('home').classList.add('hidden');document.getElementById('testView').classList.remove('hidden');document.getElementById('testTitle').textContent=`Chapter 1 — ${TESTS[i].name}`;document.getElementById('testSub').textContent=TESTS[i].subtitle+' • 50 questions';document.getElementById('summary').classList.add('hidden');renderQuestion();window.scrollTo(0,0)}
function goHome(){document.getElementById('testView').classList.add('hidden');document.getElementById('home').classList.remove('hidden');renderHome();window.scrollTo(0,0)}
function renderQuestion(){
 const t=TESTS[currentTest],q=t.questions[currentQ],s=loadState(),answered=s.answers[currentQ]!==undefined,chosen=s.answers[currentQ],host=document.getElementById('questionHost');
 host.innerHTML=`<div class="qcard"><div class="qnum">Question ${currentQ+1} of 50</div><div class="topic">${esc(q.topic)}</div><div class="qtext">${esc(q.q)}</div><div id="opts"></div><div id="fb"></div><div class="flagrow"><button id="flagBtn" class="${s.flags[currentQ]?'flagged':''}" onclick="toggleFlag()">${s.flags[currentQ]?'⚑ Flagged':'⚐ Flag for review'}</button><input class="note" id="note" placeholder="Optional: note what you want to review" value="${esc(s.notes[currentQ]||'')}" oninput="saveNote(this.value)"></div></div><div class="nav"><button onclick="prevQ()" ${currentQ===0?'disabled':''}>← Previous</button><div class="navright"><button onclick="goHome()">All Tests</button><button class="primary" onclick="nextQ()">${currentQ===49?'Finish':'Next →'}</button></div></div>`;
 const opts=document.getElementById('opts');q.opts.forEach((o,oi)=>{const b=document.createElement('button');b.className='option';b.textContent=`${String.fromCharCode(65+oi)}. ${o}`;if(answered){b.disabled=true;if(oi===q.a)b.classList.add('correct');if(oi===chosen&&oi!==q.a)b.classList.add('wrong')}b.onclick=()=>answer(oi);opts.appendChild(b)});if(answered)showFeedback(q,chosen);updateProgress()
}
function answer(oi){const s=loadState();if(s.answers[currentQ]!==undefined)return;s.answers[currentQ]=oi;saveState(s);renderQuestion()}
function showFeedback(q,chosen){document.getElementById('fb').innerHTML=`<div class="feedback"><strong>${chosen===q.a?'Correct':'Incorrect'}.</strong> ${esc(q.exp)}<div class="small" style="margin-top:5px">${esc(q.ref)}</div></div>`}
function toggleFlag(){const s=loadState();s.flags[currentQ]=!s.flags[currentQ];saveState(s);renderQuestion()}
function saveNote(v){const s=loadState();s.notes[currentQ]=v;saveState(s)}
function prevQ(){if(currentQ>0){currentQ--;renderQuestion();window.scrollTo(0,0)}}
function nextQ(){if(currentQ<49){currentQ++;renderQuestion();window.scrollTo(0,0)}else finishTest()}
function updateProgress(){const s=loadState(),n=Object.keys(s.answers).length;document.getElementById('progressText').textContent=`${n} of 50 answered`;document.getElementById('fill').style.width=(n/50*100)+'%'}
function finishTest(){
 const t=TESTS[currentTest],s=loadState();let correct=0,wrong=[],flagged=[];t.questions.forEach((q,i)=>{if(s.answers[i]===q.a)correct++;else if(s.answers[i]!==undefined)wrong.push(i);if(s.flags[i])flagged.push(i)});const answered=Object.keys(s.answers).length,pct=Math.round(correct/50*100);let out=`<div class="score">${correct} / 50 (${pct}%)</div><div class="muted">${answered} answered • ${50-answered} unanswered • ${flagged.length} flagged</div>`;const reviewIds=[...new Set([...wrong,...flagged])];
 if(reviewIds.length){out+=`<h3 style="margin-top:22px">Personalized Review</h3><div class="small">Missed and flagged questions are collected here.</div>`;reviewIds.forEach(i=>{const q=t.questions[i],ans=s.answers[i];out+=`<div class="review"><strong>Q${i+1}. ${esc(q.q)}</strong><br><span class="small">Correct: ${esc(q.opts[q.a])}</span>${ans!==undefined&&ans!==q.a?`<br><span class="small">Your answer: ${esc(q.opts[ans])}</span>`:''}<div style="margin-top:6px">${esc(q.exp)}</div>${s.notes[i]?`<div style="margin-top:6px;color:#fde68a">Your note: ${esc(s.notes[i])}</div>`:''}</div>`})}else if(answered===50)out+=`<p><strong>Perfect run.</strong> No missed or flagged questions.</p>`;
 out+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button onclick="goHome()">All Tests</button><button onclick="jumpFirstReview()">Review missed/flagged</button></div>`;const box=document.getElementById('summary');box.innerHTML=out;box.classList.remove('hidden');box.scrollIntoView({behavior:'smooth'})
}
function jumpFirstReview(){const t=TESTS[currentTest],s=loadState(),i=t.questions.findIndex((q,idx)=>(s.answers[idx]!==undefined&&s.answers[idx]!==q.a)||s.flags[idx]);if(i>=0){currentQ=i;document.getElementById('summary').classList.add('hidden');renderQuestion();window.scrollTo(0,0)}}
function resetCurrent(){if(!confirm(`Reset all saved progress for ${TESTS[currentTest].name}?`))return;['answers','flags','notes'].forEach(x=>localStorage.removeItem(key(x)));currentQ=0;document.getElementById('summary').classList.add('hidden');renderQuestion()}
renderHome();
</script>
</body></html>
