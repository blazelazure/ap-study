function st(){return {a:JSON.parse(localStorage.getItem(key('a'))||'{}'),f:JSON.parse(localStorage.getItem(key('f'))||'{}'),n:JSON.parse(localStorage.getItem(key('n'))||'{}')}}function sv(s){localStorage.setItem(key('a'),JSON.stringify(s.a));localStorage.setItem(key('f'),JSON.stringify(s.f));localStorage.setItem(key('n'),JSON.stringify(s.n))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function home(){tiles.innerHTML='';TESTS.forEach((t,i)=>{const old=ti;ti=i;const s=st();ti=old;const done=Object.keys(s.a).length,good=Object.entries(s.a).filter(([k,v])=>t.questions[k].a===v).length;tiles.innerHTML+=`<div class="tile"><div class="eyebrow">${t.name}</div><h2>${t.subtitle}</h2><div class="muted">${done} / 50 answered • ${good} correct so far</div><div class="actions"><button class="primary" onclick="openT(${i})">${done?'Continue':'Start'} ${t.name}</button></div></div>`})}
function openT(i){ti=i;const s=st();qi=TESTS[i].questions.findIndex((_,j)=>s.a[j]===undefined);if(qi<0)qi=0;homeEl.classList.add('hidden');test.classList.remove('hidden');tt.textContent=`Chapter 7 — ${TESTS[i].name}`;sub.textContent=TESTS[i].subtitle+' • 50 questions';sum.classList.add('hidden');render();scrollTo(0,0)}function goHome(){test.classList.add('hidden');homeEl.classList.remove('hidden');home();scrollTo(0,0)}
const homeEl=document.getElementById('home');
function render(){const q=TESTS[ti].questions[qi],s=st(),chosen=s.a[qi],answered=chosen!==undefined;host.innerHTML=`<div class="qcard"><div class="qnum">Question ${qi+1} of 50</div><div class="small">${esc(q.topic)}</div><div class="qtext">${esc(q.q)}</div><div id="opts"></div><div id="fb"></div><div class="flagrow"><button onclick="flag()">${s.f[qi]?'⚑ Flagged':'⚐ Flag for review'}</button><input class="note" value="${esc(s.n[qi]||'')}" placeholder="Optional review note" oninput="note(this.value)"></div></div><div class="nav"><button onclick="prev()" ${qi===0?'disabled':''}>← Previous</button><div><button onclick="goHome()">All Tests</button> <button class="primary" onclick="next()">${qi===49?'Finish':'Next →'}</button></div></div>`;const o=document.getElementById('opts');q.opts.forEach((x,j)=>{const b=document.createElement('button');b.className='option';b.textContent=`${String.fromCharCode(65+j)}. ${x}`;if(answered){b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===chosen&&j!==q.a)b.classList.add('wrong')}b.onclick=()=>ans(j);o.appendChild(b)});if(answered)fb.innerHTML=`<div class="feedback"><strong>${chosen===q.a?'Correct':'Incorrect'}.</strong> ${esc(q.exp)}</div>`;prog()}
function ans(j){const s=st();if(s.a[qi]!==undefined)return;s.a[qi]=j;sv(s);render()}function flag(){const s=st();s.f[qi]=!s.f[qi];sv(s);render()}function note(v){const s=st();s.n[qi]=v;sv(s)}function prev(){if(qi>0){qi--;render();scrollTo(0,0)}}function next(){if(qi<49){qi++;render();scrollTo(0,0)}else finish()}function prog(){const n=Object.keys(st().a).length;pt.textContent=`${n} of 50 answered`;fill.style.width=n*2+'%'}
function finish(){const t=TESTS[ti],s=st();let good=0,ids=[];t.questions.forEach((q,i)=>{if(s.a[i]===q.a)good++;if((s.a[i]!==undefined&&s.a[i]!==q.a)||s.f[i])ids.push(i)});let h=`<div style="font-size:2rem;font-weight:850">${good} / 50 (${Math.round(good*2)}%)</div><div class="muted">${Object.keys(s.a).length} answered • ${ids.length} missed/flagged review items</div>`;if(ids.length){h+='<h3>Personalized Review</h3>';[...new Set(ids)].forEach(i=>{const q=t.questions[i];h+=`<div class="reviewitem"><strong>Q${i+1}. ${esc(q.q)}</strong><br><span class="small">Correct: ${esc(q.opts[q.a])}</span><div>${esc(q.exp)}</div>${s.n[i]?`<div style="color:#fde68a">Your note: ${esc(s.n[i])}</div>`:''}</div>`})}sum.innerHTML=h;sum.classList.remove('hidden');sum.scrollIntoView({behavior:'smooth'})}function resetTest(){if(confirm('Reset all progress for this test?')){['a','f','n'].forEach(x=>localStorage.removeItem(key(x)));qi=0;sum.classList.add('hidden');render()}}
