const ALL=[{"topic": "Core Concepts", "q": "Which key fact applies to “Saliva lubricates food and starts the chemical…”?", "a": "Saliva lubricates food and starts the chemical digestion of carbohydrates", "fact": "Saliva lubricates food and starts the chemical digestion of carbohydrates."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Salivation is controlled by the nervous system…”?", "a": "Salivation is controlled by the nervous system", "fact": "Salivation is controlled by the nervous system."}, {"topic": "Core Concepts", "q": "What are the teeth project into the mouth and?", "a": "adapted for mechanical digestion", "fact": "The teeth project into the mouth and are adapted for mechanical digestion."}, {"topic": "Core Concepts", "q": "What does a typical tooth consist of?", "a": "three principal regions: crown, root, and neck", "fact": "A typical tooth consists of three principal regions: crown, root, and neck."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Teeth are composed primarily of dentin and…”?", "a": "Teeth are composed primarily of dentin and are covered by enamel, the hardest substance in the body", "fact": "Teeth are composed primarily of dentin and are covered by enamel, the hardest substance in the body."}, {"topic": "Core Concepts", "q": "Which key fact applies to “There are two dentitions: deciduous and permanent…”?", "a": "There are two dentitions: deciduous and permanent", "fact": "There are two dentitions: deciduous and permanent."}, {"topic": "Core Concepts", "q": "What is through mastication, food?", "a": "mixed with saliva and shaped into a soft, flexible mass called a bolus", "fact": "Through mastication, food is mixed with saliva and shaped into a soft, flexible mass called a bolus."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Salivary amylase then begins the digestion of…”?", "a": "Salivary amylase then begins the digestion of starches, and lingual lipase acts on triglycerides", "fact": "Salivary amylase then begins the digestion of starches, and lingual lipase acts on triglycerides."}, {"topic": "Pharynx", "q": "What is the pharynx?", "a": "a funnel-shaped tube that extends from the choanae to the esophagus posteriorly and to the larynx anteriorly", "fact": "The pharynx is a funnel-shaped tube that extends from the choanae to the esophagus posteriorly and to the larynx anteriorly."}, {"topic": "Pharynx", "q": "Which key fact applies to “The pharynx has both respiratory and digestive…”?", "a": "The pharynx has both respiratory and digestive functions", "fact": "The pharynx has both respiratory and digestive functions."}, {"topic": "Esophagus", "q": "What is the esophagus?", "a": "a collapsible, muscular tube that connects the pharynx to the stomach", "fact": "The esophagus is a collapsible, muscular tube that connects the pharynx to the stomach."}, {"topic": "Esophagus", "q": "Which key fact applies to “It contains an upper and a lower…”?", "a": "It contains an upper and a lower esophageal sphincter", "fact": "It contains an upper and a lower esophageal sphincter."}, {"topic": "Deglutition", "q": "Which key fact applies to “Deglutition, or swallowing, moves a bolus from…”?", "a": "Deglutition, or swallowing, moves a bolus from the mouth to the stomach", "fact": "Deglutition, or swallowing, moves a bolus from the mouth to the stomach."}, {"topic": "Deglutition", "q": "Which key fact applies to “Swallowing consists of voluntary, pharyngeal (involuntary), and…”?", "a": "Swallowing consists of voluntary, pharyngeal (involuntary), and esophageal (involuntary) stages", "fact": "Swallowing consists of voluntary, pharyngeal (involuntary), and esophageal (involuntary) stages."}, {"topic": "Stomach", "q": "Which key fact applies to “The stomach connects the esophagus to the…”?", "a": "The stomach connects the esophagus to the duodenum", "fact": "The stomach connects the esophagus to the duodenum."}, {"topic": "Stomach", "q": "What are the principal anatomical regions of the stomach?", "a": "the cardia, fundus, body, and pyloric part", "fact": "The principal anatomical regions of the stomach are the cardia, fundus, body, and pyloric part."}, {"topic": "Stomach", "q": "What does adaptations of the stomach for digestion include gastric folds; glands that produce?", "a": "mucus, hydrochloric acid, pepsin, gastric lipase, and intrinsic factor; and a three-layered muscular layer", "fact": "Adaptations of the stomach for digestion include gastric folds; glands that produce mucus, hydrochloric acid, pepsin, gastric lipase, and intrinsic factor; and a three-layered muscular layer."}, {"topic": "Stomach", "q": "What does mechanical digestion consist of?", "a": "propulsion and retropulsion", "fact": "Mechanical digestion consists of propulsion and retropulsion."}, {"topic": "Stomach", "q": "Which key fact applies to “Chemical digestion consists mostly of the conversion…”?", "a": "Chemical digestion consists mostly of the conversion of proteins into peptides by pepsin", "fact": "Chemical digestion consists mostly of the conversion of proteins into peptides by pepsin."}, {"topic": "Stomach", "q": "What is the stomach wall?", "a": "impermeable to most substances", "fact": "The stomach wall is impermeable to most substances."}, {"topic": "Stomach", "q": "What does the lobes of the liver are made up of lobules that contain?", "a": "hepatocytes (liver cells), sinusoids, stellate reticuloendothelial cells, and a central vein", "fact": "The lobes of the liver are made up of lobules that contain hepatocytes (liver cells), sinusoids, stellate reticuloendothelial cells, and a central vein."}, {"topic": "Stomach", "q": "What is hepatocytes produce bile that?", "a": "carried by a duct system to the gallbladder for concentration and temporary storage", "fact": "Hepatocytes produce bile that is carried by a duct system to the gallbladder for concentration and temporary storage."}, {"topic": "Stomach", "q": "What is bile’s contribution to digestion?", "a": "the emulsification of dietary lipids", "fact": "Bile’s contribution to digestion is the emulsification of dietary lipids."}, {"topic": "Stomach", "q": "Which key fact applies to “The liver also functions in carbohydrate, lipid…”?", "a": "The liver also functions in carbohydrate, lipid, and protein metabolism; processing of drugs and hormones; excretion of bilirubin; synthesis of bile salts; storage of vitamins and minerals; phagocytosis; and activation of vitamin D", "fact": "The liver also functions in carbohydrate, lipid, and protein metabolism; processing of drugs and hormones; excretion of bilirubin; synthesis of bile salts; storage of vitamins and minerals; phagocytosis; and activation of vitamin D."}, {"topic": "Small Intestine", "q": "Which key fact applies to “The small intestine extends from the pyloric…”?", "a": "The small intestine extends from the pyloric sphincter to the ileal orifice", "fact": "The small intestine extends from the pyloric sphincter to the ileal orifice."}, {"topic": "Small Intestine", "q": "Which key fact applies to “It is divided into duodenum, jejunum, and…”?", "a": "It is divided into duodenum, jejunum, and ileum", "fact": "It is divided into duodenum, jejunum, and ileum."}, {"topic": "Small Intestine", "q": "What does its glands secrete?", "a": "fluid and mucus, and the circular folds, intestinal villi, and microvilli of its wall provide a large surface area for digestion and absorption", "fact": "Its glands secrete fluid and mucus, and the circular folds, intestinal villi, and microvilli of its wall provide a large surface area for digestion and absorption."}, {"topic": "Small Intestine", "q": "Which key fact applies to “Microvillous border enzymes digest α-dextrins, maltose, sucrose…”?", "a": "Microvillous border enzymes digest α-dextrins, maltose, sucrose, lactose, peptides, and nucleotides at the surface of mucosal epithelial cells", "fact": "Microvillous border enzymes digest α-dextrins, maltose, sucrose, lactose, peptides, and nucleotides at the surface of mucosal epithelial cells."}, {"topic": "Small Intestine", "q": "Which key fact applies to “Pancreatic and intestinal microvillous border enzymes break…”?", "a": "Pancreatic and intestinal microvillous border enzymes break down starches into maltose, maltotriose, and α-dextrins (pancreatic amylase), α-dextrins into glucose (α-dextrinase), maltose to glucose (maltase), sucrose to glucose and fructose (sucrase), lactose to glucose and galactose (lactase), and proteins into peptides (trypsin, chymotrypsin, and elastase)", "fact": "Pancreatic and intestinal microvillous border enzymes break down starches into maltose, maltotriose, and α-dextrins (pancreatic amylase), α-dextrins into glucose (α-dextrinase), maltose to glucose (maltase), sucrose to glucose and fructose (sucrase), lactose to glucose and galactose (lactase), and proteins into peptides (trypsin, chymotrypsin, and elastase)."}, {"topic": "Small Intestine", "q": "Which key fact applies to “Also, enzymes break off amino acids at…”?", "a": "Also, enzymes break off amino acids at the carboxyl ends of peptides (carboxypeptidases) and break off amino acids at the amino ends of peptides (aminopeptidases)", "fact": "Also, enzymes break off amino acids at the carboxyl ends of peptides (carboxypeptidases) and break off amino acids at the amino ends of peptides (aminopeptidases)."}, {"topic": "Small Intestine", "q": "Which key fact applies to “Finally, enzymes split dipeptides into amino acids…”?", "a": "Finally, enzymes split dipeptides into amino acids (dipeptidases), triglycerides to fatty acids and monoglycerides (lipases), and nucleotides to pentoses and nitrogenous bases (nucleosidases and phosphatases)", "fact": "Finally, enzymes split dipeptides into amino acids (dipeptidases), triglycerides to fatty acids and monoglycerides (lipases), and nucleotides to pentoses and nitrogenous bases (nucleosidases and phosphatases)."}, {"topic": "Small Intestine", "q": "Which key fact applies to “Mechanical digestion in the small intestine involves…”?", "a": "Mechanical digestion in the small intestine involves segmentation and migrating motility complexes", "fact": "Mechanical digestion in the small intestine involves segmentation and migrating motility complexes."}, {"topic": "Small Intestine", "q": "Which key fact applies to “Absorption occurs via diffusion, facilitated diffusion, osmosis…”?", "a": "Absorption occurs via diffusion, facilitated diffusion, osmosis, and active transport; most absorption occurs in the small intestine", "fact": "Absorption occurs via diffusion, facilitated diffusion, osmosis, and active transport; most absorption occurs in the small intestine."}, {"topic": "Small Intestine", "q": "Which key fact applies to “Monosaccharides, amino acids, and short-chain fatty acids…”?", "a": "Monosaccharides, amino acids, and short-chain fatty acids pass into the blood capillaries", "fact": "Monosaccharides, amino acids, and short-chain fatty acids pass into the blood capillaries."}, {"topic": "Small Intestine", "q": "What are long-chain fatty acids and monoglycerides?", "a": "absorbed from micelles, resynthesized to triglycerides, and formed into chylomicrons", "fact": "Long-chain fatty acids and monoglycerides are absorbed from micelles, resynthesized to triglycerides, and formed into chylomicrons."}, {"topic": "Small Intestine", "q": "Which key fact applies to “Chylomicrons move into lymph plasma in the…”?", "a": "Chylomicrons move into lymph plasma in the lymphatic capillary of an intestinal villus", "fact": "Chylomicrons move into lymph plasma in the lymphatic capillary of an intestinal villus."}, {"topic": "Small Intestine", "q": "What are among the substances the stomach can absorb?", "a": "water, certain ions, drugs, and alcohol", "fact": "Among the substances the stomach can absorb are water, certain ions, drugs, and alcohol."}, {"topic": "Small Intestine", "q": "Which key fact applies to “The small intestine also absorbs electrolytes, vitamins…”?", "a": "The small intestine also absorbs electrolytes, vitamins, and water", "fact": "The small intestine also absorbs electrolytes, vitamins, and water."}, {"topic": "Pancreas", "q": "Which key fact applies to “The large intestine extends from the ileal…”?", "a": "The large intestine extends from the ileal orifice to the anus", "fact": "The large intestine extends from the ileal orifice to the anus."}, {"topic": "Pancreas", "q": "What does the pancreas consist of?", "a": "a head, a body, and a tail and is connected to the duodenum via the pancreatic duct and accessory duct", "fact": "The pancreas consists of a head, a body, and a tail and is connected to the duodenum via the pancreatic duct and accessory duct."}, {"topic": "Pancreas", "q": "Which key fact applies to “Its regions include the cecum, colon, and…”?", "a": "Its regions include the cecum, colon, and rectum", "fact": "Its regions include the cecum, colon, and rectum."}, {"topic": "Pancreas", "q": "What does endocrine pancreatic islets secrete?", "a": "hormones, and exocrine pancreatic acini secrete pancreatic juice", "fact": "Endocrine pancreatic islets secrete hormones, and exocrine pancreatic acini secrete pancreatic juice."}, {"topic": "Pancreas", "q": "What does pancreatic juice contain?", "a": "enzymes that digest starch (pancreatic amylase), proteins (trypsin, chymotrypsin, carboxypeptidase, and elastase), triglycerides (pancreatic lipase), and nucleic acids (ribonuclease and deoxyribonuclease)", "fact": "Pancreatic juice contains enzymes that digest starch (pancreatic amylase), proteins (trypsin, chymotrypsin, carboxypeptidase, and elastase), triglycerides (pancreatic lipase), and nucleic acids (ribonuclease and deoxyribonuclease)."}, {"topic": "Liver and Gallbladder", "q": "Which key fact applies to “The liver has left and right lobes…”?", "a": "The liver has left and right lobes; the left lobe includes a quadrate lobe and a caudate lobe", "fact": "The liver has left and right lobes; the left lobe includes a quadrate lobe and a caudate lobe."}, {"topic": "Liver and Gallbladder", "q": "What is the gallbladder?", "a": "a sac located in a depression on the posterior surface of the liver that stores and concentrates bile", "fact": "The gallbladder is a sac located in a depression on the posterior surface of the liver that stores and concentrates bile."}, {"topic": "Large Intestine", "q": "What does the mucosa contains many goblet cells, and the muscular layer consist of?", "a": "teniae coli and haustra", "fact": "The mucosa contains many goblet cells, and the muscular layer consists of teniae coli and haustra."}, {"topic": "Large Intestine", "q": "Which key fact applies to “Mechanical movements of the large intestine include…”?", "a": "Mechanical movements of the large intestine include haustral churning, peristalsis, and mass peristalsis", "fact": "Mechanical movements of the large intestine include haustral churning, peristalsis, and mass peristalsis."}, {"topic": "Large Intestine", "q": "Which key fact applies to “The last stages of chemical digestion occur…”?", "a": "The last stages of chemical digestion occur in the large intestine through bacterial action", "fact": "The last stages of chemical digestion occur in the large intestine through bacterial action."}, {"topic": "Large Intestine", "q": "Which key fact applies to “Substances are further broken down, and some…”?", "a": "Substances are further broken down, and some vitamins are synthesized", "fact": "Substances are further broken down, and some vitamins are synthesized."}, {"topic": "Large Intestine", "q": "Which key fact applies to “The large intestine absorbs water, ions, and…”?", "a": "The large intestine absorbs water, ions, and vitamins", "fact": "The large intestine absorbs water, ions, and vitamins."}, {"topic": "Large Intestine", "q": "Which key fact applies to “Feces consist of water, inorganic salts, epithelial…”?", "a": "Feces consist of water, inorganic salts, epithelial cells, bacteria, and undigested foods", "fact": "Feces consist of water, inorganic salts, epithelial cells, bacteria, and undigested foods."}, {"topic": "Large Intestine", "q": "What is the elimination of feces from the rectum called?", "a": "defecation", "fact": "The elimination of feces from the rectum is called defecation."}, {"topic": "Large Intestine", "q": "Which key fact applies to “Defecation is a reflex action aided by…”?", "a": "Defecation is a reflex action aided by voluntary contractions of the diaphragm and abdominal muscles and relaxation of the external anal sphincter", "fact": "Defecation is a reflex action aided by voluntary contractions of the diaphragm and abdominal muscles and relaxation of the external anal sphincter."}, {"topic": "Large Intestine", "q": "What are the activities that occur during the various phases of digestion?", "a": "coordinated by neural pathways and by hormones", "fact": "The activities that occur during the various phases of digestion are coordinated by neural pathways and by hormones."}, {"topic": "Large Intestine", "q": "Which key fact applies to “Table 24.8 summarizes the major hormones that…”?", "a": "Table 24.8 summarizes the major hormones that control digestion", "fact": "Table 24.8 summarizes the major hormones that control digestion."}, {"topic": "Development of the Digestive System", "q": "Which key fact applies to “Digestive activities occur in three overlapping phases…”?", "a": "Digestive activities occur in three overlapping phases: cephalic, gastric, and intestinal", "fact": "Digestive activities occur in three overlapping phases: cephalic, gastric, and intestinal."}, {"topic": "Development of the Digestive System", "q": "Which key fact applies to “The endoderm of the primitive gut forms…”?", "a": "The endoderm of the primitive gut forms the epithelium and glands of most of the digestive canal", "fact": "The endoderm of the primitive gut forms the epithelium and glands of most of the digestive canal."}, eing overloaded with more chyme than it can handle."}, {"topic": "Aging and the Digestive System", "q": "Which key fact applies to “General changes include decreased secretory mechanisms, decreased…”?", "a": "General changes include decreased secretory mechanisms, decreased motility, and loss of tone", "fact": "General changes include decreased secretory mechanisms, decreased motility, and loss of tone."}, {"topic": "Aging and the Digestive System", "q": "Which key fact applies to “Specific changes may include loss of taste…”?", "a": "Specific changes may include loss of taste, pyorrhea, hernias, peptic ulcer disease, constipation, hemorrhoids, and diverticular diseases", "fact": "Specific changes may include loss of taste, pyorrhea, hernias, peptic ulcer disease, constipation, hemorrhoids, and diverticular diseases."}, {"topic": "Course Study Guide", "q": "What does area of the body that contain?", "a": "the stomach, liver, gallbladder, pancreas,", "fact": "Area of the body that contains the stomach, liver, gallbladder, pancreas,"}, {"topic": "Course Study Guide", "q": "Which key fact applies to “spleen, small intestine, appendix, and part of…”?", "a": "spleen, small intestine, appendix, and part of the large intestine", "fact": "spleen, small intestine, appendix, and part of the large intestine."}, {"topic": "Course Study Guide", "q": "Which key fact applies to “Area of the body containing the urinary…”?", "a": "Area of the body containing the urinary bladder, reproductive organs,", "fact": "Area of the body containing the urinary bladder, reproductive organs,"}, {"topic": "Course Study Guide", "q": "Which key fact applies to “rectum, remainder of large intestine, and appendix…”?", "a": "rectum, remainder of large intestine, and appendix", "fact": "rectum, remainder of large intestine, and appendix."}, {"topic": "Course Study Guide", "q": "Which key fact applies to “Terms Referring to Regions in the Abdominopelvic…”?", "a": "Terms Referring to Regions in the Abdom
