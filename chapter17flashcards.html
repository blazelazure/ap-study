eptors for the sense of smell or olfaction (ōl-fak-shun; olfact- = smell)?", "a": "located in the olfactory epithelium of the nose", "fact": "The receptors for the sense of smell or olfaction (ōl-FAK-shun; olfact- = smell) are located in the olfactory epithelium of the nose."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Last night as you were studying anatomy…”?", "a": "Last night as you were studying anatomy and physiology in the lounge, all of a sudden you were surrounded by the smell of freshly baked brownies", "fact": "Last night as you were studying anatomy and physiology in the lounge, all of a sudden you were surrounded by the smell of freshly baked brownies."}, {"topic": "Core Concepts", "q": "Which key fact applies to “When you followed your nose and begged…”?", "a": "When you followed your nose and begged for one, biting into the moist, flavorful treat transported you back 10 years into your mother’s kitchen", "fact": "When you followed your nose and begged for one, biting into the moist, flavorful treat transported you back 10 years into your mother’s kitchen."}, {"topic": "Core Concepts", "q": "What does the olfactory epithelium consist of?", "a": "olfactory sensory neurons, supporting epithelial cells, and basal epithelial cells", "fact": "The olfactory epithelium consists of olfactory sensory neurons, supporting epithelial cells, and basal epithelial cells."}, {"topic": "Core Concepts", "q": "What are olfactory sensory neurons?", "a": "the first-order neurons of the olfactory pathway", "fact": "Olfactory sensory neurons are the first-order neurons of the olfactory pathway."}, {"topic": "Core Concepts", "q": "What is each olfactory sensory neuron?", "a": "a bipolar neuron with an exposed, knob-shaped dendrite and an axon projecting through the cribriform plate that ends in the olfactory bulb", "fact": "Each olfactory sensory neuron is a bipolar neuron with an exposed, knob-shaped dendrite and an axon projecting through the cribriform plate that ends in the olfactory bulb."}, {"topic": "OBJECTIV ES", "q": "What is like olfaction, gustation (gus-tā-shun), or taste,?", "a": "a chemical sense", "fact": "Like olfaction, gustation (gus-TĀ-shun), or taste, is a chemical sense."}, {"topic": "OBJECTIV ES", "q": "What is however, gustation?", "a": "much simpler than olfaction in that only five primary tastes can be distinguished: salty, sour, sweet, bitter, and umami (oo-MAH-mē)", "fact": "However, gustation is much simpler than olfaction in that only five primary tastes can be distinguished: salty, sour, sweet, bitter, and umami (oo-MAH-mē)."}, {"topic": "OBJECTIV ES", "q": "What is salty taste?", "a": "caused by the presence of sodium ions (Na+) in food", "fact": "Salty taste is caused by the presence of sodium ions (Na+) in food."}, {"topic": "OBJECTIV ES", "q": "What is a common dietary source of na+?", "a": "Nacl (table salt)", "fact": "A common dietary source of Na+ is Nacl (table salt)."}, {"topic": "OBJECTIV ES", "q": "What is sour taste?", "a": "produced by hydrogen ions (H+) released from acids", "fact": "Sour taste is produced by hydrogen ions (H+) released from acids."}, {"topic": "OBJECTIV ES", "q": "What does lemons have a sour taste because they contain?", "a": "citric acid", "fact": "Lemons have a sour taste because they contain citric acid."}, {"topic": "Vision: An Overview", "q": "What is objectiv es • discuss why vision?", "a": "important", "fact": "OBJECTIV ES • Discuss why vision is important."}, {"topic": "Vision: An Overview", "q": "What is vision, the act of seeing,?", "a": "extremely important to human survival because it allows us to view potentially dangerous objects 608 C ha pter 17 The Special Senses in our surroundings", "fact": "Vision, the act of seeing, is extremely important to human survival because it allows us to view potentially dangerous objects 608 C ha pter 17 The Special Senses in our surroundings."}, {"topic": "Vision: An Overview", "q": "What are more than half th
