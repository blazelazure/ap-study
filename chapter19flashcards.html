 cord."}, {"topic": "Formation of Blood Cells", "q": "Which key fact applies to “Hemopoiesis is the formation of blood cells…”?", "a": "Hemopoiesis is the formation of blood cells from multipotent stem cells in red bone marrow", "fact": "Hemopoiesis is the formation of blood cells from multipotent stem cells in red bone marrow."}, {"topic": "Formation of Blood Cells", "q": "Which key fact applies to “Cord-blood transplants have several advantages over bone…”?", "a": "Cord-blood transplants have several advantages over bone marrow transplants", "fact": "Cord-blood transplants have several advantages over bone marrow transplants."}, {"topic": "Formation of Blood Cells", "q": "Which key fact applies to “Myeloid stem cells form RBCs, platelets, granulocytes…”?", "a": "Myeloid stem cells form RBCs, platelets, granulocytes, and monocytes", "fact": "Myeloid stem cells form RBCs, platelets, granulocytes, and monocytes."}, {"topic": "Formation of Blood Cells", "q": "Which key fact applies to “Lymphoid stem cells give rise to lymphocytes…”?", "a": "Lymphoid stem cells give rise to lymphocytes", "fact": "Lymphoid stem cells give rise to lymphocytes."}, {"topic": "Hemostasis", "q": "Which key fact applies to “Several hemopoietic growth factors stimulate differentiation and…”?", "a": "Several hemopoietic growth factors stimulate differentiation and proliferation of the various blood cells", "fact": "Several hemopoietic growth factors stimulate differentiation and proliferation of the various blood cells."}, {"topic": "Red Blood Cells", "q": "What does mature rbcs are biconcave discs that lack nuclei and contain?", "a": "emoglobin", "fact": "Mature RBCs are biconcave discs that lack nuclei and contain emoglobin."}, {"topic": "Red Blood Cells", "q": "What is the function of the hemoglobin in red blood cells?", "a": "to transport oxygen and some carbon dioxide", "fact": "The function of the hemoglobin in red blood cells is to transport oxygen and some carbon dioxide."}, {"topic": " m, the smooth muscle of…”?", "a": "In vascular spasm, the smooth muscle of a blood vessel wall contracts, which slows blood loss", "fact": "In vascular spasm, the smooth muscle of a blood vessel wall contracts, which slows blood loss."}, {"topic": "White Blood Cells", "q": "Which key fact applies to “Platelet plug formation involves the aggregation of…”?", "a": "Platelet plug formation involves the aggregation of platelets to stop bleeding", "fact": "Platelet plug formation involves the aggregation of platelets to stop bleeding."}, {"topic": "White Blood Cells", "q": "What is a clot?", "a": "a network of insoluble protein fibers (fibrin) in which formed elements of blood are trapped", "fact": "A clot is a network of insoluble protein fibers (fibrin) in which formed elements of blood are trapped."}, {"topic": "White Blood Cells", "q": "What are the chemicals involved in clotting?", "a": "known as clotting factors", "fact": "The chemicals involved in clotting are known as clotting factors."}, {"topic": "White Blood Cells", "q": "Which key fact applies to “Blood clotting involves a cascade of reactions…”?", "a": "Blood clotting involves a cascade of reactions that may be divided into three stages: formation of prothrombinase, conversion of prothrombin into thrombin, and conversion of soluble fibrinogen into insoluble fibrin", "fact": "Blood clotting involves a cascade of reactions that may be divided into three stages: formation of prothrombinase, conversion of prothrombin into thrombin, and conversion of soluble fibrinogen into insoluble fibrin."}, {"topic": "White Blood Cells", "q": "Which key fact applies to “Clotting is initiated by the interplay of…”?", "a": "Clotting is initiated by the interplay of the extrinsic and intrinsic pathways of blood clotting", "fact": "Clotting is initiated by the interplay of the extrinsic and intrinsic pathways of blood clotting."}, {"topic": "White Blood Cells", "q": "What is normal coagulation requires vitamin k and?", "a": "follo ts", "q": "Which key fact applies to “It is present chiefly in bones of…”?", "a": "It is present chiefly in bones of the axial skeleton, pectoral and pelvic girdles, and the proximal epi physes of the humerus and femur", "fact": "It is present chiefly in bones of the axial skeleton, pectoral and pelvic girdles, and the proximal epi physes of the humerus and femur."}, {"topic": "Red Blood Cells", "q": "What does red blood cells (rbcs) or erythrocytes (e-rith-rō-sīts; erythro= red; -cyte = cell) contain?", "a": "the oxygen-carrying protein hemoglobin, which is a pigment that gives whole blood its red color", "fact": "Red blood cells (RBCs) or erythrocytes (e-RITH-rō-sīts; erythro= red; -cyte = cell) contain the oxygen-carrying protein hemoglobin, which is a pigment that gives whole blood its red color."}, {"topic": "Red Blood Cells", "q": "What is their plasma membrane?", "a": "both strong and flexible, which allows them to deform without rupturing as they squeeze through narrow blood capillaries", "fact": "Their plasma membrane is both strong and flexible, which allows them to deform without rupturing as they squeeze through narrow blood capillaries."}, {"topic": "Red Blood Cells", "q": "What are as you will see later, certain glycolipids in the plasma membrane of rbcs?", "a": "antigens that account for the various blood groups such as the ABO and Rh groups", "fact": "As you will see later, certain glycolipids in the plasma membrane of RBCs are antigens that account for the various blood groups such as the ABO and Rh groups."}, {"topic": "Red Blood Cells", "q": "Which key fact applies to “RBCs lack a nucleus and other organelles…”?", "a": "RBCs lack a nucleus and other organelles and can neither reproduce nor carry on extensive metabolic activities", "fact": "RBCs lack a nucleus and other organelles and can neither reproduce nor carry on extensive metabolic activities."}, {"topic": "Red Blood Cells", "q": "What does the cytosol of rbcs contain?", "a": "hemoglobin molecules; these important molecules are synthesized before loss of the nucleus during RBC production and constitute about 33% of the cell’s weight", "fact": "The cytosol of RBCs contains hemoglobin molecules; these important molecules are synthesized before loss of the nucleus during RBC production and constitute about 33% of the cell’s weight."}, {"topic": "Red Blood Cells", "q": "What are rbc physiology red blood cells?", "a": "highly specialized for their oxygen transport function", "fact": "RBC Physiology Red blood cells are highly specialized for their oxygen transport function."}, {"topic": "Red Blood Cells", "q": "What is because mature rbcs have no nucleus, all of their internal space?", "a": "available for oxygen transport", "fact": "Because mature RBCs have no nucleus, all of their internal space is available for oxygen transport."}, {"topic": "White Blood Cells", "q": "Which key fact applies to “Types of White Blood Cells Unlike red…”?", "a": "Types of White Blood Cells Unlike red blood cells, white blood cells (WBCs) or leukocytes (LOO-kō-sīts; leuko- = white) have nuclei and a full complement of other organelles but they do not contain hemoglobin", "fact": "Types of White Blood Cells Unlike red blood cells, white blood cells (WBCs) or leukocytes (LOO-kō-sīts; leuko- = white) have nuclei and a full complement of other organelles but they do not contain hemoglobin."}, {"topic": "White Blood Cells", "q": "What does wbcs are classified as either granular or agranular, depending on whether they contain?", "a": "conspicuous chemical-filled cytoplasmic granules (vesicles) that are made visible by staining when viewed through a light microscope", "fact": "WBCs are classified as either granular or agranular, depending on whether they contain conspicuous chemical-filled cytoplasmic granules (vesicles) that are made visible by staining when viewed through a light microscope."}, {"topic": "White Blood Cells", "q": "Which key fact applies to “Granular leukocytes inclu to cells that produce platelets", "fact": "Besides the immature cell types that develop into erythrocytes and leukocytes, hemopoietic stem cells also differentiate into cells that produce platelets."}, {"topic": "Platelets", "q": "Which key fact applies to “Megakaryoblasts transform into megakaryocytes, huge cells that…”?", "a": "Megakaryoblasts transform into megakaryocytes, huge cells that splinter into 2000 to 3000 fragments", "fact": "Megakaryoblasts transform into megakaryocytes, huge cells that splinter into 2000 to 3000 fragments."}, {"topic": "Platelets", "q": "What is each fragment, enclosed by a piece of the plasma membrane,?", "a": "a platelet", "fact": "Each fragment, enclosed by a piece of the plasma membrane, is a platelet."}];let F=[...ALL],i=0;const KEY='ap_ch19_flash_status';let status=JSON.parse(localStorage.getItem(KEY)||'{}');
