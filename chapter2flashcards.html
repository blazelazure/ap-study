const ALL=[{"topic": "How Matter Is Organized", "q": "Chemistry", "a": "The science of the structure and interactions of matter", "fact": "Chemistry is the science of the structure and interactions of matter."}, {"topic": "How Matter Is Organized", "q": "What is each element made up of?", "a": "small units called atoms", "fact": "Each element is made up of small units called atoms."}, {"topic": "How Matter Is Organized", "q": "What do atoms consist of?", "a": "protons and neutrons (the nucleus), plus electrons that move about the nucleus in regions called electron shells", "fact": "Atoms consist of a nucleus, which contains protons and neutrons, plus electrons that move about the nucleus in regions called electron shells."}, {"topic": "How Matter Is Organized", "q": "What are all forms of matter composed of?", "a": "chemical elements", "fact": "All forms of matter are composed of chemical elements."}, {"topic": "How Matter Is Organized", "q": "What is an atomic number?", "a": "The number of protons of an atom, distinguishes the atoms of one element from those of another element", "fact": "The number of protons (the atomic number) distinguishes the atoms of one element from those of another element."}, {"topic": "How Matter Is Organized", "q": "Oxygen, carbon, hydrogen, and nitrogen make up what percent of body mass”?", "a": "Oxygen, carbon, hydrogen, and nitrogen make up about 96% of body mass", "fact": "Oxygen, carbon, hydrogen, and nitrogen make up about 96% of body mass."}, {"topic": "How Matter Is Organized", "q": "What is the mass number of an atom?", "a": "the sum of its protons and neutrons", "fact": "The mass number of an atom is the sum of its protons and neutrons."}, {"topic": "How Matter Is Organized", "q": "Mineral", "a": "naturally occuring inorganic element used in chemical reactions in the body and necessary for normal cell function", "fact": "60 C h a pter 2 The Chemical Level of Organization"}, {"topic": "How Matter Is Organized", "q": "What are different atoms of an element that have the same number of protons but different numbers of neutrons called?", "a": "isotopes", "fact": "Different atoms of an element that have the same number of protons but different numbers of neutrons are called isotopes."}, {"topic": "How Matter Is Organized", "q": "What are radioactive isotopes?", "a": "unstable isotopes that decay", "fact": "Radioactive isotopes are unstable and decay."}, {"topic": "How Matter Is Organized", "q": "What is the atomic mass of an element?", "a": "the average mass of all naturally occurring isotopes of that element", "fact": "The atomic mass of an element is the average mass of all naturally occurring isotopes of that element."}, {"topic": "How Matter Is Organized", "q": "An atom that gives up or gains electrons is what?", "a": "An atom that gives up or gains electrons becomes an ion—an atom that has a positive or negative charge because it has unequal numbers of protons and electrons", "fact": "An atom that gives up or gains electrons becomes an ion—an atom that has a positive or negative charge because it has unequal numbers of protons and electrons."}, {"topic": "How Matter Is Organized", "q": "What are positively charged ions?", "a": "cations; negatively charged ions are anions", "fact": "Positively charged ions are cations; negatively charged ions are anions."}, {"topic": "How Matter Is Organized", "q": "What is formed when two atoms share electrons?", "a": "a molecule", "fact": "If two atoms share electrons, a molecule is formed."}, {"topic": "How Matter Is Organized", "q": "Which key fact applies to “What makes a compound?", "a": "Compounds contain atoms of two or more elements", "fact": "Compounds contain atoms of two or more elements."}, {"topic": "How Matter Is Organized", "q": "What is a free radical?", "a": "an atom or group of atoms with an unpaired electron in its outermost shell", "fact": "A free radical is an atom or group of atoms with an unpaired electron in its outermost shell."}, {"topic": "How Matter Is Organized", "q": "What is an example of a free radical?", "a": "superoxide, an anion which is formed by the addition of an electron to an oxygen molecule", "fact": "A common example is superoxide, an anion which is formed by the addition of an electron to an oxygen molecule."}, {"topic": "Chemical Bonds", "q": "What are chemical bonds?", "a": "Forces of attraction that hold atoms together", "fact": "Forces of attraction called chemical bonds hold atoms together."}, {"topic": "Chemical Bonds", "q": "How are chemical bonds formed?", "a": "These bonds result from gaining, losing, or sharing electrons in the valence shell", "fact": "These bonds result from gaining, losing, or sharing electrons in the valence shell."}, {"topic": "Chemical Bonds", "q": "When do most atoms become stable?", "a": "Most atoms become stable when they have an octet of eight electrons in their valence (outermost) electron shell", "fact": "Most atoms become stable when they have an octet of eight electrons in their valence (outermost) electron shell."}, {"topic": "Chemical Bonds", "q": "How are ionic bonds formed?", "a": "When the force of attraction between ions of opposite charge holds them together", "fact": "When the force of attraction between ions of opposite charge holds them together, an ionic bond has formed."}, {"topic": "Chemical Bonds", "q": "covalent bonds", "a": "In a covalent bond, atoms share pairs of valence electrons", "fact": "In a covalent bond, atoms share pairs of valence electrons."}, {"topic": "Chemical Bonds", "q": "Covalent bond types", "a": "Covalent bonds may be single, double, or triple and either nonpolar or polar", "fact": "Covalent bonds may be single, double, or triple and either nonpolar or polar."}, {"topic": "Chemical Bonds", "q": "What is a hydrogen bond?", "a": "An atom of hydrogen that forms a polar covalent bond with an oxygen atom or a nitrogen atom may also form a weaker bond, called a hydrogen bond, with an electronegative atom", "fact": "An atom of hydrogen that forms a polar covalent bond with an oxygen atom or a nitrogen atom may also form a weaker bond, called a hydrogen bond, with an electronegative atom."}, {"topic": "Chemical Bonds", "q": "Explain hydrogen bonds", "a": "The polar covalent bond causes the hydrogen atom to have a partial positive charge (δ +) that attracts the partial negative charge (δ −) of neighboring electronegative atoms, often oxygen or nitrogen", "fact": "The polar covalent bond causes the hydrogen atom to have a partial positive charge (δ +) that attracts the partial negative charge (δ −) of neighboring electronegative atoms, often oxygen or nitrogen."}, {"topic": "Chemical Reactions", "q": "A chemical reaction occurs when…", "a": "When atoms combine with or break apart from other atoms", "fact": "When atoms combine with or break apart from other atoms, a chemical reaction occurs."}, {"topic": "Chemical Reactions", "q": "What are reactants and products?", "a": "the starting and ending substance in a reaction", "fact": "The starting substances are the reactants, and the ending ones are the products."}, {"topic": "Chemical Reactions", "q": "What are the two types of energy (the capacity to do work)?", "a": "potential (stored) energy and kinetic energy (energy of motion)", "fact": "Energy, the capacity to do work, is of two principal kinds: potential (stored) energy and kinetic energy (energy of motion)."}, {"topic": "Chemical Reactions", "q": "Endergonic reactions vs exergonic reactions", "a": "Endergonic reactions require energy; exergonic reactions release energy", "fact": "Endergonic reactions require energy; exergonic reactions release energy."}, {"topic": "Chemical Reactions", "q": "True or False: ATP couples endergonic and exergonic reactions", "a": "True", "fact": "ATP couples endergonic and exergonic reactions."}, {"topic": "Chemical Reactions", "q": "What is the initial energy investment needed to start a reaction?", "a": "the activation energy", "fact": "The initial energy investment needed to start a reaction is the activation energy."}, {"topic": "Chemical Reactions", "q": "When do reactions become more likely?", "a": "Reactions are more likely when the concentrations and the temperatures of the reacting particles are higher", "fact": "Reactions are more likely when the concentrations and the temperatures of the reacting particles are higher."}, {"topic": "Chemical Reactions", "q": "Catalysts", "a": "Catalysts accelerate chemical reactions by lowering the activation energy", "fact": "Catalysts accelerate chemical reactions by lowering the activation energy."}, {"topic": "Chemical Reactions", "q": "What are most catalysts in living organisms?", "a": "protein molecules called enzymes", "fact": "Most catalysts in living organisms are protein molecules called enzymes."}, {"topic": "Chemical Reactions", "q": "Synthesis reactions", "a": "the combination of reactants to produce larger molecules", "fact": "Synthesis reactions involve the combination of reactants to produce larger molecules."}, {"topic": "Chemical Reactions", "q": "Are synthesis reactions endergonic or exergonic, and anabolic or catabolic?", "a": "anabolic and usually endergonic", "fact": "The reactions are anabolic and usually endergonic."}, {"topic": "Chemical Reactions", "q": "What are decomposition reactions?", "a": "a substance broken down into smaller molecules", "fact": "In decomposition reactions, a substance is broken down into smaller molecules."}, {"topic": "Chemical Reactions", "q": "Are decomposition reactions endergonic or exergonic, and anabolic or catabolic?", "a": "catabolic and usually exergonic", "fact": "The reactions are catabolic and usually exergonic."}, {"topic": "Chemical Reactions", "q": "What are exchange reactions?", "a": "Exchange reactions involve the replacement of one atom or atoms by another atom or atoms", "fact": "Exchange reactions involve the replacement of one atom or atoms by another atom or atoms."}, {"topic": "Chemical Reactions", "q": "What are reversible reactions?", "a": "In reversible reactions, end products can revert to the original reactants", "fact": "In reversible reactions, end products can revert to the original reactants."}, {"topic": "Inorganic Compounds and Solutions", "q": "What are inorganic compounds usually?", "a": "small and usually lack carbon", "fact": "Inorganic compounds usually are small and usually lack carbon."}, {"topic": "Inorganic Compounds and Solutions", "q": "What do organic substances always contain?", "a": "carbon, usually contain hydrogen, and always have covalent bonds", "fact": "Organic substances always contain carbon, usually contain hydrogen, and always have covalent bonds."}, {"topic": "Inorganic Compounds and Solutions", "q": "What is the most abundant substance in the body?", "a": "Water", "fact": "Water is the most abundant substance in the body."}, {"topic": "Inorganic Compounds and Solutions", "q": "What are the characteristics of water?", "a": "It is an excellent solvent and suspension medium, participates in hydrolysis and dehydration synthesis reactions, and serves as a lubricant", "fact": "It is an excellent solvent and suspension medium, participates in hydrolysis and dehydration synthesis reactions, and serves as a lubricant."}, {"topic": "Inorganic Compounds and Solutions", "q": "What is the result of the many hydrogen bonds in water?", "a": "Water molecules are cohesive, causing high surface tension", "fact": "Because of its many hydrogen bonds, water molecules are cohesive, which causes a high surface tension."}, {"topic": "Inorganic Compounds and Solutions", "q": "Water has a high capacity for…", "a": "Water also has a high capacity for absorbing heat and a high heat of vaporization", "fact": "Water also has a high capacity for absorbing heat and a high heat of vaporization."}, {"topic": "Inorganic Compounds and Solutions", "q": "Inorganic acids, bases, and salts dissociate into what in water?", "a": "Inorganic acids, bases, and salts dissociate into ions in water", "fact": "Inorganic acids, bases, and salts dissociate into ions in water."}, {"topic": "Inorganic Compounds and Solutions", "q": "What do acids and bases ionize into?", "a": "Acids ionize into hydrogen ions (H+) and anions and is a proton donor; many bases ionize into cations and hydroxide ions (OH−) and all are proton acceptors", "fact": "An acid ionizes into hydrogen ions (H+) and anions and is a proton donor; many bases ionize into cations and hydroxide ions (OH−), and all are proton acceptors."}, {"topic": "Inorganic Compounds and Solutions", "q": "What does a salt ionizes into?", "a": "A salt ionizes into neither H+ nor OH−", "fact": "A salt ionizes into neither H+ nor OH−."}, {"topic": "Inorganic Compounds and Solutions", "q": "What is a mixture?", "a": "Mixtures are combinations of elements or compounds that are physically blended together but are not bound by chemical bonds", "fact": "Mixtures are combinations of elements or compounds that are physically blended together but are not bound by chemical bonds."}, {"topic": "Inorganic Compounds and Solutions", "q": "What are different types of mixtures?", "a": "Solutions, colloids, and suspensions", "fact": "Solutions, colloids, and suspensions are mixtures with different properties."}, {"topic": "Inorganic Compounds and Solutions", "q": "What are two ways to express the concentration of a solution?", "a": "percentage (mass per volume), expressed in grams per 100 mL of a solution, and molarity, expressed in moles per liter", "fact": "Two ways to express the concentration of a solution are percentage (mass per volume), expressed in grams per 100 mL of a solution, and molarity, expressed in moles per liter."}, {"topic": "Inorganic Compounds and Solutions", "q": "What is a mole (abbreviated mol)?", "a": "the amount in grams of any substance that has a mass equal to the combined atomic mass of all its atoms. Ex: 12 grams of C-12 is one mole", "fact": "A mole (abbreviated mol) is the amount in grams of any substance that has a mass equal to the combined atomic mass of all its atoms."}, {"topic": "Inorganic Compounds and Solutions", "q": "Molecular formula", "a": "Shows the type and nymber of atoms in a molecule, but not how they are arranged", "fact": "The pH of body fluids must remain fairly constant for the body to maintain homeostasis."}, {"topic": "Inorganic Compounds and Solutions", "q": "Neutral pH", "a": "7", "fact": "On the pH scale, 7 represents neutrality."}, {"topic": "Inorganic Compounds and Solutions", "q": "Acidic and Alkaline solutions have pH of what?", "a": "Values below 7 indicate acidic solutions, and values above 7 indicate alkaline solutions", "fact": "Values below 7 indicate acidic solutions, and values above 7 indicate alkaline solutions."}, {"topic": "Inorganic Compounds and Solutions", "q": "What is normal blood ph?", "a": "7.35-7.45", "fact": "Normal blood pH is 7.35–7.45."}, {"topic": "Inorganic Compounds and Solutions", "q": "What do buffers do?", "a": "Buffer systems remove or add protons (H+) to help maintain pH homeostasis", "fact": "Buffer systems remove or add protons (H+) to help maintain pH homeostasis."}, {"topic": "Inorganic Compounds and Solutions", "q": "Important buffer system", "a": "the carbonic acid and bicarbonate buffer system", "fact": "One important buffer system is the carbonic acid–bicarbonate buffer system."}, {"topic": "Inorganic Compounds and Solutions", "q": "Bicarbonate ion (HCO3−) and carbonic acid (H2CO3) function", "a": "The bicarbonate ion (HCO3−) acts as a weak base and removes excess H+, and carbonic acid (H2CO3) acts as a weak acid and adds H+", "fact": "The bicarbonate ion (HCO3−) acts as a weak base and removes excess H+, and carbonic acid (H2CO3) acts as a weak acid and adds H+."}, {"topic": "Overview of Organic Compounds", "q": "What is imporant about Carbon's 4 valence electrons?", "a": "Carbon, with its four valence electrons, bonds covalently with other carbon atoms to form large molecules of many different shapes", "fact": "Carbon, with its four valence electrons, bonds covalently with other carbon atoms to form large molecules of many different shapes."}, {"topic": "Overview of Organic Compounds", "q": "What are attached to the carbon skeletons of organic molecules?", "a": "hydrogen atoms (making a hydrocarbon), and functional groups (other atoms or molecules)", "fact": "Attached to the carbon skeletons of organic molecules are functional groups that confer distinctive chemical properties."}, {"topic": "Overview of Organic Compounds", "q": "What is dehydration synthesis?", "a": "when two smaller molecules join to form a larger molecule with a water molecule as a by product", "fact": "Small organic molecules are joined together to form larger molecules by dehydration synthesis reactions in which a molecule of water is removed."}, {"topic": "Overview of Organic Compounds", "q": "What is hydrolysis?", "a": "Breakdown of large molecules into smaller molecules by adding water molecules", "fact": "In the reverse process, called hydrolysis, large molecules are broken down into smaller ones by the addition of water."}, {"topic": "Carbohydrates", "q": "Carbohydrates include what?", "a": "Carbohydrates include monosaccharides, disaccharides, and polysaccharides", "fact": "Carbohydrates include monosaccharides, disaccharides, and polysaccharides."}, {"topic": "Carbohydrates", "q": "What provides most of the chemical energy needed to generate ATP?", "a": "Carbohydrates", "fact": "Carbohydrates provide most of the chemical energy needed to generate ATP."}, {"topic": "Lipids", "q": "Lipids include what?", "a": "Include fatty acids, triglycerides (fats and oils), phospholipids, steroids, and eicosanoids", "fact": "Lipids are a diverse group of compounds that include fatty acids, triglycerides (fats and oils), phospholipids, steroids, and eicosanoids."}, {"topic": "Lipids", "q": "What are fatty acids?", "a": "the simplest lipids; they are used to synthesize triglycerides and phospholipids", "fact": "Fatty acids are the simplest lipids; they are used to synthesize triglycerides and phospholipids."}, {"topic": "Lipids", "q": "What do triglycerides do”?", "a": "Triglycerides protect, insulate, and provide energy", "fact": "Triglycerides protect, insulate, and provide energy."}, {"topic": "Lipids", "q": "Phospholipids", "a": "They have a glycerol backbone and two fatty acid chains attached to the first carbons", "fact": "Phospholipids are important cell membrane components."}, {"topic": "Nucleic Acids", "q": "Steroid functions", "a": "Steroids are important in cell membrane structure, regulating sexual functions, maintaining normal blood sugar level, aiding lipid digestion and absorption, and helping bone growth", "fact": "Steroids are important in cell membrane structure, regulating sexual functions, maintaining normal blood sugar level, aiding lipid digestion and absorption, and helping bone growth."}, {"topic": "Nucleic Acids", "q": "What are deoxyribonucleic acid (dna) and ribonucleic acid (rna)?", "a": "nucleic acids consisting of nitrogenous bases, five-carbon (pentose) sugars, and phosphate groups", "fact": "Deoxyribonucleic acid (DNA) and ribonucleic acid (RNA) are nucleic acids consisting of nitrogenous bases, five-carbon (pentose) sugars, and phosphate groups."}, {"topic": "Nucleic Acids", "q": "Eicosanoids (prostaglandins and leukotrienes) do what?", "a": "Eicosanoids (prostaglandins and leukotrienes) modify hormone responses, contribute to inflammation, dilate airways, and regulate body temperature", "fact": "Eicosanoids (prostaglandins and leukotrienes) modify hormone responses, contribute to inflammation, dilate airways, and regulate body temperature."}, {"topic": "Nucleic Acids", "q": "DNA", "a": "DNA is a double helix and is the primary chemical in genes, forms the inherited genetic material inside each human cell", "fact": "DNA is a double helix and is the primary chemical in genes."}, ed by various decomposition reactions, particularly those of glucose", "fact": "ATP is synthesized from ADP and a phosphate group using the energy supplied by various decomposition reactions, particularly those of glucose."}, {"topic": "Class Slide Focus", "q": "Structural formula", "a": "Shows the types and number of atoms in a molecule and how those atoms are joined and arranged", "fact": "The class slide deck emphasizes atomic composition, chemical bonds, and chemical reactions."}, {"topic": "Class Slide Focus", "q": "Essential amino acid", "a": "An amino acid required for proper growth and tissue repair that the body cannot produce on its own, so it must come from the diet", "fact": "The class slide deck emphasizes inorganic compounds, solutions, pH, and buffers."}, {"topic": "Class Slide Focus", "q": "Saturated fatty acid", "a": "A fatty acid containing only single covalent bonds between its carbon atoms", "fact": "The class slide deck emphasizes carbohydrates, lipids, proteins, nucleic acids, and ATP."}, {"topic": "Class Slide Focus", "q": "Unstaturated fatty acid", "a": "A fatty acid containing one or more double covalet bonds between its carbon atoms", "fact": "The class slide deck emphasizes functional groups of organic molecules."}];let F=[...ALL],i=0;const KEY='ap_ch2_flash_status';let status=JSON.parse(localStorage.getItem(KEY)||'{}');
