const ALL=[{"topic": "The Concept of Immunity", "q": "What is the ability to ward off disease called?", "a": "immunity (resistance)", "fact": "The ability to ward off disease is called immunity (resistance)."}, {"topic": "The Concept of Immunity", "q": "What is lack of resistance called?", "a": "susceptibility", "fact": "Lack of resistance is called susceptibility."}, {"topic": "The Concept of Immunity", "q": "What are the two general types of immunity?", "a": "(a) innate and (b) adaptive", "fact": "The two general types of immunity are (a) innate and (b) adaptive."}, {"topic": "The Concept of Immunity", "q": "What does innate immunity refer to?", "a": "a wide variety of body responses to a wide range of pathogens", "fact": "Innate immunity refers to a wide variety of body responses to a wide range of pathogens."}, {"topic": "The Concept of Immunity", "q": "Which key fact applies to “Adaptive immunity involves activation of specific lymphocytes…”?", "a": "Adaptive immunity involves activation of specific lymphocytes to combat a particular foreign substance", "fact": "Adaptive immunity involves activation of specific lymphocytes to combat a particular foreign substance."}, {"topic": "Lymphoid System Structure and Function", "q": "What does the lymphoid system carries out immune responses and consist of?", "a": "lymph plasma, lymphatic vessels, and structures and organs that contain lymphoid tissue (specialized reticular tissue containing many lymphocytes)", "fact": "The lymphoid system carries out immune responses and consists of lymph plasma, lymphatic vessels, and structures and organs that contain lymphoid tissue (specialized reticular tissue containing many lymphocytes)."}, {"topic": "Lymphoid System Structure and Function", "q": "Which key fact applies to “The lymphoid system drains interstitial fluid, transports…”?", "a": "The lymphoid system drains interstitial fluid, transports dietary lipids, and protects against invasion through immune responses", "fact": "The lymphoid system drains interstitial fluid, transports dietary lipids, and protects against invasion through immune responses."}, {"topic": "Lymphatic Vessels and Lymph Circulation", "q": "Which key fact applies to “Lymphatic vessels begin as closed-ended lymphatic capillaries…”?", "a": "Lymphatic vessels begin as closed-ended lymphatic capillaries in tissue spaces between cells", "fact": "Lymphatic vessels begin as closed-ended lymphatic capillaries in tissue spaces between cells."}, {"topic": "Lymphatic Vessels and Lymph Circulation", "q": "Which key fact applies to “Interstitial fluid drains into lymphatic 888 The…”?", "a": "Interstitial fluid drains into lymphatic 888 The Lymphoid (Lymphatic) System and Immunity capillaries, thus forming lymph plasma", "fact": "Interstitial fluid drains into lymphatic 888 The Lymphoid (Lymphatic) System and Immunity capillaries, thus forming lymph plasma."}, {"topic": "Lymphatic Vessels and Lymph Circulation", "q": "Which key fact applies to “Lymphatic capillaries merge to form larger vessels…”?", "a": "Lymphatic capillaries merge to form larger vessels, called lymphatic vessels, which convey lymph plasma into and out of lymph nodes", "fact": "Lymphatic capillaries merge to form larger vessels, called lymphatic vessels, which convey lymph plasma into and out of lymph nodes."}, {"topic": "Lymphatic Vessels and Lymph Circulation", "q": "Which key fact applies to “Two major types of mature T cells…”?", "a": "Two major types of mature T cells exit the thymus: helper T cells (also known as CD4 T cells) and cytotoxic T cells (also referred to as CD8 T cells)", "fact": "Two major types of mature T cells exit the thymus: helper T cells (also known as CD4 T cells) and cytotoxic T cells (also referred to as CD8 T cells)."}, {"topic": "Lymphatic Vessels and Lymph Circulation", "q": "What is the route of lymph plasma flow?", "a": "from lymphatic capillaries to lymphatic vessels to lymph trunks to the thoracic duct and right lymphatic duct to the subclavian veins", "fact": "The route of lymph plasma flow is from lymphatic capillaries to lymphatic vessels to lymph trunks to the thoracic duct and right lymphatic duct to the subclavian veins."}, {"topic": "Lymphatic Vessels and Lymph Circulation", "q": "Which key fact applies to “There are two types of adaptive immunity…”?", "a": "There are two types of adaptive immunity: cell-mediated immunity and antibody-mediated immunity", "fact": "There are two types of adaptive immunity: cell-mediated immunity and antibody-mediated immunity."}, {"topic": "Lymphatic Vessels and Lymph Circulation", "q": "Which key fact applies to “In cell-mediated immune respon ses, cytotoxic T…”?", "a": "In cell-mediated immune respon ses, cytotoxic T cells directly attack invading antigens; in antibodymediated immune responses, B cells transform into plasmocytes that secrete antibodies", "fact": "In cell-mediated immune respon ses, cytotoxic T cells directly attack invading antigens; in antibodymediated immune responses, B cells transform into plasmocytes that secrete antibodies."}, {"topic": "Lymphatic Vessels and Lymph Circulation", "q": "Which key fact applies to “Lymph plasma flows because of skeletal muscle…”?", "a": "Lymph plasma flows because of skeletal muscle contractions and respiratory movements", "fact": "Lymph plasma flows because of skeletal muscle contractions and respiratory movements."}, {"topic": "Lymphatic Vessels and Lymph Circulation", "q": "Which key fact applies to “Valves in lymphatic vessels also aid flow…”?", "a": "Valves in lymphatic vessels also aid flow of lymph plasma", "fact": "Valves in lymphatic vessels also aid flow of lymph plasma."}, {"topic": "Lymphoid Organs and Tissues", "q": "What are the primary lymphoid organs?", "a": "red bone marrow and the thymus", "fact": "The primary lymphoid organs are red bone marrow and the thymus."}, {"topic": "Lymphoid Organs and Tissues", "q": "What are secondary lymphoid organs?", "a": "lymph nodes, the spleen, and lymphatic nodules", "fact": "Secondary lymphoid organs are lymph nodes, the spleen, and lymphatic nodules."}, {"topic": "Lymphoid Organs and Tissues", "q": "Which key fact applies to “The thymus lies between the sternum and…”?", "a": "The thymus lies between the sternum and the large blood vessels above the heart", "fact": "The thymus lies between the sternum and the large blood vessels above the heart."}, {"topic": "Lymphoid Organs and Tissues", "q": "Which key fact applies to “It is the site of T cell…”?", "a": "It is the site of T cell maturation", "fact": "It is the site of T cell maturation."}, {"topic": "Lymphoid Organs and Tissues", "q": "What are lymph nodes?", "a": "encapsulated, egg-shaped structures located along lymphatic vessels", "fact": "Lymph nodes are encapsulated, egg-shaped structures located along lymphatic vessels."}, {"topic": "Lymphoid Organs and Tissues", "q": "What is lymph plasma enters lymph nodes through afferent lymphatic vessels,?", "a": "filtered, and exits through efferent lymphatic vessels", "fact": "Lymph plasma enters lymph nodes through afferent lymphatic vessels, is filtered, and exits through efferent lymphatic vessels."}, {"topic": "Lymphoid Organs and Tissues", "q": "What are lymph nodes?", "a": "the site of proliferation of B cells and T cells", "fact": "Lymph nodes are the site of proliferation of B cells and T cells."}, {"topic": "Lymphoid Organs and Tissues", "q": "What is the spleen?", "a": "the largest single mass of lymphoid tissue in the body", "fact": "The spleen is the largest single mass of lymphoid tissue in the body."}, {"topic": "Lymphoid Organs and Tissues", "q": "Which key fact applies to “Within the spleen, B cells and T…”?", "a": "Within the spleen, B cells and T cells carry out immune functions and macrophages destroy blood-borne pathogens and worn-out red blood cells by phagocytosis", "fact": "Within the spleen, B cells and T cells carry out immune functions and macrophages destroy blood-borne pathogens and worn-out red blood cells by phagocytosis."}, {"topic": "Lymphoid Organs and Tissues", "q": "What are lymphoid nodules?", "a": "scattered throughout the mucosa of the digestive canal and respiratory, urinary, and genital tracts", "fact": "Lymphoid nodules are scattered throughout the mucosa of the digestive canal and respiratory, urinary, and genital tracts."}, {"topic": "Lymphoid Organs and Tissues", "q": "What is this lymphatic tissue?", "a": "termed mucosa-associated lymphoid tissue (MALT)", "fact": "This lymphatic tissue is termed mucosa-associated lymphoid tissue (MALT)."}, {"topic": "Development of Lymphoid Tissues", "q": "Which key fact applies to “Lymphatic vessels develop from lymph sacs, which…”?", "a": "Lymphatic vessels develop from lymph sacs, which arise from developing veins", "fact": "Lymphatic vessels develop from lymph sacs, which arise from developing veins."}, {"topic": "Development of Lymphoid Tissues", "q": "What are thus, they?", "a": "derived from mesoderm", "fact": "Thus, they are derived from mesoderm."}, {"topic": "Development of Lymphoid Tissues", "q": "Which key fact applies to “Lymph nodes develop from lymph sacs that…”?", "a": "Lymph nodes develop from lymph sacs that become invaded by mesenchymal cells", "fact": "Lymph nodes develop from lymph sacs that become invaded by mesenchymal cells."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “Innate immunity includes physical factors, chemical factors…”?", "a": "Innate immunity includes physical factors, chemical factors, antimicrobial proteins, natural killer cells, phagocytes, inflammation, and fever", "fact": "Innate immunity includes physical factors, chemical factors, antimicrobial proteins, natural killer cells, phagocytes, inflammation, and fever."}, {"topic": "Innate Immunity", "q": "What is clonal selection?", "a": "the process by which a lymphocyte proliferates and differentiates in response to a specific antigen", "fact": "Clonal selection is the process by which a lymphocyte proliferates and differentiates in response to a specific antigen."}, {"topic": "Innate Immunity", "q": "What is the result of clonal selection?", "a": "the formation of a clone of cells that can recognize the same specific antigen as the original lymphocyte", "fact": "The result of clonal selection is the formation of a clone of cells that can recognize the same specific antigen as the original lymphocyte."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “A lymphocyte that undergoes clonal selection gives…”?", "a": "A lymphocyte that undergoes clonal selection gives rise to two major types of cells in the clone: effector cells and memory cells", "fact": "A lymphocyte that undergoes clonal selection gives rise to two major types of cells in the clone: effector cells and memory cells."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “The effector cells of a lymphocyte clone…”?", "a": "The effector cells of a lymphocyte clone carry out immune responses that ultimately result in the destruction or inactivation of the antigen", "fact": "The effector cells of a lymphocyte clone carry out immune responses that ultimately result in the destruction or inactivation of the antigen."}, {"topic": "Innate Immunity", "q": "What are effector cells include active helper t cells, which?", "a": "part of a helper T cell clone; active cytotoxic T cells, which are part of a cytotoxic T cell clone; and plasmocytes, which are part of a B cell clone", "fact": "Effector cells include active helper T cells, which are part of a helper T cell clone; active cytotoxic T cells, which are part of a cytotoxic T cell clone; and plasmocytes, which are part of a B cell clone."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “The memory cells of a lymphocyte clone…”?", "a": "The memory cells of a lymphocyte clone do not actively participate in the initial immune response", "fact": "The memory cells of a lymphocyte clone do not actively participate in the initial immune response."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “However, if the antigen reappears in the…”?", "a": "However, if the antigen reappears in the body in the future, the memory cells can quickly respond to the antigen by proliferating and differentiating into more effector cells and more memory cells", "fact": "However, if the antigen reappears in the body in the future, the memory cells can quickly respond to the antigen by proliferating and differentiating into more effector cells and more memory cells."}, {"topic": "Innate Immunity", "q": "What are memory cells include memory helper t cells, which?", "a": "part of a helper T cell clone; memory cytotoxic T cells, which are part of a cytotoxic T cell clone; and memory B cells, which are part of a B cell clone", "fact": "Memory cells include memory helper T cells, which are part of a helper T cell clone; memory cytotoxic T cells, which are part of a cytotoxic T cell clone; and memory B cells, which are part of a B cell clone."}, {"topic": "Innate Immunity", "q": "What are antigens (ags)?", "a": "chemical substances that are recognized as foreign by the immune system", "fact": "Antigens (Ags) are chemical substances that are recognized as foreign by the immune system."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “Antigen receptors exhibit great diversity due to…”?", "a": "Antigen receptors exhibit great diversity due to genetic recombination", "fact": "Antigen receptors exhibit great diversity due to genetic recombination."}, {"topic": "Innate Immunity", "q": "What are “self-antigens” called major histocompatibility complex (mhc) antigens?", "a": "unique to each person’s body cells", "fact": "“Self-antigens” called major histocompatibility complex (MHC) antigens are unique to each person’s body cells."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “All cells except red blood cells display…”?", "a": "All cells except red blood cells display MHC-I molecules", "fact": "All cells except red blood cells display MHC-I molecules."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “Antigen-presenting cells (APCs) display MHC-II molecules…”?", "a": "Antigen-presenting cells (APCs) display MHC-II molecules", "fact": "Antigen-presenting cells (APCs) display MHC-II molecules."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “APCs include macrophages, B cells, and dendritic…”?", "a": "APCs include macrophages, B cells, and dendritic cells", "fact": "APCs include macrophages, B cells, and dendritic cells."}, {"topic": "Innate Immunity", "q": "What are exogenous antigens (formed outside body cells)?", "a": "presented with MHC-II molecules; endogenous antigens (formed inside body cells) are presented with MHC-I molecules", "fact": "Exogenous antigens (formed outside body cells) are presented with MHC-II molecules; endogenous antigens (formed inside body cells) are presented with MHC-I molecules."}, {"topic": "Innate Immunity", "q": "What are the skin and mucous membranes?", "a": "the first line of defense against entry of pathogens", "fact": "The skin and mucous membranes are the first line of defense against entry of pathogens."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “Cytokines are small protein hormones that may…”?", "a": "Cytokines are small protein hormones that may stimulate or inhibit many normal cell functions such as growth and differentiation", "fact": "Cytokines are small protein hormones that may stimulate or inhibit many normal cell functions such as growth and differentiation."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “Other cytokines regulate immune responses (see Table…”?", "a": "Other cytokines regulate immune responses (see Table 22.2)", "fact": "Other cytokines regulate immune responses (see Table 22.2)."}, {"topic": "Innate Immunity", "q": "Which key fact applies to “Antimicrobial substances include interferons, the complement system…”?", "a": "Antimicrobial substances include interferons, the complement system, iron-binding proteins, and antimicrobial proteins", "fact": "Antimicrobial substances include interferons, the complement system, iron-binding proteins, and antimicrobial proteins."}, {"topic": "Cell-Mediated Immunity", "q": "Which key fact applies to “Natural killer cells and phagocytes attack and…”?", "a": "Natural killer cells and phagocytes attack and kill pathogens and defective cells in the body", "fact": "Natural killer cells and phagocytes attack and kill pathogens and defective cells in the body."}, {"topic": "Cell-Mediated Immunity", "q": "Which key fact applies to “A cell-mediated immune response begins with activation…”?", "a": "A cell-mediated immune response begins with activation of a small number of T cells by a specific antigen", "fact": "A cell-mediated immune response begins with activation of a small number of T cells by a specific antigen."}, {"topic": "Cell-Mediated Immunity", "q": "Which key fact applies to “Inflammation aids disposal of microbes, toxins, or…”?", "a": "Inflammation aids disposal of microbes, toxins, or foreign material at the site of an injury, and prepares the site for tissue repair", "fact": "Inflammation aids disposal of microbes, toxins, or foreign material at the site of an injury, and prepares the site for tissue repair."}, {"topic": "Cell-Mediated Immunity", "q": "Which key fact applies to “During the activation process, T-cell receptors (TCRs)…”?", "a": "During the activation process, T-cell receptors (TCRs) recognize antigen fragments associated with MHC molecules on the surface of a body cell", "fact": "During the activation process, T-cell receptors (TCRs) recognize antigen fragments associated with MHC molecules on the surface of a body cell."}, {"topic": "Cell-Mediated Immunity", "q": "Which key fact applies to “Fever intensifies the antiviral effects of interferons…”?", "a": "Fever intensifies the antiviral effects of interferons, inhibits growth of some microbes, and speeds up body reactions that aid repair", "fact": "Fever intensifies the antiviral effects of interferons, inhibits growth of some microbes, and speeds up body reactions that aid repair."}, {"topic": "Cell-Mediated Immunity", "q": "Which key fact applies to “Table 22.1 summarizes the innate defenses…”?", "a": "Table 22.1 summarizes the innate defenses", "fact": "Table 22.1 summarizes the innate defenses."}, {"topic": "Adaptive Immunity", "q": "Which key fact applies to “Adaptive immunity involves lymphocytes called B cells…”?", "a": "Adaptive immunity involves lymphocytes called B cells and T cells", "fact": "Adaptive immunity involves lymphocytes called B cells and T cells."}, {"topic": "Adaptive Immunity", "q": "Which key fact applies to “B cells and T cells arise from…”?", "a": "B cells and T cells arise from stem cells in red bone marrow", "fact": "B cells and T cells arise from stem cells in red bone marrow."}, {"topic": "Adaptive Immunity", "q": "Which key fact applies to “B cells mature in red bone marrow…”?", "a": "B cells mature in red bone marrow; T cells mature in the thymus gland", "fact": "B cells mature in red bone marrow; T cells mature in the thymus gland."}, {"topic": "Adaptive Immunity", "q": "Which key fact applies to “Before B cells leave the red bone…”?", "a": "Before B cells leave the red bone marrow or T cells leave the thymus, they develop immunocompetence, the ability to carry out adaptive immune responses", "fact": "Before B cells leave the red bone marrow or T cells leave the thymus, they develop immunocompetence, the ability to carry out adaptive immune responses."}, {"topic": "Adaptive Immunity", "q": "Which key fact applies to “This process involves the insertion of antigen…”?", "a": "This process involves the insertion of antigen receptors into their plasma membranes", "fact": "This process involves the insertion of antigen receptors into their plasma membranes."}, {"topic": "Adaptive Immunity", "q": "What are antigen receptors?", "a": "molecules that are capable of recognizing specific antigens", "fact": "Antigen receptors are molecules that are capable of recognizing specific antigens."}, {"topic": "Adaptive Immunity", "q": "Which key fact applies to “Activation of T cells also requires costimulation…”?", "a": "Activation of T cells also requires costimulation, either by cytokines such as interleukin-2 or by pairs of plasma membrane molecules", "fact": "Activation of T cells also requires costimulation, either by cytokines such as interleukin-2 or by pairs of plasma membrane molecules."}, {"topic": "Adaptive Immunity", "q": "Which key fact applies to “Once a T cell has been activated…”?", "a": "Once a T cell has been activated, it undergoes clonal selection", "fact": "Once a T cell has been activated, it undergoes clonal selection."}, {"topic": "Adaptive Immunity", "q": "What is the result of clonal selection?", "a": "the formation of a clone of effector cells and memory cells", "fact": "The result of clonal selection is the formation of a clone of effector cells and memory cells."}, {"topic": "Adaptive Immunity", "q": "Which key fact applies to “The effector cells of a T cell…”?", "a": "The effector cells of a T cell clone carry out immune responses that ultimately result in elimination of the antigen", "fact": "The effector cells of a T cell clone carry out immune responses that ultimately result in elimination of the antigen."}, {"topic": "Adaptive Immunity", "q": "What does helper t cells display cd4 protein, recognize antigen fragments associated with mhc-ii molecules, and secrete?", "a": "several cytokines, most importantly interleukin-2, which acts as a costimulator for other helper T cells, cytotoxic T cells, and B cells", "fact": "Helper T cells display CD4 protein, recognize antigen fragments associated with MHC-II molecules, and secrete several cytokines, most importantly interleukin-2, which acts as a costimulator for other he
