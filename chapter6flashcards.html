aintenance."}, {"topic": "Histology of Bone Tissue", "q": "Which key fact applies to “Insulin-like growth factors (IGFs), growth hormone, thyroid…”?", "a": "Insulin-like growth factors (IGFs), growth hormone, thyroid hormones, and insulin stimulate bone growth", "fact": "Insulin-like growth factors (IGFs), growth hormone, thyroid hormones, and insulin stimulate bone growth."}, {"topic": "Histology of Bone Tissue", "q": "Which key fact applies to “Sex hormones slow resorption of old bone…”?", "a": "Sex hormones slow resorption of old bone and promote new bone deposition", "fact": "Sex hormones slow resorption of old bone and promote new bone deposition."}, {"topic": "Fracture and Repair of Bone", "q": "What is a fracture?", "a": "any break in a bone", "fact": "A fracture is any break in a bone."}, {"topic": "Fracture and Repair of Bone", "q": "Which key fact applies to “Types of fractures include closed, open, comminuted…”?", "a": "Types of fractures include closed, open, comminuted, greenstick, impacted, stress, Pott, Colles, and vertebral compression", "fact": "Types of fractures include closed, open, comminuted, greenstick, impacted, stress, Pott, Colles, and vertebral compression."}, {"topic": "Blood and Nerve Supply of Bone", "q": "Which key fact applies to “Fracture repair involves formation of a fracture…”?", "a": "Fracture repair involves formation of a fracture hematoma during the reactive phase, fibrous cartilage callus and bony callus formation during the reparative phase, and a bone remodeling phase", "fact": "Fracture repair involves formation of a fracture hematoma during the reactive phase, fibrous cartilage callus and bony callus formation during the reparative phase, and a bone remodeling phase."}, {"topic": "Blood and Nerve Supply of Bone", "q": "What are long bones?", "a": "supplied by periosteal, nutrient, metaphyseal, and epiphyseal arteries; veins accompany the arteries", "fact": "Long bones are supplied by periosteal, nutrient, metaphyseal, and
