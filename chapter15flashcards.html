function render(){if(!F.length){q.textContent='No cards found';a.textContent='';return}const c=F[i];t1.textContent=t2.textContent=c.topic;q.textContent=c.q;a.textContent=c.a;fc.classList.remove('flipped','known','review');if(status[id(c)])fc.classList.add(status[id(c)]);const k=Object.values(status).filter(x=>x==='known').length,r=Object.values(status).filter(x=>x==='review').length;stats.textContent=`Card ${i+1} of ${F.length} • ${k} known • ${r} needs review`}
function flip(){fc.classList.toggle('flipped')}function next(){if(F.length){i=(i+1)%F.length;fc.classList.remove('flipped');render()}}function prev(){if(F.length){i=(i-1+F.length)%F.length;fc.classList.remove('flipped');render()}}
function mark(v){if(F.length){status[id(F[i])]=v;save();render()}}function clearMark(){if(F.length){delete status[id(F[i])];save();render()}}
function shuffleCards(){for(let j=F.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[F[j],F[k]]=[F[k],F[j]]}i=0;render()}s.addEventListener('input',apply);cat.addEventListener('change',apply);render();
</script></body></html>
