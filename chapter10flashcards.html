const ALL=[{"topic": "Core Concepts", "q": "What are skeletal muscles?", "a": "well supplied with nerves and blood vessels", "fact": "Skeletal muscles are well supplied with nerves and blood vessels."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Generally, an artery and one or two…”?", "a": "Generally, an artery and one or two veins accompany each nerve that penetrates a skeletal muscle", "fact": "Generally, an artery and one or two veins accompany each nerve that penetrates a skeletal muscle."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Motion results from alternating contraction and relaxation…”?", "a": "Motion results from alternating contraction and relaxation of mus cles, which constitute 40–50% of total body weight", "fact": "Motion results from alternating contraction and relaxation of mus cles, which constitute 40–50% of total body weight."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Somatic motor neurons provide the nerve impulses…”?", "a": "Somatic motor neurons provide the nerve impulses that stimulate skeletal muscle to contract", "fact": "Somatic motor neurons provide the nerve impulses that stimulate skeletal muscle to contract."}, {"topic": "Core Concepts", "q": "What is the prime function of muscle?", "a": "changing chemical energy into mechanical energy to perform work", "fact": "The prime function of muscle is changing chemical energy into mechanical energy to perform work."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Blood capillaries bring in oxygen and nutrients…”?", "a": "Blood capillaries bring in oxygen and nutrients and remove heat and waste products of muscle metabolism", "fact": "Blood capillaries bring in oxygen and nutrients and remove heat and waste products of muscle metabolism."}, {"topic": "Overview of Muscular Tissue", "q": "What are the major cells of skeletal muscle tissue?", "a": "termed skeletal muscle fibers", "fact": "The major cells of skeletal muscle tissue are termed skeletal muscle fibers."}, {"topic": "Overview of Muscular Tissue", "q": "Which key fact applies to “Each muscle fiber has 100 or more…”?", "a": "Each muscle fiber has 100 or more nuclei because it arises from the fusion of many myoblasts", "fact": "Each muscle fiber has 100 or more nuclei because it arises from the fusion of many myoblasts."}, {"topic": "Overview of Muscular Tissue", "q": "What are satellite cells?", "a": "myoblasts that persist after birth", "fact": "Satellite cells are myoblasts that persist after birth."}, {"topic": "Overview of Muscular Tissue", "q": "What is the sarcolemma?", "a": "a muscle fiber’s plasma membrane; it surrounds the sarcoplasm", "fact": "The sarcolemma is a muscle fiber’s plasma membrane; it surrounds the sarcoplasm."}, {"topic": "Overview of Muscular Tissue", "q": "What are t tubules?", "a": "invaginations of the sarcolemma", "fact": "T tubules are invaginations of the sarcolemma."}, {"topic": "Overview of Muscular Tissue", "q": "What are the three types of muscular tissue?", "a": "skeletal, cardiac, and smooth", "fact": "The three types of muscular tissue are skeletal, cardiac, and smooth."}, {"topic": "Overview of Muscular Tissue", "q": "What is skeletal muscle tissue?", "a": "primarily attached to bones; it is stri ated and voluntary", "fact": "Skeletal muscle tissue is primarily attached to bones; it is stri ated and voluntary."}, {"topic": "Overview of Muscular Tissue", "q": "What is cardiac muscle tissue forms the wall of the heart; it?", "a": "striated and involuntary", "fact": "Cardiac muscle tissue forms the wall of the heart; it is striated and involuntary."}, {"topic": "Overview of Muscular Tissue", "q": "What is smooth muscle tissue?", "a": "located primar ily in internal organs; it is nonstriated (smooth) and involuntary", "fact": "Smooth muscle tissue is located primar ily in internal organs; it is nonstriated (smooth) and involuntary."}, {"topic": "Overview of Muscular Tissue", "q": "Which key fact applies to “Through contraction and relaxation, muscular tissue performs…”?", "a": "Through contraction and relaxation, muscular tissue performs four important functions, producing body movements, stabilizing body positions, moving substances within the body and regulating organ volume, and producing heat", "fact": "Through contraction and relaxation, muscular tissue performs four important functions, producing body movements, stabilizing body positions, moving substances within the body and regulating organ volume, and producing heat."}, {"topic": "Overview of Muscular Tissue", "q": "Which key fact applies to “Four special properties of muscular tissues are…”?", "a": "Four special properties of muscular tissues are (1) electrical excit ability, the property of responding to stimuli by producing action potentials; (2) contractility, the ability to generate tension to do work; (3) extensibility, the ability to be extended (stretched); and (4) elastic ity, the ability to return to original shape after contraction or extension", "fact": "Four special properties of muscular tissues are (1) electrical excit ability, the property of responding to stimuli by producing action potentials; (2) contractility, the ability to generate tension to do work; (3) extensibility, the ability to be extended (stretched); and (4) elastic ity, the ability to return to original shape after contraction or extension."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "Which key fact applies to “The subcutaneous tissue separates skin from muscles…”?", "a": "The subcutaneous tissue separates skin from muscles, provides a pathway for blood vessels and nerves to enter and exit muscles, and pro tects muscles from physical trauma", "fact": "The subcutaneous tissue separates skin from muscles, provides a pathway for blood vessels and nerves to enter and exit muscles, and pro tects muscles from physical trauma."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "Which key fact applies to “Fascia lines the body wall and limbs…”?", "a": "Fascia lines the body wall and limbs that surround and support muscles, allows free movement of muscles, carries nerves and blood vessels, and fills space between muscles", "fact": "Fascia lines the body wall and limbs that surround and support muscles, allows free movement of muscles, carries nerves and blood vessels, and fills space between muscles."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "What are connective tissues surrounding skeletal muscles?", "a": "epimysium, covering the entire muscle; perimysium, covering muscle fascicles; and endomysium, covering muscle fibers", "fact": "Connective tissues surrounding skeletal muscles are epimysium, covering the entire muscle; perimysium, covering muscle fascicles; and endomysium, covering muscle fibers."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "Which key fact applies to “Fascia covers all muscles of a region…”?", "a": "Fascia covers all muscles of a region and separates muscle from the skin", "fact": "Fascia covers all muscles of a region and separates muscle from the skin."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "What are tendons and aponeuro ses?", "a": "extensions of connective tissue within the muscle belly beyond the muscle fibers that attach muscle to bone or to other muscle", "fact": "Tendons and aponeuro ses are extensions of connective tissue within the muscle belly beyond the muscle fibers that attach muscle to bone or to other muscle."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "What are tendons and aponeuroses?", "a": "extensions of connective tissue beyond muscle fibers that attach the muscle to bone or to other muscle", "fact": "Tendons and aponeuroses are extensions of connective tissue beyond muscle fibers that attach the muscle to bone or to other muscle."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "What is a tendon?", "a": "generally ropelike in shape; an aponeurosis is wide and flat", "fact": "A tendon is generally ropelike in shape; an aponeurosis is wide and flat."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "What does each muscle fiber contain?", "a": "hundreds of myofibrils, the contractile elements of skeletal muscle", "fact": "Each muscle fiber contains hundreds of myofibrils, the contractile elements of skeletal muscle."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "Which key fact applies to “Sarcoplasmic reticulum surrounds each myofibril…”?", "a": "Sarcoplasmic reticulum surrounds each myofibril", "fact": "Sarcoplasmic reticulum surrounds each myofibril."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "What are within a myofibril?", "a": "thin and thick filaments, arranged in compartments called sarcomeres", "fact": "Within a myofibril are thin and thick filaments, arranged in compartments called sarcomeres."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "What does the overlapping of thick and thin filaments produce?", "a": "striations", "fact": "The overlapping of thick and thin filaments produces striations."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "Which key fact applies to “Darker A bands alternate with lighter I…”?", "a": "Darker A bands alternate with lighter I bands", "fact": "Darker A bands alternate with lighter I bands."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "Which key fact applies to “Table 10.1 summarizes the components of the…”?", "a": "Table 10.1 summarizes the components of the sarcomere", "fact": "Table 10.1 summarizes the components of the sarcomere."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "Which key fact applies to “Myofibrils are composed of three types of…”?", "a": "Myofibrils are composed of three types of proteins: contractile, regulatory, and structural", "fact": "Myofibrils are composed of three types of proteins: contractile, regulatory, and structural."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "What are the contractile proteins?", "a": "myosin (thick filament) and actin (thin filament)", "fact": "The contractile proteins are myosin (thick filament) and actin (thin filament)."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "What are regulatory proteins?", "a": "tropomy osin and troponin, both of which are part of the thin filament", "fact": "Regulatory proteins are tropomy osin and troponin, both of which are part of the thin filament."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "Which key fact applies to “Struc tural proteins include titin (links Z…”?", "a": "Struc tural proteins include titin (links Z disc to M line and stabilizes thick filament), myomesin (forms M line), nebulin (anchors thin filaments to Z discs and regulates length of thin filaments during development), and dystrophin (links thin filaments to sarcolemma)", "fact": "Struc tural proteins include titin (links Z disc to M line and stabilizes thick filament), myomesin (forms M line), nebulin (anchors thin filaments to Z discs and regulates length of thin filaments during development), and dystrophin (links thin filaments to sarcolemma)."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "Which key fact applies to “Table 10.2 sum marizes the different types…”?", "a": "Table 10.2 sum marizes the different types of skeletal muscle fiber proteins", "fact": "Table 10.2 sum marizes the different types of skeletal muscle fiber proteins."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "Which key fact applies to “Table 10.3 summarizes the levels of organization…”?", "a": "Table 10.3 summarizes the levels of organization within a skeletal muscle", "fact": "Table 10.3 summarizes the levels of organization within a skeletal muscle."}, {"topic": "Structure of Skeletal Muscle Tissue", "q": "What does projecting myosin heads contain?", "a": "actin-binding and ATP-binding sites and are the motor proteins that power muscle contraction", "fact": "Projecting myosin heads contain actin-binding and ATP-binding sites and are the motor proteins that power muscle contraction."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “Muscle contraction occurs because cross-bridges attach to…”?", "a": "Muscle contraction occurs because cross-bridges attach to and “walk” along the thin filaments at both ends of a sarcomere, progres sively pulling the thin filaments toward the center of a sarcomere", "fact": "Muscle contraction occurs because cross-bridges attach to and “walk” along the thin filaments at both ends of a sarcomere, progres sively pulling the thin filaments toward the center of a sarcomere."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “As the thin filaments slide inward, the…”?", "a": "As the thin filaments slide inward, the Z discs come closer together, and the sarcomere shortens", "fact": "As the thin filaments slide inward, the Z discs come closer together, and the sarcomere shortens."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “The contraction cycle is the repeating sequence…”?", "a": "The contraction cycle is the repeating sequence of events that causes sliding of the filaments: (1) Myosin ATPase hydrolyzes ATP and becomes energized; (2) the myosin head attaches to actin, forming a cross-bridge; (3) the cross-bridge generates force as it rotates toward the center of the sarcomere (power stroke); and (4) binding of ATP to the myosin head detaches it from actin", "fact": "The contraction cycle is the repeating sequence of events that causes sliding of the filaments: (1) Myosin ATPase hydrolyzes ATP and becomes energized; (2) the myosin head attaches to actin, forming a cross-bridge; (3) the cross-bridge generates force as it rotates toward the center of the sarcomere (power stroke); and (4) binding of ATP to the myosin head detaches it from actin."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “The myosin head again hydro lyzes the…”?", "a": "The myosin head again hydro lyzes the ATP, returns to its original position, and binds to a new site on actin as the cycle continues", "fact": "The myosin head again hydro lyzes the ATP, returns to its original position, and binds to a new site on actin as the cycle continues."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “An increase in Ca2+ concentration in the…”?", "a": "An increase in Ca2+ concentration in the sarcoplasm starts filament sliding; a decrease turns off the sliding process", "fact": "An increase in Ca2+ concentration in the sarcoplasm starts filament sliding; a decrease turns off the sliding process."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “The muscle action potential propagating into the…”?", "a": "The muscle action potential propagating into the T tubule system stimulates voltage-gated Ca2+ channels in the T tubule membrane", "fact": "The muscle action potential propagating into the T tubule system stimulates voltage-gated Ca2+ channels in the T tubule membrane."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “This causes opening of Ca2+ release channels…”?", "a": "This causes opening of Ca2+ release channels in the SR membrane", "fact": "This causes opening of Ca2+ release channels in the SR membrane."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “Cal cium ions diffuse from the SR…”?", "a": "Cal cium ions diffuse from the SR into the sarcoplasm and combine with troponin", "fact": "Cal cium ions diffuse from the SR into the sarcoplasm and combine with troponin."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “This binding causes tropomyosin to move away…”?", "a": "This binding causes tropomyosin to move away from the myosin-binding sites on actin", "fact": "This binding causes tropomyosin to move away from the myosin-binding sites on actin."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “Ca2+ active transport pumps continually remove Ca2+…”?", "a": "Ca2+ active transport pumps continually remove Ca2+ from the sar coplasm into the SR", "fact": "Ca2+ active transport pumps continually remove Ca2+ from the sar coplasm into the SR."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “When the concentration of calcium ions in…”?", "a": "When the concentration of calcium ions in the sarcoplasm decreases, tropomyosin slides back over and blocks the myosin-binding sites, and the muscle fiber relaxes", "fact": "When the concentration of calcium ions in the sarcoplasm decreases, tropomyosin slides back over and blocks the myosin-binding sites, and the muscle fiber relaxes."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "What is a muscle fiber develops its greatest tension when there?", "a": "an opti mal zone of overlap between thick and thin filaments", "fact": "A muscle fiber develops its greatest tension when there is an opti mal zone of overlap between thick and thin filaments."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "What is this depend ency?", "a": "the length–tension relationship", "fact": "This depend ency is the length–tension relationship."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "What is the neuromuscular junction?", "a": "the synapse between a somatic motor neuron and a skeletal muscle fiber", "fact": "The neuromuscular junction is the synapse between a somatic motor neuron and a skeletal muscle fiber."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “It includes the axon ter minals and…”?", "a": "It includes the axon ter minals and synaptic end bulbs of a motor neuron, plus the adjacent motor end plate of the muscle fiber sarcolemma", "fact": "It includes the axon ter minals and synaptic end bulbs of a motor neuron, plus the adjacent motor end plate of the muscle fiber sarcolemma."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “When a nerve impulse reaches the synaptic…”?", "a": "When a nerve impulse reaches the synaptic end bulbs of a somatic motor neuron, it triggers exocytosis of the synaptic vesicles, which releases acetylcholine (ACh)", "fact": "When a nerve impulse reaches the synaptic end bulbs of a somatic motor neuron, it triggers exocytosis of the synaptic vesicles, which releases acetylcholine (ACh)."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “ACh diffuses across the syn aptic cleft…”?", "a": "ACh diffuses across the syn aptic cleft and binds to ACh receptors, initiating a muscle action potential", "fact": "ACh diffuses across the syn aptic cleft and binds to ACh receptors, initiating a muscle action potential."}, {"topic": "Contraction and Relaxation of Skeletal Muscle Fibers", "q": "Which key fact applies to “Acetylcholinesterase then quickly breaks down ACh into…”?", "a": "Acetylcholinesterase then quickly breaks down ACh into its component parts", "fact": "Acetylcholinesterase then quickly breaks down ACh into its component parts."}, {"topic": "Muscle Metabolism", "q": "Which key fact applies to “Muscle fibers have three sources for ATP…”?", "a": "Muscle fibers have three sources for ATP production: creatine, anaerobic glycolysis, and aerobic respiration", "fact": "Muscle fibers have three sources for ATP production: creatine, anaerobic glycolysis, and aerobic respiration."}, {"topic": "Muscle Metabolism", "q": "Which key fact applies to “Creatine kinase catalyzes the transfer of a…”?", "a": "Creatine kinase catalyzes the transfer of a high-energy phosphate group from creatine phosphate to ADP to form new ATP molecules", "fact": "Creatine kinase catalyzes the transfer of a high-energy phosphate group from creatine phosphate to ADP to form new ATP molecules."}, {"topic": "Muscle Metabolism", "q": "Which key fact applies to “Together, creatine phosphate and ATP provide enough…”?", "a": "Together, creatine phosphate and ATP provide enough energy for mus cles to contract maximally for about 15 seconds", "fact": "Together, creatine phosphate and ATP provide enough energy for mus cles to contract maximally for about 15 seconds."}, {"topic": "Muscle Metabolism", "q": "Which key fact applies to “Glucose is converted to pyruvic acid in…”?", "a": "Glucose is converted to pyruvic acid in the reactions of glycolysis, which yield two ATPs without using oxygen", "fact": "Glucose is converted to pyruvic acid in the reactions of glycolysis, which yield two ATPs without using oxygen."}, {"topic": "Muscle Metabolism", "q": "Which key fact applies to “Anaerobic glycolysis can provide enough energy for…”?", "a": "Anaerobic glycolysis can provide enough energy for 2 minutes of maximal muscle activity", "fact": "Anaerobic glycolysis can provide enough energy for 2 minutes of maximal muscle activity."}, {"topic": "Muscle Metabolism", "q": "Which key fact applies to “Muscular activity that occurs over a prolonged…”?", "a": "Muscular activity that occurs over a prolonged time depends on aerobic respiration, mitochondrial reactions that require oxygen to produce ATP", "fact": "Muscular activity that occurs over a prolonged time depends on aerobic respiration, mitochondrial reactions that require oxygen to produce ATP."}, {"topic": "Muscle Metabolism", "q": "What is the inability of a muscle to contract forcefully after prolonged activity?", "a": "muscle fatigue", "fact": "The inability of a muscle to contract forcefully after prolonged activity is muscle fatigue."}, {"topic": "Muscle Metabolism", "q": "What is elevated oxygen use after exercise called?", "a": "recovery oxygen uptake", "fact": "Elevated oxygen use after exercise is called recovery oxygen uptake."}, {"topic": "Control of Muscle Tension", "q": "Which key fact applies to “A motor neuron and the muscle fibers…”?", "a": "A motor neuron and the muscle fibers it stimulates form a motor unit", "fact": "A motor neuron and the muscle fibers it stimulates form a motor unit."}, {"topic": "Control of Muscle Tension", "q": "What does a single motor unit may contain?", "a": "as few as 2 or as many as 3000 muscle fibers", "fact": "A single motor unit may contain as few as 2 or as many as 3000 muscle fibers."}, {"topic": "Control of Muscle Tension", "q": "Which key fact applies to “Recruitment is the process of increasing the…”?", "a": "Recruitment is the process of increasing the number of active motor units", "fact": "Recruitment is the process of increasing the number of active motor units."}, {"topic": "Control of Muscle Tension", "q": "What is a twitch contraction?", "a": "a brief contraction of all muscle fibers in a motor unit in response to a single action potential", "fact": "A twitch contraction is a brief contraction of all muscle fibers in a motor unit in response to a single action potential."}, {"topic": "Control of Muscle Tension", "q": "What is a record of a contraction called?", "a": "a myogram", "fact": "A record of a contraction is called a myogram."}, {"topic": "Control of Muscle Tension", "q": "Which key fact applies to “It consists of a latent period, a…”?", "a": "It consists of a latent period, a contraction period, and a relaxation period", "fact": "It consists of a latent period, a contraction period, and a relaxation period."}, {"topic": "Control of Muscle Tension", "q": "What is wave summation?", "a": "the increased strength of a contraction that occurs when a second stimulus arrives before the muscle fiber has relaxed completely following a previous stimulus", "fact": "Wave summation is the increased strength of a contraction that occurs when a second stimulus arrives before the muscle fiber has relaxed completely following a previous stimulus."}, {"topic": "Control of Muscle Tension", "q": "What does repeated stimuli can produce?", "a": "unfused (incomplete) tetanus, a sustained muscle contraction with partial relaxation between stimuli", "fact": "Repeated stimuli can produce unfused (incomplete) tetanus, a sustained muscle contraction with partial relaxation between stimuli."}, {"topic": "Control of Muscle Tension", "q": "What does more rapidly repeating stimuli produce?", "a": "fused (complete) tetanus, a sustained contraction without partial relaxation between stimuli", "fact": "More rapidly repeating stimuli produce fused (complete) tetanus, a sustained contraction without partial relaxation between stimuli."}, {"topic": "Control of Muscle Tension", "q": "What does continuous involuntary activation of a small number of motor units produce?", "a": "muscle tone, which is essential for maintaining posture", "fact": "Continuous involuntary activation of a small number of motor units produces muscle tone, which is essential for maintaining posture."}, {"topic": "Control of Muscle Tension", "q": "Which key fact applies to “In a concentric isotonic contraction, the muscle…”?", "a": "In a concentric isotonic contraction, the muscle shortens to pro duce movement and to reduce the angle at a joint", "fact": "In a concentric isotonic contraction, the muscle shortens to pro duce movement and to reduce the angle at a joint."}, {"topic": "Control of Muscle Tension", "q": "Which key fact applies to “During an eccentric isotonic contraction, the muscle…”?", "a": "During an eccentric isotonic contraction, the muscle lengthens", "fact": "During an eccentric isotonic contraction, the muscle lengthens."}, {"topic": "Control of Muscle Tension", "q": "What is isometric contractions, in which tension?", "a": "generated without a muscle changing its length
