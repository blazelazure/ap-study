egulate blood flow through capillaries…”?", "a": "Precapillary sphincters regulate blood flow through capillaries", "fact": "Precapillary sphincters regulate blood flow through capillaries."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Baroreceptors monitor blood pressure, and chemoreceptors monitor…”?", "a": "Baroreceptors monitor blood pressure, and chemoreceptors monitor blood levels of O2, CO2, and hydrogen ions", "fact": "Baroreceptors monitor blood pressure, and chemoreceptors monitor blood levels of O2, CO2, and hydrogen ions."}, {"topic": "Core Concepts", "q": "Which key fact applies to “The carotid sinus reflex helps regulate blood…”?", "a": "The carotid sinus reflex helps regulate blood pressure in the brain", "fact": "The carotid sinus reflex helps regulate blood pressure in the brain."}, {"topic": "Core Concepts", "q": "Which key fact applies to “The aortic reflex regulates general systemic blood…”?", "a": "The aortic reflex regulates general systemic blood pressure", "fact": "The aortic reflex regulates general systemic blood pressure."}, {"topic": "Core Concepts", "q": "What are microscopic blood vessels in the liver called?", "a": "sinusoids", "fact": "Microscopic blood vessels in the liver are called sinusoids."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Venules are small vessels that continue from…”?", "a": "Venules are small vessels that continue from capillaries and merge to form veins", "fact": "Venules are small vessels that continue from capillaries and merge to form veins."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Veins consist of the same three tunics…”?", "a": "Veins consist of the same three tunics as arteries but have a thinner tunica intima and a thinner tunica media", "fact": "Veins consist of the same three tunics as arteries but have a thinner tunica intima and a thinner tunica media."}, {"topic": "Core Concepts", "q": "What is the lumen of a vein?", "a": "also larger than that of a comparable artery", "fact": "The lumen of a vein is also larger than that of a comparable artery."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Veins contain valves to prevent backflow of…”?", "a": "Veins contain valves to prevent backflow of blood", "fact": "Veins contain valves to prevent backflow of blood."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Weak valves can lead to varicose veins…”?", "a": "Weak valves can lead to varicose veins", "fact": "Weak valves can lead to varicose veins."}, {"topic": "Core Concepts", "q": "What are vascular sinuses?", "a": "veins with very thin walls", "fact": "Vascular sinuses are veins with very thin walls."}, {"topic": "Core Concepts", "q": "What are systemic veins?", "a": "collectively called blood reservoirs because they hold a large volume of blood", "fact": "Systemic veins are collectively called blood reservoirs because they hold a large volume of blood."}, {"topic": "Core Concepts", "q": "Which key fact applies to “If the need arises, this blood can…”?", "a": "If the need arises, this blood can be shifted into other blood vessels through vasoconstriction of veins", "fact": "If the need arises, this blood can be shifted into other blood vessels through vasoconstriction of veins."}, {"topic": "Core Concepts", "q": "What are the principal blood reservoirs?", "a": "the veins of the abdominal organs (liver and spleen) and skin", "fact": "The principal blood reservoirs are the veins of the abdominal organs (liver and spleen) and skin."}, {"topic": "Capillary Exchange", "q": "Which key fact applies to “Substances enter and leave capillaries by diffusion…”?", "a": "Substances enter and leave capillaries by diffusion, transcytosis, or bulk flow", "fact": "Substances enter and leave capillaries by diffusion, transcytosis, or bulk flow."}, {"topic": "Capillary Exchange", "q": "Which key fact applies to “The movement of water and solutes (except…”?", "a": "The movement of water and solutes (except proteins) through capillary walls depends on hydrostatic and osmotic pressures", "fact": "The movement of water and solutes (except proteins) through capillary walls depends on hydrostatic and osmotic pressures."}, {"topic": "Capillary Exchange", "q": "What is the near equilibrium between filtration and reabsorption in capillaries called?", "a": "Starling’s law of the capillaries", "fact": "The near equilibrium between filtration and reabsorption in capillaries is called Starling’s law of the capillaries."}, {"topic": "Capillary Exchange", "q": "Which key fact applies to “Edema is an abnormal increase in interstitial…”?", "a": "Edema is an abnormal increase in interstitial fluid", "fact": "Edema is an abnormal increase in interstitial fluid."}, {"topic": "Hemodynamics: Factors Affecting Blood Flow", "q": "What is the velocity of blood flow?", "a": "inversely related to the cross-sectional area of blood vessels; blood flows slowest where cross-sectional area is greatest", "fact": "The velocity of blood flow is inversely related to the cross-sectional area of blood vessels; blood flows slowest where cross-sectional area is greatest."}, {"topic": "Hemodynamics: Factors Affecting Blood Flow", "q": "Which key fact applies to “The velocity of blood flow decreases from…”?", "a": "The velocity of blood flow decreases from the aorta to arteries to capillaries and increases in venules and veins", "fact": "The velocity of blood flow decreases from the aorta to arteries to capillaries and increases in venules and veins."}, {"topic": "Hemodynamics: Factors Affecting Blood Flow", "q": "Which key fact applies to “Blood pressure and resistance determine blood flow…”?", "a": "Blood pressure and resistance determine blood flow", "fact": "Blood pressure and resistance determine blood flow."}, {"topic": "Hemodynamics: Factors Affecting Blood Flow", "q": "Which key fact applies to “Blood flows from regions of higher to…”?", "a": "Blood flows from regions of higher to lower pressure" sting pulse and heart rate?", "a": "70–80 beats/min", "fact": "A normal resting pulse and heart rate is 70–80 beats/min."}, {"topic": "Checking Circulation", "q": "What is blood pressure?", "a": "the pressure exerted by blood on the wall of an artery when the left ventricle undergoes systole and then diastole", "fact": "Blood pressure is the pressure exerted by blood on the wall of an artery when the left ventricle undergoes systole and then diastole."}, {"topic": "Checking Circulation", "q": "Which key fact applies to “It is measured by the use of…”?", "a": "It is measured by the use of a sphygmomanometer", "fact": "It is measured by the use of a sphygmomanometer."}, {"topic": "Checking Circulation", "q": "What is systolic blood pressure?", "a": "the arterial blood pressure during ventricular contraction", "fact": "Systolic blood pressure is the arterial blood pressure during ventricular contraction."}, {"topic": "Checking Circulation", "q": "What is diastolic blood pressure?", "a": "the arterial blood pressure during ventricular relaxation", "fact": "Diastolic blood pressure is the arterial blood pressure during ventricular relaxation."}, {"topic": "Checking Circulation", "q": "What is normal blood pressure?", "a": "less than 120/80", "fact": "Normal blood pressure is less than 120/80."}, {"topic": "Checking Circulation", "q": "What is pulse pressure?", "a": "the difference between systolic and diastolic blood pressure", "fact": "Pulse pressure is the difference between systolic and diastolic blood pressure."}, {"topic": "Checking Circulation", "q": "What is it normally?", "a": "about 40 mmHg", "fact": "It normally is about 40 mmHg."}, {"topic": "Shock and Homeostasis", "q": "Which key fact applies to “Shock is a failure of the cardiovascular…”?", "a": "Shock is a failure of the cardiovascular system to deliver enough O2 and nutrients to meet the metabolic needs of cells", "fact": "Shock is a failure of the cardiovascular system to deliver enough O2 and nutrients to meet the metabolic needs of cells."}, {"topic": "Shock and Homeostasis", "q": "Which key fact applies to “Types of shock include hypovolemic, cardiogenic, vascular…”?", "a": "Types of shock include hypovolemic, cardiogenic, vascular, and obstructive", "fact": "Types of shock include hypovolemic, cardiogenic, vascular, and obstructive."}, {"topic": "Shock and Homeostasis", "q": "What is blood pressure?", "a": "the pressure exerted on the walls of a blood vessel", "fact": "Blood pressure is the pressure exerted on the walls of a blood vessel."}, {"topic": "Shock and Homeostasis", "q": "Which key fact applies to “Signs and symptoms of shock include systolic…”?", "a": "Signs and symptoms of shock include systolic blood pressure less than 90 mmHg; rapid resting heart rate; weak, rapid pulse; clammy, cool, pale skin; sweating; hypotension; altered mental state; decreased urinary output; thirst; and acidosis", "fact": "Signs and symptoms of shock include systolic blood pressure less than 90 mmHg; rapid resting heart rate; weak, rapid pulse; clammy, cool, pale skin; sweating; hypotension; altered mental state; decreased urinary output; thirst; and acidosis."}, {"topic": "Shock and Homeostasis", "q": "What are factors that affect blood pressure?", "a": "cardiac output, blood volume, viscosity, resistance, and the elasticity of arteries", "fact": "Factors that affect blood pressure are cardiac output, blood volume, viscosity, resistance, and the elasticity of arteries."}, {"topic": "Circulatory Routes: Systemic Circulation", "q": "Which key fact applies to “Cardiac output equals the mean arterial pressure…”?", "a": "Cardiac output equals the mean arterial pressure divided by total resistance (CO = MAP ÷ R)", "fact": "Cardiac output equals the mean arterial pressure divided by total resistance (CO = MAP ÷ R)."}, {"topic": "Circulatory Routes: Systemic Circulation", "q": "Which key fact applies to “As blood leaves the aorta and flows…”?", "a": "As blood leaves the aorta and r center receives input from higher brain regions and sensory receptors (baroreceptors and chemoreceptors)", "fact": "The cardiovascular center receives input from higher brain regions and sensory receptors (baroreceptors and chemoreceptors)."}, {"topic": "Control of Blood Pressure and Blood Flow", "q": "Which key fact applies to “The systemic circulation carries oxygenated blood from…”?", "a": "The systemic circulation carries oxygenated blood from the left ventricle through the aorta to all parts of the body, including some lung tissue, but not the pulmonary alveoli of the lungs, and returns the deoxygenated blood to the right atrium", "fact": "The systemic circulation carries oxygenated blood from the left ventricle through the aorta to all parts of the body, including some lung tissue, but not the pulmonary alveoli of the lungs, and returns the deoxygenated blood to the right atrium."}, {"topic": "Control of Blood Pressure and Blood Flow", "q": "What are among the subdivisions of the systemic circulation?", "a": "the coronary circulation and the hepatic portal circulation", "fact": "Among the subdivisions of the systemic circulation are the coronary circulation and the hepatic portal circulation."}, {"topic": "The Aorta and Its Branches", "q": "What is the aorta?", "a": "divided into the ascending aorta, aortic arch, thoracic aorta, and abdominal aorta", "fact": "The aorta is divided into the ascending aorta, aortic arch, thoracic aorta, and abdominal aorta."}, {"topic": "The Aorta and Its Branches", "q": "Which key fact applies to “Each section gives off arteries that branch…”?", "a": "Each section gives off arteries that branch to supply the whole body", "fact": "Each section gives off arteries that branch to supply the whole body."}, {"topic": "Ascending Aorta", "q": "What is the ascending aorta?", "a": "the part of the aorta that extends from the aortic valve of the heart to the aortic arch", "fact": "The ascending aorta is the part of the aorta that extends from the aortic valve of the heart to the aortic arch."}, {"topic": "Ascending Aorta", "q": "What are the two branches of the ascending aorta?", "a": "the right and left coronary arteries", "fact": "The two branches of the ascending aorta are the right and left coronary arteries."}, {"topic": "Ascending Aorta", "q": "Which key fact applies to “844 The Cardiovascular System: Blood Vessels and…”?", "a": "844 The Cardiovascular System: Blood Vessels and Hemodynamics", "fact": "844 The Cardiovascular System: Blood Vessels and Hemodynamics"}, {"topic": "Veins of the Lower Limbs", "q": "What is the aortic arch?", "a": "the continuation of the ascending aorta", "fact": "The aortic arch is the continuation of the ascending aorta."}, {"topic": "Veins of the Lower Limbs", "q": "What is blood from the lower limbs?", "a": "drained by both superficial and deep veins", "fact": "Blood from the lower limbs is drained by both superficial and deep veins."}, {"topic": "Veins of the Lower Limbs", "q": "What are the three branches of the aortic arch in order of origination?", "a": "the brachiocephalic trunk, left common carotid artery, and left subclavian artery", "fact": "The three branches of the aortic arch in order of origination are the brachiocephalic trunk, left common carotid artery, and left subclavian artery."}, {"topic": "Veins of the Lower Limbs", "q": "Which key fact applies to “The superficial veins often anastomose with one…”?", "a": "The superficial veins often anastomose with one another and with deep veins along their length", "fact": "The superficial veins often anastomose with one another and with deep veins along their length."}, {"topic": "Circulatory Routes: The Hepatic Circulation", "q": "What is the thoracic aorta?", "a": "the continuation of the aortic arch", "fact": "The thoracic aorta is the continuation of the aortic arch."}, {"topic": "Circulatory Routes: The Hepatic Circulation", "q": "Which key fact applies to “The hepatic portal circulation directs venous blood…”?", "a": "The hepatic portal circulation directs venous blood from the digestive canal organs and spleen into the hepatic portal veins of the liver before it returns to the heart", "fact": "The hepatic portal circulation directs venous blood from the digestive canal organs and spleen into the hepatic portal veins of the liver before it returns to the heart."}, {"topic": "Circulatory Routes: The Hepatic Circulation", "q": "Which key fact applies to “It sends off visceral branches and parietal…”?", "a": "It sends off visceral branches and parietal branches", "fact": "It sends off visceral branches and parietal branches."}, {"topic": "Abdominal Aorta", "q": "What is the abdominal aorta?", "a": "the continuation of the thoracic aorta", "fact": "The abdominal aorta is the continuation of the thoracic aorta."}, {"topic": "Abdominal Aorta", "q": "Which key fact applies to “It enables the liver to utilize nutrients…”?", "a": "It enables the liver to utilize nutrients and detoxify harmful substances in the blood", "fact": "It enables the liver to utilize nutrients and detoxify harmful substances in the blood."}, {"topic": "Abdominal Aorta", "q": "Which key fact applies to “It gives rise to unpaired visceral branches…”?", "a": "It gives rise to unpaired visceral branches and paired visceral branches", "fact": "It gives rise to unpaired visceral branches and paired visceral branches."}, {"topic": "Arteries of the Pelvis and Lower Limbs", "q": "Which key fact applies to “The pulmonary circulations takes deoxygenated blood from…”?", "a": "The pulmonary circulations takes deoxygenated blood from the right ventricle to the pulmonary alveoli within the lungs and returns oxygenated blood from the pulmonary alveoli to the left atrium", "fact": "The pulmonary circulations takes deoxygenated blood from the right ventricle to the pulmonary alveoli within the lungs and returns oxygenated blood from the pulmonary alveoli to the left atrium."}, {"topic": "Arteries of the Pelvis a
