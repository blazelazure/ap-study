ents are collectively known as anabolism", "fact": "Chemical reactions that combine simple molecules into more complex ones that form the body’s structural and functional components are collectively known as anabolism."}, {"topic": "Metabolic Reactions", "q": "What are overall, anabolic reactions?", "a": "endergonic; they consume more energy than they produce", "fact": "Overall, anabolic reactions are endergonic; they consume more energy than they produce."}, {"topic": "Metabolic Reactions", "q": "Which key fact applies to “The coupling of anabolism and catabolism occurs…”?", "a": "The coupling of anabolism and catabolism occurs via ATP", "fact": "The coupling of anabolism and catabolism occurs via ATP."}, {"topic": "Energy Transfer", "q": "Which key fact applies to “Oxidation is the removal of electrons from…”?", "a": "Oxidation is the removal of electrons from a substance; reduction is theaddition of electrons to a substance", "fact": "Oxidation is the removal of electrons from a substance; reduction is theaddition of electrons to a substance."}, {"topic": "Energy Transfer", "q": "What are two coenzymes that carry hydrogen atoms during coupled oxidation–reduction reactions?", "a": "nicotinamide adenine dinucleotide (NAD) and flavin adenine dinucleotide (FAD)", "fact": "Two coenzymes that carry hydrogen atoms during coupled oxidation–reduction reactions are nicotinamide adenine dinucleotide (NAD) and flavin adenine dinucleotide (FAD)."}, {"topic": "Energy Transfer", "q": "Which key fact applies to “ATP can be generated via substrate-level phosphorylation…”?", "a": "ATP can be generated via substrate-level phosphorylation, oxidative phosphorylation, and photophosphorylation", "fact": "ATP can be generated via substrate-level phosphorylation, oxidative phosphorylation, and photophosphorylation."}, {"topic": "Carbohydrate Metabolism", "q": "What are during digestion, polysaccharides and disaccharides?", "a": "hydrolyzed into the monosaccharides glucose (about 80%), fructose, and galactose; the latter two are then converted to glucose", "fact": "During digestion, polysaccharides and disaccharides are hydrolyzed into the monosaccharides glucose (about 80%), fructose, and galactose; the latter two are then converted to glucose."}, {"topic": "Carbohydrate Metabolism", "q": "What is some glucose?", "a": "oxidized by cells to provide ATP", "fact": "Some glucose is oxidized by cells to provide ATP."}, {"topic": "Carbohydrate Metabolism", "q": "Which key fact applies to “Glucose also can be used to synthesize…”?", "a": "Glucose also can be used to synthesize amino acids, glycogen, and triglycerides", "fact": "Glucose also can be used to synthesize amino acids, glycogen, and triglycerides."}, {"topic": "Carbohydrate Metabolism", "q": "Which key fact applies to “Glucose moves into most body cells via…”?", "a": "Glucose moves into most body cells via facilitated diffusion through glucose transporters (GluT) and becomes phosphorylated to glucose 6-phosphate", "fact": "Glucose moves into most body cells via facilitated diffusion through glucose transporters (GluT) and becomes phosphorylated to glucose 6-phosphate."}, {"topic": "Carbohydrate Metabolism", "q": "What is in muscle cells, this process?", "a": "stimulated by insulin", "fact": "In muscle cells, this process is stimulated by insulin."}, {"topic": "Carbohydrate Metabolism", "q": "What is glucose entry into neurons and hepatocytes?", "a": "always “turned on", "fact": "Glucose entry into neurons and hepatocytes is always “turned on.”"}, {"topic": "Carbohydrate Metabolism", "q": "Which key fact applies to “Cellular respiration, the complete oxidation of glucose…”?", "a": "Cellular respiration, the complete oxidation of glucose to CO2 and H2O, involves glycolysis, the Krebs cycle, and the electron transport chain", "fact": "Cellular respiration, the complete oxidation of glucose to CO2 and H2O, involves glycolysis, the Krebs cycle, and the electron transport chain."}, {"topic": "Carbohydrate Metabolism", "q": "Which key fact applies to “Glycolysis is the breakdown of glucose into…”?", "a": "Glycolysis is the breakdown of glucose into two molecules of pyruvic acid; there is a net production of two molecules of ATP", "fact": "Glycolysis is the breakdown of glucose into two molecules of pyruvic acid; there is a net production of two molecules of ATP."}, {"topic": "Carbohydrate Metabolism", "q": "What is when oxygen?", "a": "in short supply, pyruvic acid is reduced to lactic acid; under aerobic conditions, pyruvic acid enters the Krebs cycle", "fact": "When oxygen is in short supply, pyruvic acid is reduced to lactic acid; under aerobic conditions, pyruvic acid enters the Krebs cycle."}, {"topic": "Carbohydrate Metabolism", "q": "What is pyruvic acid?", "a": "prepared for entrance into the Krebs cycle by conversion to a 2-carbon acetyl group followed by the addition of coenzyme A to form acetyl coenzyme A", "fact": "Pyruvic acid is prepared for entrance into the Krebs cycle by conversion to a 2-carbon acetyl group followed by the addition of coenzyme A to form acetyl coenzyme A."}, {"topic": "Carbohydrate Metabolism", "q": "Which key fact applies to “The Krebs cycle involves decarboxylations, oxidations, and…”?", "a": "The Krebs cycle involves decarboxylations, oxidations, and reductions of various organic acids", "fact": "The Krebs cycle involves decarboxylations, oxidations, and reductions of various organic acids."}, {"topic": "Carbohydrate Metabolism", "q": "What is each molecule of pyruvic acid that?", "a": "converted to acetyl coenzyme A and then enters the Krebs cycle produces three molecules of CO2, four molecules of NADH C6 H12O6 + 6 O2 + 30 or 32 ADPs + 30 or 32 P \b 6 CO2 + 6 H2O + 30 or 32 ATPs", "fact": "Each molecule of pyruvic acid that is converted to acetyl coenzyme A and then enters the Krebs cycle produces three molecules of CO2, four molecules of NADH C6 H12O6 + 6 O2 + 30 or 32 ADPs + 30 or 32 P \b 6 CO2 + 6 H2O + 30 or 32 ATPs"}, { ine, cortisol, thyroid hormones, and insulinlike growth factors", "fact": "In lipolysis, triglycerides are split into fatty acids and glycerol and released from adipose tissue under the influence of epinephrine, norepinephrine, cortisol, thyroid hormones, and insulinlike growth factors."}, {"topic": "Lipid Metabolism", "q": "Which key fact applies to “Glycerol can be converted into glucose by…”?", "a": "Glycerol can be converted into glucose by conversion into glyceraldehyde 3-phosphate", "fact": "Glycerol can be converted into glucose by conversion into glyceraldehyde 3-phosphate."}, {"topic": "Lipid Metabolism", "q": "What are in beta oxidation of fatty acids, carbon atoms?", "a": "removed in pairs from fatty acid chains; the resulting molecules of acetyl coenzyme A enter the Krebs cycle", "fact": "In beta oxidation of fatty acids, carbon atoms are removed in pairs from fatty acid chains; the resulting molecules of acetyl coenzyme A enter the Krebs cycle."}, {"topic": "Lipid Metabolism", "q": "What is the conversion of glucose or amino acids into lipids called?", "a": "lipogenesis; it is stimulated by insulin", "fact": "The conversion of glucose or amino acids into lipids is called lipogenesis; it is stimulated by insulin."}, {"topic": "Protein Metabolism", "q": "What are during digestion, proteins?", "a": "hydrolyzed into amino acids, which enter the liver via the hepatic portal vein", "fact": "During digestion, proteins are hydrolyzed into amino acids, which enter the liver via the hepatic portal vein."}, {"topic": "Protein Metabolism", "q": "Which key fact applies to “1040 C hapter 25 Metabolism and Nutrition…”?", "a": "1040 C hapter 25 Metabolism and Nutrition", "fact": "1040 C hapter 25 Metabolism and Nutrition"}, {"topic": "Protein Metabolism", "q": "Which key fact applies to “Amino acids, under the influence of insulinlike…”?", "a": "Amino acids, under the influence of insulinlike growth factors and insulin, enter body cells via active transport", "fact": "Amino acids, under the influence of insulinlike growth factors and insulin, enter body cells via active transport."}, {"topic": "Protein Metabolism", "q": "What are inside cells, amino acids?", "a": "synthesized into proteins that function as enzymes, hormones, structural elements, and so forth; are stored as fat or glycogen; or are used for energy", "fact": "Inside cells, amino acids are synthesized into proteins that function as enzymes, hormones, structural elements, and so forth; are stored as fat or glycogen; or are used for energy."}, {"topic": "Protein Metabolism", "q": "Which key fact applies to “Before amino acids can be catabolized, they…”?", "a": "Before amino acids can be catabolized, they must be deaminated and converted to substances that can enter the Krebs cycle", "fact": "Before amino acids can be catabolized, they must be deaminated and converted to substances that can enter the Krebs cycle."}, {"topic": "Protein Metabolism", "q": "Which key fact applies to “Amino acids may also be converted into…”?", "a": "Amino acids may also be converted into glucose, fatty acids, and ketone bodies", "fact": "Amino acids may also be converted into glucose, fatty acids, and ketone bodies."}, {"topic": "Protein Metabolism", "q": "What is protein synthesis?", "a": "stimulated by insulinlike growth factors, thyroid hormones, insulin, estrogens, and testosterone", "fact": "Protein synthesis is stimulated by insulinlike growth factors, thyroid hormones, insulin, estrogens, and testosterone."}, {"topic": "Protein Metabolism", "q": "Which key fact applies to “Table 25.2 summarizes carbohydrate, lipid, and protein…”?", "a": "Table 25.2 summarizes carbohydrate, lipid, and protein metabolism", "fact": "Table 25.2 summarizes carbohydrate, lipid, and protein metabolism."}, {"topic": "Key Molecules at Metabolic Crossroads", "q": "Which key fact applies to “Three molecules play a key role in…”?", "a": "Three molecules play a key role in metabolism: glucose 6-phosphate, pyruvic acid, and acetyl coenzyme A", "fact": "Three molecules play a key role in metabolism: glucose 6-phosphate, pyruvic acid, and acetyl coenzyme A."}, {"topic": "Key Molecules at Metabolic Crossroads", "q": "Which key fact applies to “Glucose 6-phosphate may be converted to glucose…”?", "a": "Glucose 6-phosphate may be converted to glucose, glycogen, ribose 5-phosphate, and pyruvic acid", "fact": "Glucose 6-phosphate may be converted to glucose, glycogen, ribose 5-phosphate, and pyruvic acid."}, {"topic": "Key Molecules at Metabolic Crossroads", "q": "What is when atp?", "a": "low and oxygen is plentiful, pyruvic acid is converted to acetyl coenzyme A; when oxygen supply is low, pyruvic acid is converted to lactic acid", "fact": "When ATP is low and oxygen is plentiful, pyruvic acid is converted to acetyl coenzyme A; when oxygen supply is low, pyruvic acid is converted to lactic acid."}, {"topic": "Key Molecules at Metabolic Crossroads", "q": "What are carbohydrate and protein metabolism?", "a": "linked by pyruvic acid", "fact": "Carbohydrate and protein metabolism are linked by pyruvic acid."}, {"topic": "Key Molecules at Metabolic Crossroads", "q": "What is acetyl coenzyme a?", "a": "the molecule that enters the Krebs cycle; it is also used to synthesize fatty acids, ketone bodies, and cholesterol", "fact": "Acetyl coenzyme A is the molecule that enters the Krebs cycle; it is also used to synthesize fatty acids, ketone bodies, and cholesterol."}, {"topic": "Metabolic Adaptations", "q": "Which key fact applies to “During the absorptive state, ingested nutrients enter…”?", "a": "During the absorptive state, ingested nutrients enter the blood and lymph from the digestive canal", "fact": "During the absorptive state, ingested nutrients enter the blood and lymph from the digestive canal."}, {"topic": "Metabolic Adaptations", "q": "What is during the absorptive state, blood glucose?", "a": "oxidized to form ATP, and glucose transported to the liver is converted to glycogen or triglycerides", "fact": "During the absorptive state, blood glucose is oxidized to form ATP, and glucose transported to the liver is converted to glycogen or triglycerides."}, {"topic": "Metabolic Adaptations", "q": "What are most triglycerides?", "a": "stored in adipose tissue", "fact": "Most triglycerides are stored in adipose tissue."}, {"topic": "Metabolic Adaptations", "q": "What are amino acids in hepatocytes?", "a": "converted to carbohydrates, fats, and proteins", "fact": "Amino acids in hepatocytes are converted to carbohydrates, fats, and proteins."}, {"topic": "Metabolic Adaptations", "q": "Which key fact applies to “Table 25.3 summarizes the h ormonal regulation…”?", "a": "Table 25.3 summarizes the h ormonal regulation of metabolism during the absorptive state", "fact": "Table 25.3 summarizes the h ormonal regulation of metabolism during the absorptive state."}, {"topic": "Metabolic Adaptations", "q": "What is during the postabsorptive state, absorption?", "a": "complete and the ATP needs of the body are satisfied by nutrients already present in the body", "fact": "During the postabsorptive state, absorption is complete and the ATP needs of the body are satisfied by nutrients already present in the body."}, {"topic": "Metabolic Adaptations", "q": "What is the major task?", "a": "to maintain normal blood glucose level by converting glycogen in the liver and skeletal muscle into glucose, converting glycerol into glucose, and converting amino acids into glucose", "fact": "The major task is to maintain normal blood glucose level by converting glycogen in the liver and skeletal muscle into glucose, converting glycerol into glucose, and converting amino acids into glucose."}, {"topic": "Metabolic Adaptations", "q": "What are fatty acids, ketone bodies, and amino acids?", "a": "oxidized to supply ATP", "fact": "Fatty acids, ketone bodies, and amino acids are oxidized to supply ATP."}, {"topic": "Metabolic Adaptations", "q": "Which key fact applies to “Table 25.4 summarizes the hormonal regulation of…”?", "a": "Table 25.4 summarizes the hormonal regulation of metabolism during the postabsorptive state", "fact": "Table 25.4 summarizes the hormonal regulation of metabolism during the postabsorptive state."}, {"topic": "Metabolic Adaptations", "q": "Which key fact applies to “Fasting is going without food for a…”?", "a": "Fasting is going without food for a few days; starvation implies weeks or months of inadequate food intake", "fact": "Fasting is going without food for a few days; starvation implies weeks or months of inadequate food intake."}, {"topic": "Metabolic Adaptations", "q": "What are during fasting and starvation, fatty acids and ketone bodies?", "a": "increasingly utilized for ATP production", "fact": "During fasting and starvation, fatty acids and ketone bodies are increasingly utilized for ATP production."}, {"topic": "Energy Balance", "q": "What is energy balance?", "a": "the precise matching of energy intake to energy expenditure over time", "fact": "Energy balance is the precise matching of energy intake to energy expenditure over time."}, {"topic": "Energy Balance", "q": "What is a calorie (cal)?", "a": "the amount of energy required to raise the temperature of 1 g of water 1°C", "fact": "A calorie (cal) is the amount of energy required to raise the temperature of 1 g of water 1°C."}, {"topic": "Energy Balance", "q": "What is because the calorie?", "a": "a relatively small unit, the kilocalorie (kcal) or Calorie (Cal) is often used to measure the body’s metabolic rate and to express the energy content of foods; a kilocalorie equals 1000 calories", "fact": "Because the calorie is a relatively small unit, the kilocalorie (kcal) or Calorie (Cal) is often used to measure the body’s metabolic rate and to express the energy content of foods; a kilocalorie equals 1000 calories."}, {"topic": "Energy Balance", "q": "What is metabolic rate?", "a": "the overall rate at which metabolic reactions use energy", "fact": "Metabolic rate is the overall rate at which metabolic reactions use energy."}, {"topic": "Energy Balance", "q": "Which key fact applies to “Factors that affect metabolic rate include hormones…”?", "a": "Factors that affect metabolic rate include hormones, exercise, the nervous system, body temperature, ingestion of food, age, gender, climate, sleep, and malnutrition", "fact": "Factors that affect metabolic rate include hormones, exercise, the nervous system, body temperature, ingestion of food, age, gender, climate, sleep, and malnutrition."}, {"topic": "Energy Balance", "q": "What is measurement of the metabolic rate under basal conditions called?", "a": "the basal metabolic rate (BMR)", "fact": "Measurement of the metabolic rate under basal conditions is called the basal metabolic rate (BMR)."}, {"topic": "Energy Balance", "q": "What is total metabolic rate (tmr)?", "a": "the total energy expenditure by the body per unit time", "fact": "Total metabolic rate (TMR) is the total energy expenditure by the body per unit time."}, {"topic": "Energy Balance", "q": "Which key fact applies to “Three components contribute to the TMR: (1)…”?", "a": "Three components contribute to the TMR: (1) BMR, (2) physical activity, and (3) food-induced thermogenesis", "fact": "Three components contribute to the TMR: (1) BMR, (2) physical activity, and (3) food-induced thermogenesis."}, {"topic": "Energy Balance", "q": "What is adipose tissue?", "a": "the major site of stored chemical energy", "fact": "Adipose tissue is the major site of stored chemical energy."}, {"topic": "Energy Balance", "q": "What are two nuclei in the hypothalamus that help regulate food intake?", "a": "the arcuate and paraventricular nuclei", "fact": "Two nuclei in the hypothalamus that help regulate food intake are the arcuate and paraventricular nuclei."}, {"topic": "Energy Balance", "q": "Which key fact applies to “The hormone leptin, released by adipocytes, inhibits…”?", "a": "The hormone leptin, released by ures", "fact": "Convection is the transfer of heat by movement of air or water between areas of different temperatures."}, {"topic": "Regulation of Body Temperature", "q": "Which key fact applies to “Radiation is the transfer of heat from…”?", "a": "Radiation is the transfer of heat from a warmer object to a cooler object without physical contact", "fact": "Radiation is the transfer of heat from a warmer object to a cooler object without physical contact."}, {"topic": "Regulation of Body Temperature", "q": "Which key fact applies to “Evaporation is the conversion of a liquid…”?", "a": "Evaporation is the conversion of a liquid to a vapor; in the process, heat is lost", "fact": "Evaporation is the conversion of a liquid to a vapor; in the process, heat is lost."}, {"topic": "Regulation of Body Temperature", "q": "What is the hypothalamic thermostat?", "a": "in the preoptic area", "fact": "The hypothalamic thermostat is in the preoptic area."}];let F=[...ALL],i=0;const KEY='ap_ch25_flash_status';let status=JSON.parse(localStorage.getItem(KEY)||'{}');
