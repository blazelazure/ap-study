function state(){return {a:JSON.parse(localStorage.getItem(key('a'))||'{}'),f:JSON.parse(localStorage.getItem(key('f'))||'{}'),n:JSON.parse(localStorage.getItem(key('n'))||'{}')}}
function save(s){localStorage.setItem(key('a'),JSON.stringify(s.a));localStorage.setItem(key('f'),JSON.stringify(s.f));localStorage.setItem(key('n'),JSON.stringify(s.n))}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function finish(){const t=TESTS[ti],s=state();let good=0,ids=[];t.questions.forEach((q,i)=>{if(s.a[i]===q.a)good++;if((s.a[i]!==undefined&&s.a[i]!==q.a)||s.f[i])ids.push(i)});let h=`<div style="font-size:2rem;font-weight:850">${good} / 50 (${Math.round(good*2)}%)</div><div class="muted">${Object.keys(s.a).length} answered • ${ids.length} missed/flagged review items</div>`;if(ids.length){h+='<h3>Personalized Review</h3>';[...new Set(ids)].forEach(i=>{const q=t.questions[i];h+=`<div class="reviewitem"><strong>Q${i+1}. ${esc(q.q)}</strong><br><span class="small">Correct: ${esc(q.opts[q.a])}</span><div>${esc(q.exp)}</div>${s.n[i]?`<div style="color:#fde68a;margin-top:5px">Your note: ${esc(s.n[i])}</div>`:''}</div>`})}document.getElementById('summary').innerHTML=h;document.getElementById('summary').classList.remove('hidden');document.getElementById('summary').scrollIntoView({behavior:'smooth'})}
