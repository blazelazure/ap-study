ynapses are electrical and chemical."}, {"topic": "Action Potentials", "q": "What does a chemical synapse produce?", "a": "one-way information transfer—from a presynaptic neuron to a postsynaptic neuron", "fact": "A chemical synapse produces one-way information transfer—from a presynaptic neuron to a postsynaptic neuron."}, {"topic": "Action Potentials", "q": "What is an excitatory neurotransmitter?", "a": "one that can depolarize the postsynaptic neuron’s membrane, bringing the membrane potential closer to threshold", "fact": "An excitatory neurotransmitter is one that can depolarize the postsynaptic neuron’s membrane, bringing the membrane potential closer to threshold."}, {"topic": "Action Potentials", "q": "Which key fact applies to “An inhibitory neurotransmitter hyperpolarizes the membrane of…”?", "a": "An inhibitory neurotransmitter hyperpolarizes the membrane of the postsynaptic neuron, moving it further from threshold", "fact": "An inhibitory neurotransmitter hyperpolarizes the membrane of the postsynaptic neuron, moving it further from threshold."}, {"topic": "Action Potentials", "q": "Which key fact applies to “There are two major types of neurotransmitter…”?", "a": "There are two major types of neurotransmitter receptors: ionotropic receptors and metabotropic receptors", "fact": "There are two major types of neurotransmitter receptors: ionotropic receptors and metabotropic receptors."}, {"topic": "Action Potentials", "q": "What does an ionotropic receptor contain?", "a": "a neurotransmitter binding site and an ion channel", "fact": "An ionotropic receptor contains a neurotransmitter binding site and an ion channel."}, {"topic": "Action Potentials", "q": "What does a metabotropic receptor contain?", "a": "a neurotransmitter binding site and is coupled to a separate ion channel by a G protein", "fact": "A metabotropic receptor contains a neurotransmitter binding site and is coupled to a separate ion channel by a G protein."}, {"topic": "Action Potentials",
