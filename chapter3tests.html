at requires no direct energy input is:", "opts": ["Passive transport", "Active transport", "Exocytosis", "Endocytosis"], "a": 0, "exp": "Passive transport does not directly require ATP.", "topic": "Transport"}, {"q": "Movement against a concentration gradient is usually:", "opts": ["Osmosis", "Facilitated diffusion", "Active transport", "Simple diffusion"], "a": 2, "exp": "Active transport uses energy to move substances against gradients.", "topic": "Transport"}, {"q": "Net particle movement from high to low concentration is:", "opts": ["Diffusion", "Osmosis", "Exocytosis", "Phagocytosis"], "a": 0, "exp": "Diffusion moves particles down their concentration gradient.", "topic": "Transport"}, {"q": "Which change generally increases diffusion rate?", "opts": ["Greater diffusion distance", "Greater molecular mass", "Steeper concentration gradient", "Smaller surface area"], "a": 2, "exp": "A steeper concentration gradient increases diffusion rate.", "topic": "Transport"}, {"q": "Which membrane change increases diffusion rate?", "opts": ["Larger surface area", "Smaller surface area", "Longer diffusion distance", "Lower temperature"], "a": 0, "exp": "Greater surface area increases diffusion.", "topic": "Transport"}, {"q": "Glucose moving down its gradient through a carrier is:", "opts": ["Endocytosis", "Exocytosis", "Facilitated diffusion", "Primary active transport"], "a": 2, "exp": "Facilitated diffusion is passive and protein-mediated.", "topic": "Transport"}, {"q": "Net movement of water through a selectively permeable membrane is:", "opts": ["Osmosis", "Active transport", "Phagocytosis", "Exocytosis"], "a": 0, "exp": "Osmosis is water movement across a selectively permeable membrane.", "topic": "Transport"}, {"q": "A membrane channel specialized for water is an:", "opts": ["Ribosome", "Receptor", "Aquaporin", "Na+/K+ pump"], "a": 2, "exp": "Aquaporins are water channels.", "topic": "Transport"}, {"q": "In which solution does an RBC retain its normal shape?", "opts": [ ngs materials into cells in vesicles.", "topic": "Vesicles"}, {"q": "Vesicle fusion that releases contents outside a cell is:", "opts": ["Phagocytosis", "Osmosis", "Exocytosis", "Endocytosis"], "a": 2, "exp": "Exocytosis releases vesicular contents outside the cell.", "topic": "Vesicles"}, {"q": "'Cell eating' is:", "opts": ["Phagocytosis", "Pinocytosis", "Exocytosis", "Transcytosis"], "a": 0, "exp": "Phagocytosis is uptake of solid particles.", "topic": "Vesicles"}, {"q": "'Cell drinking' is:", "opts": ["Exocytosis", "Active pumping", "Pinocytosis", "Phagocytosis"], "a": 2, "exp": "Pinocytosis is bulk-phase uptake of extracellular fluid.", "topic": "Vesicles"}, {"q": "Selective uptake of a ligand after receptor binding is:", "opts": ["Receptor-mediated endocytosis", "Pinocytosis", "Exocytosis", "Simple diffusion"], "a": 0, "exp": "Receptor-mediated endocytosis selectively internalizes receptor-bound ligands.", "topic": "Vesicles"}, {"q": "Endocytosis on one side of a cell followed by exocytosis on the other is:", "opts": ["Phagocytosis", "Primary active transport", "Transcytosis", "Osmosis"], "a": 2, "exp": "Transcytosis moves material across cells via vesicles.", "topic": "Vesicles"}, {"q": "The smallest cytoskeletal filament is a:", "opts": ["Microfilament", "Intermediate filament", "Microtubule", "Ribosome"], "a": 0, "exp": "Microfilaments are the smallest cytoskeletal filaments and often contain actin.", "topic": "Cytoskeleton"}, {"q": "Which cytoskeletal element provides strong mechanical support?", "opts": ["Microtubule", "Centriole", "Intermediate filament", "Microfilament"], "a": 2, "exp": "Intermediate filaments provide mechanical strength.", "topic": "Cytoskeleton"}, {"q": "Which cytoskeletal element forms the mitotic spindle?", "opts": ["Microtubule", "Microfilament", "Intermediate filament", "Peptide"], "a": 0, "exp": "Microtubules form spindles and the core of cilia/flagella.", "topic": "Cytoskeleton"}, {"q": "The major microtubule-organizing center near the nucleus is the:", "opts": ["Lysosome", "Nucleolus", "Centrosome", "Golgi complex"], "a": 2, "exp": "The centrosome organizes microtubules and spindle formation.", "topic": "Organelles"}, {"q": "Numerous short hairlike projections that move fluid over a cell are:", "opts": ["Cilia", "Flagella", "Microvilli", "Ribosomes"], "a": 0, "exp": "Cilia move fluid across cell surfaces.", "topic": "Organelles"}, {"q": "The human sperm tail is a:", "opts": ["Microvillus", "Centrosome", "Flagellum", "Cilium"], "a": 2, "exp": "A flagellum moves the entire cell; in humans it is the sperm tail.", "topic": "Organelles"}, {"q": "The site of protein synthesis is the:", "opts": ["Ribosome", "Golgi complex", "Lysosome", "Centrosome"], "a": 0, "exp": "Ribosomes synthesize proteins.", "topic": "Organelles"}, {"q": "Which organelle is studded with ribosomes?", "opts": ["Golgi complex", "Lysosome", "Rough ER", "Smooth ER"], "a": 2, "exp": "Rough ER synthesizes and processes many proteins.", "topic": "Organelles"}, {"q": "Which organelle synthesizes fatty acids and steroids and lacks ribosomes?", "opts": ["Smooth ER", "Rough ER", "Golgi complex", "Ribosome"], "a": 0, "exp": "Smooth ER synthesizes lipids, detoxifies chemicals, and stores calcium.", "topic": "Organelles"}, {"q": "Which organelle modifies, sorts, and packages proteins from the ER?", "opts": ["Centrosome", "Nucleolus", "Golgi complex", "Ribosome"], "a": 2, "exp": "The Golgi modifies and sorts molecules into vesicles.", "topic": "Organelles"}, {"q": "Which organelle contains hydrolytic digestive enzymes?", "opts": ["Lysosome", "Peroxisome", "Proteasome", "Centrosome"], "a": 0, "exp": "Lysosomes digest and recycle cellular/extracellular material.", "topic": "Organelles"}, {"q": "Which organelle contains catalase and detoxifies hydrogen peroxide?", "opts": ["Ribosome", "Nucleolus", "Peroxisome", "Lysosome"], "a": 2, "exp": "Peroxisomes contain oxidases and catalase.", "topic": "Organelles"}, {"q": "Which structure degrades damaged or unneeded cytosolic proteins?", "opts": ["Proteasome", "Lysosome", "Golgi complex", "Mitochondrion"], "a": 0, "exp": "Proteasomes degrade damaged/unneeded proteins.", "topic": "Organelles"}, {"q": "Which organelle produces most ATP by aerobic respiration?", "opts": ["Golgi complex", "Centrosome", "Mitochondrion", "Lysosome"], "a": 2, "exp": "Mitochondria produce most cellular ATP and participate in apoptosis.", "topic": "Organelles"}, {"q": "Folds of the inner mitochondrial membrane are:", "opts": ["Cristae", "Cisternae", "Centrioles", "Chromatin"], "a": 0, "exp": "Cristae are folds of the inner mitochondrial membrane.", "topic": "Organelles"}, {"q": "Which double membrane surrounds the nucleus?", "opts": ["Golgi membrane", "Lysosomal membrane", "Nuclear envelope", "Plasma membrane"], "a": 2, "exp": "The nuclear envelope surrounds the nucleus.", "topic": "Nucleus"}, {"q": "Which structure regulates traffic between nucleus and cytoplasm?", "opts": ["Nuclear pore", "Aquaporin", "Gap junction", "Lysosome"], "a": 0, "exp": "Nuclear pores regulate transport across the nuclear envelope.", "topic": "Nucleus"}, {"q": "Diffuse DNA-protein material in an interphase nucleus is:", "opts": ["Cristae", "Cilia", "Chromatin", "Cytosol"], "a": 2, "exp": "Chromatin is the diffuse DNA-protein complex.", "topic": "Nucleus"}, {"q": "Where are ribosomal subunits produced?", "opts": ["Nucleolus", "Centrosome", "Golgi complex", "Lysosome"], "a": 0, "exp": "The nucleolus produces ribosomal subunits.", "topic": "Nucleus"}, {"q": "Copying DNA information into RNA is:", "opts": ["Replication", "Cytokinesis", "Transcription", "Translation"], "a": 2, "exp": "Transcription uses DNA as a template to make RNA.", "topic": "Protein Synthesis"}]}, {"name": "Test 2", "subtitle": "Application & recognition", "questions": [{"q": "Water enters a cell placed in a(n):", "opts": ["Hypertonic solution", "Buffered solution", "Hypotonic solution", "Isotonic solution"], "a": 2, "exp": "Hypotonic solutions drive water into cells.", "topic": "Tonicity"}, {"q": "Water leaves a cell placed in a(n):", "opts": ["Hypertonic solution", "Isotonic solution", "Hypotonic solution", "Neutral solution"], "a": 0, "exp": "Hypertonic solutions draw water out of cells.", "topic": "Tonicity"}, {"q": "The sodium-potassium pump is also called:", "opts": ["GLUT carrier", "Clathrin", "Na+/K+ ATPase", "Aquaporin"], "a": 2, "exp": "Na+/K+ ATPase uses ATP to pump sodium and potassium.", "topic": "Transport"}, {"q": "The Na+/K+ pump performs:", "opts": ["Primary active transport", "Secondary active transport", "Facilitated diffusion", "Osmosis"], "a": 0, "exp": "Primary active transport directly uses ATP.", "topic": "Transport"}, {"q": "A symporter driven by a Na+ gradient performs:", "opts": ["Simple diffusion", "Exocytosis", "Secondary active transport", "Primary active transport"], "a": 2, "exp": "Secondary active transport uses energy in ion gradients.", "topic": "Transport"}, {"q": "Same-direction cotransport is performed by a:", "opts": ["Symporter", "Antiporter", "Aquaporin", "Channel"], "a": 0, "exp": "Symporters move substances in the same direction.", "topic": "Transport"}, {"q": "Countertransport is performed by an:", "opts": ["Aquaporin", "Ligand", "Antiporter", "Symporter"], "a": 2, "exp": "Antiporters move substances in opposite directions.", "topic": "Transport"}, {"q": "When the plasma membrane forms a vesicle around material entering the cell, the process is:", "opts": ["Endocytosis", "Exocytosis", "Osmosis", "Diffusion"], "a": 0, "exp": "Endocytosis brings materials into cells in vesicles.", "topic": "Vesicles"}, {"q": "Secretion of a packaged product commonly occurs by:", "opts": ["Phagocytosis", "Osmosis", "Exocytosis", "Endocytosis"], "a": 2, "exp": "Exocytosis releases vesicular contents outside the cell.", "topic": "Vesicles"}, {"q": "Engulfment of a solid particle is:", "opts": ["Phagocytosis", "Pinocytosis", "Exocytosis", "Transcytosis"], "a": 0, "exp": "Phagocytosis function save(s){localStorage.setItem(key('a'),JSON.stringify(s.a));localStorage.setItem(key('f'),JSON.stringify(s.f));localStorage.setItem(key('n'),JSON.stringify(s.n))}
