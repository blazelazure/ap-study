<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 18 Visual Practice</title><style>
:root{--bg:#09111f;--panel:#121d31;--panel2:#0e182a;--text:#f3f6ff;--muted:#aeb9d0;--line:#2a3a5e;--accent:#82afff;--good:#34d399;--bad:#fb7185;--warn:#fbbf24}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#08101d,#0e1728);color:var(--text);font:16px/1.52 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:28px 16px 75px}a{color:inherit}.muted{color:var(--muted)}.small{font-size:.88rem;color:var(--muted)}
header{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;margin:15px 0 18px}.eyebrow{color:var(--accent);font-size:.8rem;font-weight:850;text-transform:uppercase;letter-spacing:.08em}
h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:6px 0 8px}h2{font-size:1.35rem}h3{font-size:1.03rem;color:var(--accent)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.btn,button{font:inherit;display:inline-block;text-decoration:none;color:var(--text);background:#263552;border:1px solid #3a4d76;border-radius:11px;padding:10px 13px;cursor:pointer}.btn.primary,button.primary{background:#31518c;border-color:#5a7fc3;font-weight:800}.btn:hover,button:hover{border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;margin:12px 0}.flow{background:var(--panel2);border-left:4px solid var(--accent);border-radius:9px;padding:10px 12px;margin:9px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:#c8d2e6;font-size:.78rem;margin:3px 4px 0 0;background:#0d1728}

.diagram{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;margin:14px 0}.nodes{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:13px}.node{min-width:115px;flex:1;background:var(--panel2);border:1px solid #3a4d76;border-radius:11px;padding:14px;text-align:center;font-weight:800;cursor:pointer}.node .label{display:none;color:var(--accent)}.node.reveal .num{display:none}.node.reveal .label{display:block}.arrow{color:var(--muted);font-size:1.3rem}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
</style></head><body><main class="wrap"><a class="small" href="chapter18.html" style="text-decoration:none">← Chapter 18</a><header><div class="eyebrow">Chapter 18</div><h1>The Endocrine System — Visual Practice</h1><div class="muted">Diagram-style labeling and sequence practice. Click each numbered box to reveal its label.</div></header><div id="root"></div></main><script>
const SETS=[{"title": "Major endocrine glands", "nodes": ["Hypothalamus", "Pituitary", "Thyroid", "Parathyroids", "Adrenals", "Pancreatic islets", "Gonads", "Pineal"], "instruction": "Reveal each major endocrine structure and recall its major hormones."}, {"title": "Hypothalamic–pituitary control", "nodes": ["Hypothalamus", "Releasing / inhibiting hormones", "Anterior pituitary", "Target endocrine gland", "Target tissue"], "instruction": "Trace a classic endocrine control axis."}];const root=document.getElementById('root');SETS.forEach((s,si)=>{const d=document.createElement('section');d.className='diagram';d.innerHTML=`<div class="eyebrow">Visual Set ${si+1}</div><h2>${s.title}</h2><div class="muted">${s.instruction}</div><div class="nodes" id="n${si}"></div><div class="controls"><button onclick="revealAll(${si},true)">Reveal all</button><button onclick="revealAll(${si},false)">Hide labels</button></div>`;root.appendChild(d);const host=d.querySelector('.nodes');s.nodes.forEach((x,i)=>{const el=document.createElement('div');el.className='node';el.innerHTML=`<span class="num">${i+1}</span><span class="label">${x}</span>`;el.onclick=()=>el.classList.toggle('reveal');host.appendChild(el);if(i<s.nodes.length-1){const a=document.createElement('span');a.className='arrow';a.textContent='→';host.appendChild(a)}})});function revealAll(si,on){document.querySelectorAll(`#n${si} .node`).forEach(x=>x.classList.toggle('reveal',on))}
</script></body></html>
