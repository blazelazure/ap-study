e."}, {"topic": "Core Concepts", "q": "Which key fact applies to “Fertilization normally occurs in the uterine tube…”?", "a": "Fertilization normally occurs in the uterine tube within 12 to 24 hours after ovulation", "fact": "Fertilization normally occurs in the uterine tube within 12 to 24 hours after ovulation."}, {"topic": "Core Concepts", "q": "What is sperm can remain viable for about 48 hours after deposition in the vagina, although a secondary oocyte?", "a": "viable for only about 24 hours after ovulation", "fact": "Sperm can remain viable for about 48 hours after deposition in the vagina, although a secondary oocyte is viable for only about 24 hours after ovulation."}, {"topic": "Core Concepts", "q": "What is thus, pregnancy?", "a": "most likely to occur if intercourse takes place during a 3-day window—from 2 days before ovulation to 1 day after ovulation", "fact": "Thus, pregnancy is most likely to occur if intercourse takes place during a 3-day window—from 2 days before ovulation to 1 day after ovulation."}, {"topic": "OBJECT IV E", "q": "Which key fact applies to “Third Week of Development The third embryonic…”?", "a": "Third Week of Development The third embryonic week begins a 6-week period of very rapid development and differentiation", "fact": "Third Week of Development The third embryonic week begins a 6-week period of very rapid development and differentiation."}, {"topic": "OBJECT IV E", "q": "What are during the third week, the three primary germ layers?", "a": "established and lay the groundwork for organ development in weeks 4 through 8", "fact": "During the third week, the three primary germ layers are established and lay the groundwork for organ development in weeks 4 through 8."}, {"topic": "OBJECT IV E", "q": "Which key fact applies to “Gastrulation The first major event of the…”?", "a": "Gastrulation The first major event of the third week of development, gastrulation (gas-troo-LĀ-shun), occurs about 15 days after fertilization", "fact": "G
