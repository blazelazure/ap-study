opic": "Anatomy of the Heart", "q": "What is the epicardium consists of mesothelium and connective tissue, the myocardium composed of?", "a": "cardiac muscle tissue, and the endocardium consists of endothelium and connective tissue", "fact": "The epicardium consists of mesothelium and connective tissue, the myocardium is composed of cardiac muscle tissue, and the endocardium consists of endothelium and connective tissue."}, {"topic": "Anatomy of the Heart", "q": "Which key fact applies to “The heart chambers include two superior chambers…”?", "a": "The heart chambers include two superior chambers, the right and left atria, and two inferior chambers, the right and left ventricles", "fact": "The heart chambers include two superior chambers, the right and left atria, and two inferior chambers, the right and left ventricles."}, {"topic": "Anatomy of the Heart", "q": "Which key fact applies to “External features of the heart include the…”?", "a": "External features of the heart include the auricles, the coronary sulcus between the atria and ventricles, and the anterior and posterior sulci between the ventricles on the anterior and posterior surfaces of the heart, respectively", "fact": "External features of the heart include the auricles, the coronary sulcus between the atria and ventricles, and the anterior and posterior sulci between the ventricles on the anterior and posterior surfaces of the heart, respectively."}, {"topic": "Anatomy of the Heart", "q": "What is the right side of the heart?", "a": "the pump for pulmonary circulation, the circulation of blood through the lungs", "fact": "The right side of the heart is the pump for pulmonary circulation, the circulation of blood through the lungs."}, {"topic": "Anatomy of the Heart", "q": "Which key fact applies to “The right ventricle ejects blood into the…”?", "a": "The right ventricle ejects blood into the pulmonary trunk, and blood then flows into pulmonary arteries, pulmonary capillaries, and pulmonary veins, which carry it back to the left atrium", "fact": "The right ventricle ejects blood into the pulmonary trunk, and blood then flows into pulmonary arteries, pulmonary capillaries, and pulmonary veins, which carry it back to the left atrium."}, {"topic": "Anatomy of the Heart", "q": "Which key fact applies to “The coronary circulation provides blood flow to…”?", "a": "The coronary circulation provides blood flow to the myocardium", "fact": "The coronary circulation provides blood flow to the myocardium."}, {"topic": "Anatomy of the Heart", "q": "What are its main arteries?", "a": "the left and right coronary arteries; its main veins are the cardiac veins and the coronary sinus", "fact": "Its main arteries are the left and right coronary arteries; its main veins are the cardiac veins and the coronary sinus."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "What does cardiac muscle fibers usually contain?", "a": "a single centrally located nucleus", "fact": "Cardiac muscle fibers usually contain a single centrally located nucleus."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "Which key fact applies to “Compared with skeletal muscle fibers, cardiac muscle…”?", "a": "Compared with skeletal muscle fibers, cardiac muscle fibers have more and larger mitochondria, slightly smaller sarcoplasmic reticulum, and wider T tubules, which are located at Z discs", "fact": "Compared with skeletal muscle fibers, cardiac muscle fibers have more and larger mitochondria, slightly smaller sarcoplasmic reticulum, and wider T tubules, which are located at Z discs."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "What are cardiac muscle fibers?", "a": "connected end-to-end via intercalated discs", "fact": "Cardiac muscle fibers are connected end-to-end via intercalated discs."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "Which key fact applies to “Desmosomes in the discs provide strength, and…”?", "a": "Desmosomes in the discs provide strength, and gap junctions allow muscle action potentials to conduct from one muscle fiber to its neighbors", "fact": "Desmosomes in the discs provide strength, and gap junctions allow muscle action potentials to conduct from one muscle fiber to its neighbors."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "Which key fact applies to “Autorhythmic fibers form the conduction system, cardiac…”?", "a": "Autorhythmic fibers form the conduction system, cardiac muscle fibers that spontaneously depolarize and generate action potentials", "fact": "Autorhythmic fibers form the conduction system, cardiac muscle fibers that spontaneously depolarize and generate action potentials."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "What are components of the conduction system?", "a": "the sinuatrial (SA) node (natural pacemaker), atrioventricular (AV) node, atrioventricular (AV) bundle, bundle branches, and subendocardial conducting network", "fact": "Components of the conduction system are the sinuatrial (SA) node (natural pacemaker), atrioventricular (AV) node, atrioventricular (AV) bundle, bundle branches, and subendocardial conducting network."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "Which key fact applies to “The right atrium receives blood from the…”?", "a": "The right atrium receives blood from the superior vena cava, inferior vena cava, and coronary sinus", "fact": "The right atrium receives blood from the superior vena cava, inferior vena cava, and coronary sinus."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "What does it is separated internally from the left atrium by the interatrial septum, which contain?", "a": "the fossa ovalis", "fact": "It is separated internally from the left atrium by the interatrial septum, which contains the fossa ovalis."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "Which key fact applies to “ polarization), and a T wave (ventricular repolarization)."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "Which key fact applies to “Oxygenated blood enters the left atrium from…”?", "a": "Oxygenated blood enters the left atrium from the pulmonary veins and exits through the left atrioventricular valve", "fact": "Oxygenated blood enters the left atrium from the pulmonary veins and exits through the left atrioventricular valve."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "Which key fact applies to “The left ventricle pumps oxygenated blood through…”?", "a": "The left ventricle pumps oxygenated blood through the aortic valve into the aorta", "fact": "The left ventricle pumps oxygenated blood through the aortic valve into the aorta."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "Which key fact applies to “The thickness of the myocardium of the…”?", "a": "The thickness of the myocardium of the four chambers varies according to the chamber’s function", "fact": "The thickness of the myocardium of the four chambers varies according to the chamber’s function."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "Which key fact applies to “The left ventricle, with the highest workload…”?", "a": "The left ventricle, with the highest workload, has the thickest wall", "fact": "The left ventricle, with the highest workload, has the thickest wall."}, {"topic": "Cardiac Muscle Tissue and the Cardiac Conduction", "q": "What is the fibrous skeleton of the heart?", "a": "dense connective tissue surrounding and supporting the heart valves", "fact": "The fibrous skeleton of the heart is dense connective tissue surrounding and supporting the heart valves."}, {"topic": "Heart Valves and Circulation of Blood", "q": "Which key fact applies to “Heart valves prevent backflow of blood within…”?", "a": "Heart valves prevent backflow of blood within the heart", "fact": "Heart valves prevent backflow of blood within the heart."}, {"topic": "Heart Valves and Circulation of Blood", "q": "What are the atrioventricular (av) valves, which lie between atria and ventricles,?", "a": "the right atrioventricular (tricuspid) valve on the right side of the heart and the left atrioventricular (bicuspid) valve on the left side", "fact": "The atrioventricular (AV) valves, which lie between atria and ventricles, are the right atrioventricular (tricuspid) valve on the right side of the heart and the left atrioventricular (bicuspid) valve on the left side."}, {"topic": "Heart Valves and Circulation of Blood", "q": "What are the semilunar (sl) valves?", "a": "the aortic valve, at the entrance to the aorta, and the pulmonary valve, at the entrance to the pulmonary trunk", "fact": "The semilunar (SL) valves are the aortic valve, at the entrance to the aorta, and the pulmonary valve, at the entrance to the pulmonary trunk."}, {"topic": "Heart Valves and Circulation of Blood", "q": "What is the left side of the heart?", "a": "the pump for systemic circulation, the circulation of blood throughout the body except for the pulmonary alveoli (air sacs) of the lungs", "fact": "The left side of the heart is the pump for systemic circulation, the circulation of blood throughout the body except for the pulmonary alveoli (air sacs) of the lungs."}, {"topic": "Heart Valves and Circulation of Blood", "q": "Which key fact applies to “The left ventricle ejects blood into the…”?", "a": "The left ventricle ejects blood into the aorta, and blood then flows into systemic arteries, arterioles, capillaries, venules, and veins, which carry it back to the right atrium", "fact": "The left ventricle ejects blood into the aorta, and blood then flows into systemic arteries, arterioles, capillaries, venules, and veins, which carry it back to the right atrium."}, {"topic": "Heart Valves and Circulation of Blood", "q": "Which key fact applies to “Cardiac muscle tissue has a long refractory…”?", "a": "Cardiac muscle tissue has a long refractory period, which prevents tetanus", "fact": "Cardiac muscle tissue has a long refractory period, which prevents tetanus."}, {"topic": "Heart Valves and Circulation of Blood", "q": "Which key fact applies to “The P–Q interval represents the conduction time…”?", "a": "The P–Q interval represents the conduction time from the beginning of atrial excitation to the beginning of ventricular excitation", "fact": "The P–Q interval represents the conduction time from the beginning of atrial excitation to the beginning of ventricular excitation."}, {"topic": "Heart Valves and Circulation of Blood", "q": "What are the s–t segment represents the time when ventricular contractile fibers?", "a": "fully depolarized", "fact": "The S–T segment represents the time when ventricular contractile fibers are fully depolarized."}, {"topic": "The Cardiac Cycle", "q": "What does a cardiac cycle consist of?", "a": "the systole (contraction) and diastole (relaxation) of both atria, plus the systole and diastole of both ventricles", "fact": "A cardiac cycle consists of the systole (contraction) and diastole (relaxation) of both atria, plus the systole and diastole of both ventricles."}, {"topic": "The Cardiac Cycle", "q": "Which key fact applies to “With an average heartbeat of 75 beats/min…”?", "a": "With an average heartbeat of 75 beats/min, a complete cardiac cycle requires 0.8 sec", "fact": "With an average heartbeat of 75 beats/min, a complete cardiac cycle requires 0.8 sec."}, {"topic": "The Cardiac Cycle", "q": "What are the phases of the cardiac cycle?", "a": "(a) atrial systole, (b) ventricular systole, and (c) relaxation period", "fact": "The phases of the cardiac cycle are (a) atrial systole, (b) ventricular systole, and (c) relaxation period."}, {"topic": "The Cardiac Cycle", "q": "What is s1, the first heart sound (lubb),?", "a": "caused by blood turbulence associated with the closing of the atrioventricular valves", "fact": "S1, the first heart sound (lubb), lated to preload (stretch on the heart before it contracts), contractility (forcefulness of contraction), and afterload (pressure that must be exceeded before ventricular ejection can begin)", "fact": "Stroke volume is related to preload (stretch on the heart before it contracts), contractility (forcefulness of contraction), and afterload (pressure that must be exceeded before ventricular ejection can begin)."}, {"topic": "Exercise and the Heart", "q": "Which key fact applies to “According to the Frank–Starling law of the…”?", "a": "According to the Frank–Starling law of the heart, a greater preload (end-diastolic volume) stretching cardiac muscle fibers just before they contract increases their force of contraction until the stretching becomes excessive", "fact": "According to the Frank–Starling law of the heart, a greater preload (end-diastolic volume) stretching cardiac muscle fibers just before they contract increases their force of contraction until the stretching becomes excessive."}, {"topic": "Exercise and the Heart", "q": "Which key fact applies to “Nervous control of the cardiovascular system originates…”?", "a": "Nervous control of the cardiovascular system originates in the cardiovascular center in the medulla oblongata", "fact": "Nervous control of the cardiovascular system originates in the cardiovascular center in the medulla oblongata."}, {"topic": "Exercise and the Heart", "q": "Which key fact applies to “Sustained exercise increases oxygen demand on muscles…”?", "a": "Sustained exercise increases oxygen demand on muscles", "fact": "Sustained exercise increases oxygen demand on muscles."}, {"topic": "Help for Failing Hearts", "q": "What is a cardiac (heart) transplant?", "a": "the replacement of a severely damaged heart with a normal one", "fact": "A cardiac (heart) transplant is the replacement of a severely damaged heart with a normal one."}, {"topic": "Help for Failing Hearts", "q": "Which key fact applies to “Cardiac assist devices and procedures include the…”?", "a": "Cardiac assist devices and procedures include the intra-aortic balloon pump, the ventricular assist device, cardiomyoplasty, and a skeletal muscle assist device", "fact": "Cardiac assist devices and procedures include the intra-aortic balloon pump, the ventricular assist device, cardiomyoplasty, and a skeletal muscle assist device."}, {"topic": "Help for Failing Hearts", "q": "Which key fact applies to “Sympathetic impulses increase heart rate and force…”?", "a": "Sympathetic impulses increase heart rate and force of contraction; parasympathetic impulses decrease heart rate", "fact": "Sympathetic impulses increase heart rate and force of contraction; parasympathetic impulses decrease heart rate."}, {"topic": "Development of the Heart", "q": "What is heart rate?", "a": "affected by hormones (epinephrine, norepinephrine, thyroid hormones), ions (Na+, K+, Ca2+), age, gender, physical fitness, and body temperature", "fact": "Heart rate is affected by hormones (epinephrine, norepinephrine, thyroid hormones), ions (Na+, K+, Ca2+), age, gender, physical fitness, and body temperature."}, {"topic": "Development of the Heart", "q": "Which key fact applies to “The heart primordial tubes develop into the…”?", "a": "The heart primordial tubes develop into the four-chambered heart and great vessels of the heart", "fact": "The heart primordial tubes develop into the four-chambered heart and great vessels of the heart."}, {"topic": "Development of the Heart", "q": "Which key fact applies to “The heart develops from mesoderm…”?", "a": "The heart develops from mesoderm", "fact": "The heart develops from mesoderm."}, {"topic": "Course Study Guide", "q": "Which key fact applies to “Cube-shaped cells, they line the kidney tubules…”?", "a": "Cube-shaped cells, they line the kidney tubules and cover the ovaries", "fact": "Cube-shaped cells, they line the kidney tubules and cover the ovaries."}, {"topic": "Course Study Guide", "q": "Which key fact applies to “accum
