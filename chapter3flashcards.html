t applies to “A cell can either remain alive and…”?", "a": "A cell can either remain alive and functioning without dividing, grow and divide, or die", "fact": "A cell can either remain alive and functioning without dividing, grow and divide, or die."}, {"topic": "Cell Division", "q": "Which key fact applies to “The control of cell division depends on…”?", "a": "The control of cell division depends on specific cyclin-dependent protein kinases and cyclins", "fact": "The control of cell division depends on specific cyclin-dependent protein kinases and cyclins."}, {"topic": "Cell Division", "q": "Which key fact applies to “Apoptosis is normal, programmed cell death…”?", "a": "Apoptosis is normal, programmed cell death", "fact": "Apoptosis is normal, programmed cell death."}, {"topic": "Cell Division", "q": "Which key fact applies to “It first occurs during embryological development and…”?", "a": "It first occurs during embryological development and continues throughout the lifetime of an organism", "fact": "It first occurs during embryological development and continues throughout the lifetime of an organism."}, {"topic": "Cell Division", "q": "Which key fact applies to “Certain genes regulate both cell division and…”?", "a": "Certain genes regulate both cell division and apoptosis", "fact": "Certain genes regulate both cell division and apoptosis."}, {"topic": "Cell Division", "q": "What are abnormalities in these genes?", "a": "associated with a wide variety of diseases and disorders", "fact": "Abnormalities in these genes are associated with a wide variety of diseases and disorders."}, {"topic": "Cell Division", "q": "What is in sexual reproduction each new organism?", "a": "the result of the union of two different gametes, one from each parent", "fact": "In sexual reproduction each new organism is the result of the union of two different gametes, one from each parent."}, {"topic": "Cell Division", "q": "What are gametes contain a single set of chromosomes (23) and thus?", "a": "haploid (n)", "fact": "Gametes contain a single set of chromosomes (23) and thus are haploid (n)."}, {"topic": "Cell Division", "q": "What does meiosis is the process that produces haploid gametes; it consist of?", "a": "two successive nuclear divisions, called meiosis I and meiosis II", "fact": "Meiosis is the process that produces haploid gametes; it consists of two successive nuclear divisions, called meiosis I and meiosis II."}, {"topic": "Cell Division", "q": "What is during meiosis i, homologous chromosomes undergo synapsis (pairing) and crossing-over; the net result?", "a": "two haploid cells that are genetically unlike each other and unlike the starting diploid parent cell that produced them", "fact": "During meiosis I, homologous chromosomes undergo synapsis (pairing) and crossing-over; the net result is two haploid cells that are genetically unlike each other and unlike the starting diploid parent cell that produced them."}, {"topic": "Cell Division", "q": "Which key fact applies to “During meiosis II, two haploid cells divide…”?", "a": "During meiosis II, two haploid cells divide to form four haploid cells", "fact": "During meiosis II, two haploid cells divide to form four haploid cells."}, {"topic": "Cellular Diversity", "q": "What are the sizes of cells?", "a": "measured in micrometers", "fact": "The sizes of cells are measured in micrometers."}, {"topic": "Cellular Diversity", "q": "Which key fact applies to “One micrometer (μm) equals 10−6 m (1/25,000…”?", "a": "One micrometer (μm) equals 10−6 m (1/25,000 of an inch)", "fact": "One micrometer (μm) equals 10−6 m (1/25,000 of an inch)."}, {"topic": "Cellular Diversity", "q": "Which key fact applies to “Cells in the human body range in…”?", "a": "Cells in the human body range in size from 8 μm to 140 μm", "fact": "Cells in the human body range in size from 8 μm to 140 μm."}, {"topic": "Cellular Diversity", "q": "What is a cell’s shape?", "a": "related to its function", "fact": "A cell’s shape en produced by the cell for export or as cellular waste products must move out of the cell", "fact": "Other substances that have been produced by the cell for export or as cellular waste products must move out of the cell."}, {"topic": "OBJECTIV E", "q": "Which key fact applies to “Substances generally move across cellular membranes via…”?", "a": "Substances generally move across cellular membranes via transport processes that can be classified as passive or active, depending on whether they require cellular energy", "fact": "Substances generally move across cellular membranes via transport processes that can be classified as passive or active, depending on whether they require cellular energy."}, {"topic": "OBJECTIV E", "q": "Which key fact applies to “In passive processes, a substance moves down…”?", "a": "In passive processes, a substance moves down its concentration or electrical gradient to cross the membrane using only its own kinetic energy (energy of motion)", "fact": "In passive processes, a substance moves down its concentration or electrical gradient to cross the membrane using only its own kinetic energy (energy of motion)."}, {"topic": "OBJECTIV E", "q": "What is kinetic energy?", "a": "intrinsic to the particles that are moving", "fact": "Kinetic energy is intrinsic to the particles that are moving."}, {"topic": "OBJECTIV E", "q": "Which key fact applies to “There is no input of energy from…”?", "a": "There is no input of energy from the cell", "fact": "There is no input of energy from the cell."}, {"topic": "Fluid and", "q": "Which key fact applies to “dissolved solutes in vesicle Fusion of lysosome…”?", "a": "dissolved solutes in vesicle Fusion of lysosome and vesicle Digestion by lysosomal enzymes Digested solutes Q How do receptor-mediated endocytosis and phagocytosis differ from bulk-phase endocytosis?", "fact": "dissolved solutes in vesicle Fusion of lysosome and vesicle Digestion by lysosomal enzymes Digested solutes Q How do receptor-mediated e
