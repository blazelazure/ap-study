<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 3 Flashcards</title>
<style>
:root{--bg:#0b1020;--card:#151d33;--card2:#10172b;--text:#eef2ff;--muted:#aab6d3;--line:#2c395f;--accent:#8ab4ff;--good:#34d399;--warn:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#0b1020,#10162a);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:auto;padding:26px 16px 72px}
a{color:inherit}.muted{color:var(--muted)}.small{font-size:.88rem;color:var(--muted)}
header{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px}
.eyebrow{color:var(--accent);font-size:.82rem;font-weight:850;text-transform:uppercase;letter-spacing:.08em}
h1{margin:6px 0 6px;font-size:clamp(2rem,5vw,3rem);line-height:1.1}h2{font-size:1.35rem}h3{font-size:1.05rem;color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn,button{font:inherit;display:inline-block;text-decoration:none;color:var(--text);background:#263454;border:1px solid #3a4c77;border-radius:11px;padding:10px 13px;cursor:pointer}
.btn.primary,button.primary{background:#31518c;border-color:#5477ba;font-weight:800}.btn:hover,button:hover{border-color:var(--accent)}
.toc{background:var(--card2);border:1px solid var(--line);border-radius:15px;padding:14px;margin:17px 0}.toc a{display:inline-block;text-decoration:none;color:var(--muted);margin:3px 12px 3px 0}.toc a:hover{color:var(--text)}
.guide{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:19px;margin:13px 0}.guide h2{margin:0 0 9px}.guide h3{margin:15px 0 5px}
ul{padding-left:22px}li{margin:5px 0}.term{font-weight:800}.flow{background:var(--card2);border-left:4px solid var(--accent);border-radius:9px;padding:10px 12px;margin:9px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}.mini{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px}.mini strong{color:var(--accent)}

.toolbar{position:sticky;top:6px;z-index:4;background:rgba(11,16,32,.95);border:1px solid var(--line);border-radius:13px;padding:10px;display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
input,select{font:inherit;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;min-width:0}
.card{perspective:1200px;margin:18px auto;max-width:740px;min-height:325px}.inner{position:relative;min-height:325px;transition:transform .35s;transform-style:preserve-3d;cursor:pointer}
.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:27px;display:flex;flex-direction:column;justify-content:center}
.backface{transform:rotateY(180deg)}.cat{color:var(--accent);font-weight:800;text-transform:uppercase;font-size:.8rem}.termcard{font-size:clamp(1.6rem,5vw,2.5rem);font-weight:850;margin:11px 0}.answer{font-size:1.12rem}
.nav,.mark{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}.known{border-color:var(--good)!important}.review{border-color:var(--warn)!important}
@media(max-width:620px){.toolbar{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<a class="small" href="chapter3.html" style="text-decoration:none">← Chapter 3</a>
<header><div class="eyebrow">Chapter 3</div><h1>The Cellular Level of Organization Flashcards</h1><div class="muted">87 cards • progress is saved privately in this browser</div></header>
<div class="toolbar"><input id="search" placeholder="Search cards"><select id="cat"><option value="">All topics</option><option>Cell Overview</option><option>Membrane</option><option>Transport</option><option>Vesicles</option><option>Cytoskeleton</option><option>Organelles</option><option>Nucleus</option><option>Protein Synthesis</option><option>Cell Division</option><option>Cell Death</option><option>Cell Aging</option></select><button onclick="shuffle()">Shuffle</button></div>
<div class="small" id="stats" style="margin-top:10px"></div>
<div id="card" class="card"><div class="inner" onclick="flip()"><div class="face"><div class="cat" id="fc"></div><div class="termcard" id="ft"></div><div class="small" style="margin-top:auto">Tap card to flip</div></div><div class="face backface"><div class="cat" id="bc"></div><div class="answer" id="ba"></div><div class="small" style="margin-top:auto">Tap card to flip back</div></div></div></div>
<div class="nav"><button onclick="prev()">← Previous</button><button onclick="next()">Next →</button></div>
<div class="mark"><button onclick="mark('review')">Needs Review</button><button onclick="mark('known')">Know It</button><button onclick="clearMark()">Clear Mark</button></div>
</main><script>
const ALL=[["Cell Overview", "Plasma membrane", "Outer boundary of the cell; separates internal from external environment, is selectively permeable, and participates in communication."], ["Cell Overview", "Cytoplasm", "All cellular contents between the plasma membrane and nucleus; consists of cytosol plus organelles."], ["Cell Overview", "Cytosol", "Intracellular fluid portion of cytoplasm; site of many chemical reactions."], ["Cell Overview", "Organelle", "Specialized subcellular structure with a characteristic shape and function."], ["Cell Overview", "Nucleus", "Large organelle containing DNA and chromosomes."], ["Membrane", "Lipid bilayer", "Basic membrane structure made primarily of phospholipids, cholesterol, and glycolipids."], ["Membrane", "Integral protein", "Protein embedded in the lipid bilayer."], ["Membrane", "Transmembrane protein", "Integral protein that spans the entire lipid bilayer."], ["Membrane", "Peripheral protein", "Protein attached to the inner or outer membrane surface without spanning the bilayer."], ["Membrane", "Glycoprotein", "Membrane protein with an attached carbohydrate group projecting extracellularly."], ["Membrane", "Glycocalyx", "Carbohydrate-rich 'sugary coating' formed by glycolipids and glycoproteins."], ["Membrane", "Membrane protein functions", "Channels/carriers, receptors, enzymes, linkers, and cell-identity markers."], ["Transport", "Passive process", "Membrane transport that does not require direct cellular energy input."], ["Transport", "Active process", "Transport using cellular energy, often ATP, to move substances against their concentration gradient."], ["Transport", "Diffusion", "Net movement of particles from higher to lower concentration."], ["Transport", "Factors affecting diffusion", "Gradient steepness, temperature, particle mass, surface area, and diffusion distance."], ["Transport", "Simple diffusion", "Movement directly through membrane or pores down a gradient without a carrier."], ["Transport", "Facilitated diffusion", "Passive movement down a gradient through a channel or carrier protein."], ["Transport", "Channel-mediated facilitated diffusion", "Passive movement through a membrane channel protein."], ["Transport", "Carrier-mediated facilitated diffusion", "A solute binds a carrier, which changes shape and releases it on the other side."], ["Transport", "Osmosis", "Net movement of water through a selectively permeable membrane toward lower water concentration/higher solute concentration."], ["Transport", "Aquaporin", "Integral membrane channel specialized for water movement."], ["Transport", "Isotonic solution", "RBC maintains normal shape because there is no net water gain or loss."], ["Transport", "Hypotonic solution", "Water enters the cell; RBC may swell and undergo hemolysis."], ["Transport", "Hypertonic solution", "Water leaves the cell; RBC shrinks and undergoes crenation."], ["Transport", "Sodium-potassium pump", "Na+/K+ ATPase; major primary active transport pump that uses ATP."], ["Transport", "Primary active transport", "Directly uses ATP hydrolysis to move substances against gradients."], ["Transport", "Secondary active transport", "Uses energy stored in an ion gradient created by primary active transport."], ["Transport", "Symporter", "Secondary transporter moving two substances in the same direction."], ["Transport", "Antiporter", "Secondary transporter moving substances in opposite directions."], ["Vesicles", "Endocytosis", "Movement of material into the cell in vesicles formed from the plasma membrane."], ["Vesicles", "Receptor-mediated endocytosis", "Selective endocytosis after ligands bind specific membrane receptors."], ["Vesicles", "Phagocytosis", "Cellular ingestion of solid particles; 'cell eating.'"], ["Vesicles", "Pinocytosis", "Bulk-phase uptake of extracellular fluid; 'cell drinking.'"], ["Vesicles", "Exocytosis", "Vesicles fuse with plasma membrane and release contents extracellularly."], ["Vesicles", "Transcytosis", "Endocytosis on one side of a cell followed by exocytosis on the other."], ["Cytoskeleton", "Microfilaments", "Smallest cytoskeletal filaments; commonly composed of actin and involved in shape/movement."], ["Cytoskeleton", "Intermediate filaments", "Cytoskeletal fibers providing mechanical strength and stability."], ["Cytoskeleton", "Microtubules", "Largest cytoskeletal elements; help organize cell, move organelles, form cilia/flagella and mitotic spindle."], ["Organelles", "Centrosome", "Microtubule-organizing center near nucleus; contains two centrioles plus pericentriolar material."], ["Organelles", "Cilia", "Numerous short projections that move fluid across the cell surface."], ["Organelles", "Flagellum", "Long projection that moves an entire cell; human example is sperm tail."], ["Organelles", "Ribosome", "Site of protein synthesis; composed of rRNA and proteins."], ["Organelles", "Rough ER", "ER studded with ribosomes; synthesizes/processing proteins for secretion, membranes, and organelles."], ["Organelles", "Smooth ER", "ER without ribosomes; synthesizes lipids/steroids, detoxifies substances, and stores/releases Ca2+ in muscle."], ["Organelles", "Golgi complex", "Modifies, sorts, and packages molecules from ER into vesicles for destinations."], ["Organelles", "Lysosome", "Golgi-derived vesicle with digestive enzymes; digests endocytosed material and worn-out organelles."], ["Organelles", "Autophagy", "Lysosomal digestion and recycling of worn-out organelles."], ["Organelles", "Peroxisome", "Contains oxidases and catalase; oxidizes fatty acids/amino acids and detoxifies hydrogen peroxide."], ["Organelles", "Proteasome", "Protein complex that degrades damaged, faulty, or unneeded proteins."], ["Organelles", "Mitochondrion", "Site of aerobic cellular respiration and production of most cellular ATP; also participates in apoptosis."], ["Organelles", "Cristae", "Folds of the inner mitochondrial membrane increasing surface area for ATP-producing reactions."], ["Organelles", "Mitochondrial matrix", "Fluid-filled inner compartment containing enzymes for cellular respiration."], ["Nucleus", "Nuclear envelope", "Double membrane surrounding nucleus; outer layer is continuous with rough ER."], ["Nucleus", "Nuclear pore", "Regulated opening controlling movement between nucleus and cytoplasm."], ["Nucleus", "Chromatin", "Diffuse DNA-protein material present during interphase."], ["Nucleus", "Chromosome", "Condensed DNA-protein structure containing genes."], ["Nucleus", "Gene", "Hereditary DNA sequence that can be expressed to produce a functional product."], ["Nucleus", "Nucleolus", "Nuclear region where ribosomal subunits are produced."], ["Protein Synthesis", "Gene expression", "Use of a gene's DNA information to synthesize a specific protein."], ["Protein Synthesis", "Transcription", "Copying DNA information into RNA; occurs in the nucleus."], ["Protein Synthesis", "RNA polymerase", "Enzyme that catalyzes transcription."], ["Protein Synthesis", "mRNA", "Messenger RNA; carries the protein-coding message from DNA to ribosome."], ["Protein Synthesis", "rRNA", "Ribosomal RNA; combines with proteins to form ribosomes."], ["Protein Synthesis", "tRNA", "Transfer RNA; carries an amino acid and uses an anticodon to pair with an mRNA codon."], ["Protein Synthesis", "Codon", "Three-nucleotide sequence in mRNA specifying an amino acid or stop signal."], ["Protein Synthesis", "Anticodon", "Three-nucleotide sequence on tRNA complementary to an mRNA codon."], ["Protein Synthesis", "AUG", "Start codon; also codes for methionine."], ["Protein Synthesis", "Translation", "Use of mRNA at a ribosome to assemble amino acids into a protein."], ["Protein Synthesis", "P site", "Ribosomal site holding tRNA carrying the growing polypeptide."], ["Protein Synthesis", "A site", "Ribosomal site accepting the next aminoacyl-tRNA."], ["Protein Synthesis", "E site", "Ribosomal exit site for departing tRNA."], ["Protein Synthesis", "Intron", "Noncoding segment removed from pre-mRNA."], ["Protein Synthesis", "Exon", "Expressed segment retained and spliced into mature mRNA."], ["Cell Division", "Somatic cell", "Any body cell other than a germ cell."], ["Cell Division", "Germ cell", "Gamete or precursor destined to become a gamete."], ["Cell Division", "Mitosis", "Nuclear division producing genetically identical nuclei with the same chromosome number."], ["Cell Division", "Cytokinesis", "Division of cytoplasm after nuclear division."], ["Cell Division", "Meiosis", "Two-step reproductive division reducing chromosome number by half to form gametes."], ["Cell Division", "Interphase", "Cell-cycle period of growth, normal function, and DNA replication before division."], ["Cell Division", "Prophase", "Chromosomes condense; spindle develops; nuclear structures disappear."], ["Cell Division", "Metaphase", "Chromosomes align at the cell equator."], ["Cell Division", "Anaphase", "Sister chromatids separate and move toward opposite poles."], ["Cell Division", "Telophase", "Chromosomes reach poles, decondense, and new nuclei form."], ["Cell Death", "Apoptosis", "Orderly, genetically programmed cell death."], ["Cell Death", "Necrosis", "Uncontrolled cell death caused by injury or disease."], ["Cell Aging", "Cellular aging", "Progressive decline associated with accumulated damage, altered cellular function, and limits on replication."]];let filtered=[...ALL],i=0;
const key='ch3_flash_status';let status=JSON.parse(localStorage.getItem(key)||'{}');
function id(c){return c[1]}
function save(){localStorage.setItem(key,JSON.stringify(status))}
function apply(){
 const q=document.getElementById('search').value.toLowerCase(),cat=document.getElementById('cat').value;
 filtered=ALL.filter(c=>(!cat||c[0]===cat)&&(!q||c.join(' ').toLowerCase().includes(q)));i=0;render();
}
function render(){
 if(!filtered.length){document.getElementById('ft').textContent='No cards found';document.getElementById('ba').textContent='';return}
 const c=filtered[i];document.getElementById('fc').textContent=c[0];document.getElementById('bc').textContent=c[0];document.getElementById('ft').textContent=c[1];document.getElementById('ba').textContent=c[2];
 const el=document.getElementById('card');el.classList.remove('flipped','known','review');if(status[id(c)])el.classList.add(status[id(c)]);
 const known=Object.values(status).filter(x=>x==='known').length,rev=Object.values(status).filter(x=>x==='review').length;
 document.getElementById('stats').textContent=`Card ${i+1} of ${filtered.length} • ${known} known • ${rev} needs review`;
}
function flip(){document.getElementById('card').classList.toggle('flipped')}function next(){if(filtered.length){i=(i+1)%filtered.length;document.getElementById('card').classList.remove('flipped');render()}}
function prev(){if(filtered.length){i=(i-1+filtered.length)%filtered.length;document.getElementById('card').classList.remove('flipped');render()}}
function mark(v){if(filtered.length){status[id(filtered[i])]=v;save();render()}}function clearMark(){if(filtered.length){delete status[id(filtered[i])];save();render()}}
function shuffle(){for(let j=filtered.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[filtered[j],filtered[k]]=[filtered[k],filtered[j]]}i=0;render()}
document.getElementById('search').addEventListener('input',apply);document.getElementById('cat').addEventListener('change',apply);render();
</script></body></html>
